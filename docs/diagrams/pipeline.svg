  <title id="diagram-title">育种文献数据管线全景</title>
  <desc id="diagram-desc">统一版本化契约约束 PDF 抽取及 legacy、omics、merged 数据迁移。文献依次经过解析、任务准备、候选抽取、结构修复、证据核验、原子记录组装与关联、记录及数据集校验，输出 JSONL、审计报告和错误记录。有效记录派生关系表、图谱三元组、证据语料和文档聚合，错误经人工复核支持后续迭代。OCR 文本由外部提供，QA 由下游生成。</desc>
