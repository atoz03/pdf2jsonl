<title id="diagram-title" data-en="Breeding literature data pipeline">育种文献数据管线全景</title>
<desc id="diagram-desc" data-en="A shared versioned contract governs PDF extraction and legacy, omics and merged imports. Extraction parses pages, prepares an agent brief, produces candidates, repairs structure, verifies evidence, builds linked atomic records and validates records and datasets. Accepted JSONL carries explicit statements and entity anchors and feeds tables, a knowledge graph, an annotated corpus, QA seeds and document bundles. Rejections and audit reports support manual review and iteration. OCR text is supplied externally; natural-language QA generation is downstream.">统一版本化契约约束 PDF 抽取及 legacy、omics、merged 数据迁移。文献依次经过解析、任务准备、候选抽取、结构修复、证据核验、原子记录组装与关联、记录及数据集校验，输出 JSONL、审计报告和错误记录。有效记录带有显式关系语句与实体锚点，派生关系表、知识图谱、带标注的证据语料、问答种子和文档聚合，错误经人工复核支持后续迭代。OCR 文本由外部提供，自然语言问答由下游生成。</desc>

  <footer id="page-note">图源为可编辑的 HTML 内嵌矢量图。浏览器支持中英文切换、原始尺寸查看与 SVG 下载；仓库中的静态图由 <code>make diagram</code> 从本文件导出。</footer>
</main>
<script>
  const diagram = document.getElementById('pipeline-diagram');
  const translatable = [...diagram.querySelectorAll('[data-en]')];
  for (const node of translatable) node.dataset.zh = node.textContent;
  let locale = 'zh';
  const labels = {
    zh: {title:'数据管线全景',size:'原始尺寸',fit:'适应宽度',download:'下载 SVG',back:'返回 README',note:'图源为可编辑的 HTML 内嵌矢量图。支持中英文切换、原始尺寸查看和 SVG 下载；运行 make diagram 可重新生成仓库中的静态图。'},
    en: {title:'Data pipeline overview',size:'Actual size',fit:'Fit to width',download:'Download SVG',back:'Back to README',note:'Editable HTML with inline vectors. Switch language, inspect at actual size, or download SVG. Run make diagram to regenerate the repository images.'}
  };
  function applyLanguage(lang) {
    locale = lang === 'en' ? 'en' : 'zh';
    document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
    diagram.setAttribute('lang', document.documentElement.lang);
    for (const node of translatable) node.textContent = node.dataset[locale];
    document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.lang === locale)));
    document.getElementById('page-label').textContent = labels[locale].title;
    document.getElementById('download').textContent = labels[locale].download;
    document.getElementById('readme-link').textContent = labels[locale].back;
    document.getElementById('readme-link').href = locale === 'zh' ? '../../README.md' : '../../README.en.md';
    document.getElementById('page-note').textContent = labels[locale].note;
    updateSizeLabel();
  }
  function updateSizeLabel() {
    const actual = document.getElementById('canvas').classList.contains('actual');
    const button = document.getElementById('size-toggle');
    button.textContent = labels[locale][actual ? 'fit' : 'size'];
    button.setAttribute('aria-pressed',String(actual));
  }
  document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click',() => applyLanguage(button.dataset.lang)));
  document.getElementById('size-toggle').addEventListener('click',() => {
    document.getElementById('canvas').classList.toggle('actual'); updateSizeLabel();
  });
  document.getElementById('download').addEventListener('click',() => {
    const copy = diagram.cloneNode(true);
    copy.querySelectorAll('[data-en],[data-zh]').forEach(node => {node.removeAttribute('data-en');node.removeAttribute('data-zh');});
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href=url; link.download=locale==='zh'?'pipeline.svg':'pipeline.en.svg';
    link.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
  });
  applyLanguage(new URLSearchParams(location.search).get('lang'));
</script>
