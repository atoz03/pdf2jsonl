# Documentation-only functional classification, following the user's four categories.
# Lists are multi-select. These labels describe direct uses, not every possible downstream consumer.
# New fields need an explicit entry; bdc generate/check verifies coverage and tag validity.
classification_format: 1
tags:
  research_1:
    label_zh: 研究内容1
    description_zh: 服务育种数据标准、元数据与质量治理、本体组织、实体对齐和知识融合。
  research_2:
    label_zh: 研究内容2
    description_zh: 服务育种科学智能体的证据推理、假设生成、实验规划、记忆检索和工具执行。
  iteration:
    label_zh: 迭代优化
    description_zh: 为后续版本演进、重新抽取、质量反馈、复现、纠错、去重和外部数据回填准备。
  general:
    label_zh: 通用字段
    description_zh: 跨任务复用的身份与来源信息、育种对象、试验上下文、测量或方法参数。
