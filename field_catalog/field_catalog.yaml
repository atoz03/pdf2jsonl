rules:
- id: R001
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 论文记录须有物理页码与最小原文证据
  when:
    all:
    - field: common.source_type
      equals: paper
    - field: common.record_kind
      in: [claim, observation, method, analysis_result, phenotype_observation, environment_observation, genotype_observation]
  require: [common.source_page, common.source_quote]
  source_zh: 填写原则2：论文记录补充 source_title、物理 source_page 和最小 source_quote
  ambiguities: [AMB-019]
- id: R002
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 论文证据记录须有文献标题（高频观测记录可省略）
  when:
    all:
    - field: common.source_type
      equals: paper
    - field: common.record_kind
      in: [claim, observation, method, analysis_result]
  require: [common.source_title]
  source_zh: 填写原则2；source_title定义：高频观测记录可由source_id连接来源元数据，避免逐行重复
  ambiguities: [AMB-020]
- id: R003
  kind: require_any_when
  severity: warning
  basis: inferred
  title_zh: 表图数值宜用行列键定位
  when:
    all:
    - present: common.source_table_figure
    - field: common.record_kind
      in: [phenotype_observation, environment_observation, genotype_observation]
  require_any: [common.source_table_row_key, common.source_table_column_key]
  source_zh: 填写原则2：表图数值使用页码、表号、行列键定位
- id: R004
  kind: paired
  severity: error
  basis: explicit
  title_zh: 规范化范围上下界成对填写
  fields: [common.normalized_min_value, common.normalized_max_value]
  source_zh: normalized_min_value/normalized_max_value定义：与上界/下界成对填写
- id: R005
  kind: lte
  severity: error
  basis: definitional
  title_zh: 规范化范围下界不大于上界
  fields: [common.normalized_min_value, common.normalized_max_value]
  source_zh: 范围拆成上下界
- id: R006
  kind: mutually_exclusive
  severity: error
  basis: explicit
  title_zh: 数值测量与非数值测量二选一
  fields: [common.measurement_value, common.measurement_text]
  source_zh: measurement_text定义：与measurement_value二选一
- id: R007
  kind: require_any_when
  severity: warning
  basis: inferred
  title_zh: 表型/环境单值观测应含一个测量值
  when:
    field: common.record_kind
    in: [phenotype_observation, environment_observation]
  require_any: [common.measurement_value, common.measurement_text]
  source_zh: 记录粒度：一个材料/样本在环境、位点或测量维度上的单值观测；measurement_* 为 C
  ambiguities: [AMB-008]
- id: R008
  kind: required_when
  severity: warning
  basis: inferred
  title_zh: 表型/环境单值观测应含测量项名称
  when:
    field: common.record_kind
    in: [phenotype_observation, environment_observation]
  require: [common.measurement_name]
  source_zh: measurement_name定义：本行单一测量项名称（C）
  ambiguities: [AMB-008]
- id: R009
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 基因型剂量须给出倍性与计数等位基因
  when:
    present: common.genotype_dosage
  require: [common.ploidy, common.dosage_allele]
  source_zh: genotype_dosage定义：需按倍性及等位基因方向解释
- id: R010
  kind: lte
  severity: error
  basis: explicit
  title_zh: 基因型剂量不得超过倍性
  fields: [common.genotype_dosage, common.ploidy]
  source_zh: ploidy定义：剂量取值不得超过该值
- id: R011
  kind: equals_any_field
  severity: error
  basis: explicit
  title_zh: 剂量等位基因须与参考或替代等位一致
  field: common.dosage_allele
  candidates: [common.reference_allele, common.alternate_allele]
  source_zh: dosage_allele定义：必须与本行参考或替代等位一致
- id: R012
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 单一变异ID须绑定参考组装
  when:
    present: common.variant_id
  require: [common.genome_assembly]
  source_zh: variant_id定义：须绑定genome_assembly
- id: R013
  kind: required_when
  severity: warning
  basis: explicit
  title_zh: 物理区间应结合组装版本使用
  when:
    any_present: [common.locus_interval_start_bp, common.locus_interval_end_bp]
  require: [common.genome_assembly]
  source_zh: locus_interval_*_bp定义：须结合组装版本使用；genome_assembly定义：未报告时省略
  ambiguities: [AMB-009]
- id: R014
  kind: lte
  severity: error
  basis: definitional
  title_zh: 物理区间起点不大于终点
  fields: [common.locus_interval_start_bp, common.locus_interval_end_bp]
  source_zh: 区间起点/终点
- id: R015
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 规范化值必须保留原文值
  when:
    any_present: [common.normalized_value, common.normalized_min_value, common.normalized_max_value]
  require: [common.original_value]
  source_zh: 填写原则4：数值字段保留原文值与单位；标准化不得覆盖原文
- id: R016
  kind: required_when
  severity: error
  basis: explicit
  title_zh: 规范化单位必须保留原文单位
  when:
    present: common.normalized_unit
  require: [common.original_unit]
  source_zh: 填写原则4：保留原文值与单位
- id: R017
  kind: mutually_exclusive
  severity: warning
  basis: inferred
  title_zh: 单一规范值与规范范围通常不并存
  fields: [common.normalized_value, common.normalized_min_value]
  source_zh: normalized_value定义：不承载范围或公式
- id: R018
  kind: required_when
  severity: warning
  basis: inferred
  title_zh: 资产清单应含URI、格式、大小与SHA-256
  when:
    field: common.record_kind
    equals: asset_manifest
  require: [common.asset_uri, common.asset_format, common.asset_size_bytes, common.asset_sha256]
  source_zh: asset_uri/asset_format/asset_size_bytes/asset_sha256 均为 C；填写原则6
  ambiguities: [AMB-008]
- id: R019
  kind: require_any_when
  severity: warning
  basis: inferred
  title_zh: 基因型观测应含调用或剂量
  when:
    field: common.record_kind
    equals: genotype_observation
  require_any: [common.genotype_call, common.genotype_dosage]
  source_zh: genotype_call定义：单样本单变异的基因型调用（C）
  ambiguities: [AMB-008]
- id: R020
  kind: forbid_pattern
  severity: error
  basis: explicit
  title_zh: '来源与资产标识不得为本地路径、file: URI 或压缩包 member:'
  fields: [common.source_id, common.source_uri, common.source_asset_id, common.asset_uri, common.data_access_uri]
  pattern: '^(?:file:|[A-Za-z]:[\\/]|/|~[\\/]|\.\.?[\\/])|(?:^|[^A-Za-z])member:'
  source_zh: '填写原则3：不写盘符、本机路径、file: URI 或压缩包 member:'
- id: R021
  kind: forbid_pattern
  severity: error
  basis: explicit
  title_zh: 访问URI不得含凭证
  fields: [common.data_access_uri, common.asset_uri, common.source_uri]
  pattern: ^[A-Za-z][A-Za-z0-9+.\-]*://[^/@\s]+:[^/@\s]*@
  source_zh: data_access_uri定义：不含凭证；source_uri定义：不含凭证
- id: R022
  kind: forbid_pattern
  severity: warning
  basis: explicit
  title_zh: 资产URI不应含临时签名
  fields: [common.asset_uri]
  pattern: (?i)[?&](x-amz-signature|x-goog-signature|signature|sig|se|token)=
  source_zh: asset_uri定义：不含临时签名的持久大文件URI
- id: R023
  kind: forbid_pattern
  severity: error
  basis: explicit
  title_zh: '不内嵌Base64或data: URI'
  fields: ['*']
  pattern: ^data:[^,]*;base64,|^[A-Za-z0-9+/\r\n]{2048,}={0,2}$
  source_zh: 填写原则6：大文件和媒体不内嵌 Base64
- id: R024
  kind: grain_matches_kind
  severity: error
  basis: explicit
  title_zh: 记录粒度须与记录类型一致
  fields: [common.record_grain, common.record_kind]
  source_zh: 记录粒度一节；record_grain定义：evidence_unit、observation_unit、asset_unit或tool_unit
  ambiguities: [AMB-007]
- id: R025
  kind: unique_within_dataset
  severity: error
  basis: explicit
  title_zh: 同一记录ID的修订号在数据集中唯一
  fields: [common.record_id, common.record_version]
  source_zh: record_version定义：同一record_id的修订序号；历史版本不可覆盖
- id: R026
  kind: single_value_per_group
  severity: error
  basis: explicit
  title_zh: 同一泄漏组只能落入一个语料划分
  group_by: transform.leakage_group_id
  field: transform.corpus_split
  source_zh: corpus_split定义：同一泄漏组只能落入一个集合
- id: R027
  kind: lte
  severity: error
  basis: definitional
  title_zh: 遗传图谱区间起点不大于终点
  fields: [common.locus_interval_start_cm, common.locus_interval_end_cm]
  source_zh: legacy Q-03 interval{start, end}
- id: R028
  kind: lte
  severity: error
  basis: definitional
  title_zh: 峰起点不大于峰终点
  fields: [omics.peak_start, omics.peak_end]
  source_zh: omics 模板 epigenomics_specific.peak_start/peak_end
  ambiguities: [AMB-026]
- id: R029
  kind: required_when
  severity: warning
  basis: inferred
  title_zh: 单点或峰物理坐标宜注明参考组装
  when:
    any_present: [common.variant_position_bp, omics.peak_start, omics.peak_end]
  require: [common.genome_assembly]
  source_zh: 类比 R013：物理坐标须结合组装版本使用；genome_assembly 未报告时省略
  ambiguities: [AMB-009, AMB-026]
- id: R030
  kind: equals_any_field
  severity: warning
  basis: inferred
  title_zh: 效应等位基因宜为参考或替代等位之一
  field: common.effect_allele
  candidates: [common.reference_allele, common.alternate_allele]
  source_zh: 类比 R011；多等位位点可能不满足
  ambiguities: [AMB-026]
- id: R031
  kind: references_resolve
  severity: warning
  basis: definitional
  title_zh: 证据链引用的记录应能在数据集中找到
  fields: [agent.evidence_record_ids, skills.method_record_ids]
  target: common.record_id
  source_zh: agent.evidence_record_ids 定义：支撑本断言的原子记录ID，用于检查证据链是否闭合
  since: 3.2.0
  ambiguities: [AMB-033]
- id: R032
  kind: required_when
  severity: warning
  basis: inferred
  title_zh: 引文含限定措辞的结论宜保留限定原文
  when:
    all:
    - field: common.record_kind
      equals: claim
    - field: common.source_quote
      matches: '(?i)\b(may|might|could|possibl[ey]|putative|likely|probabl[ey]|potential(ly)?|suggest(s|ed|ing)?|appears? to|seems? to|requires? (further )?validation)\b|可能|推测|或许|有待'
  require: [agent.claim_qualifier_text]
  source_zh: 填写原则5：关联证据不能自动升级为因果结论；TRACE（arXiv:2605.29656）Qualifier 要素
  since: 3.2.0
  ambiguities: [AMB-035]
ambiguities:
- id: AMB-001
  status: decided
  title_zh: 记录布局
  finding_zh: v3 以 `common.record_id` 等字段路径描述记录，但未给出实例。
  resolution_zh: '字段路径 `group.field` 对应 JSON 嵌套对象 `{"common": {"record_id": ...}}`；嵌套同时消解 agent.workflow_steps 与 skills.workflow_steps 的叶名冲突。'
  since: 3.0.0
- id: AMB-002
  status: decided
  title_zh: 版本字符串格式
  finding_zh: v3 文档写作 v3.0.0，legacy 固定 v1.0.0，omics 模板写作 2.0.0。
  resolution_zh: common.schema_version 使用不带前缀的语义化版本（如 3.1.0）；解析器接受 v 前缀输入并规范化。
  since: 3.0.0
- id: AMB-003
  status: decided
  title_zh: 缺失值约定
  finding_zh: v3 精简版说明：未报告字段省略，不使用空字符串、null 或猜测值；omics 模板用 null，legacy 用空串/空数组占位。
  resolution_zh: 采用 v3：省略。Schema 拒绝 null、空串、空数组和空对象；修复步骤可删除它们并记录。
  since: 3.0.0
- id: AMB-004
  status: provisional
  title_zh: array_evidence 元素结构未定义
  finding_zh: agent.supporting_evidence/contradictory_evidence 仅定义为“原文证据及定位”。
  resolution_zh: 暂用复用 common.source_* 字段名的元素结构（source_quote 必填，source_page 或 source_locator 至少一项）；待数据负责人确认。
  since: 3.0.0
- id: AMB-005
  status: provisional
  title_zh: array_step 元素结构未定义
  finding_zh: agent.workflow_steps/skills.workflow_steps 仅描述为有序步骤；agent.workflow_dependencies 指向“步骤ID”。
  resolution_zh: 暂用 {step_id, step_no, step_name, step_desc(必填), inputs, outputs, tool_name}；字段名参照 legacy experimental_steps/dag_steps。
  since: 3.0.0
- id: AMB-006
  status: provisional
  title_zh: array_parameter 键名与 value_kind 词表
  finding_zh: skills.parameters 定义列出组成（参数名、原生类型值、value_kind、单位、约束和来源），未给出键名与 value_kind 取值。
  resolution_zh: 暂用键 {name(必填), value, value_kind, unit, constraint, source}；value 为原生标量，公式为字符串；value_kind 为开放字符串。
  since: 3.0.0
- id: AMB-007
  status: open
  title_zh: analysis_result 的记录粒度
  finding_zh: 记录粒度一节将 analysis_result 与 tool_spec 并列为“分析结果或课题三工具说明”。
  resolution_zh: tool_spec→tool_unit；analysis_result 不指定粒度，管线省略 record_grain 并在 missing_fields 标注 ambiguous_in_contract。
  since: 3.0.0
- id: AMB-008
  status: open
  title_zh: 多数条件必填（C）字段未给出条件
  finding_zh: dataset_id、dataset_version、record_version、record_grain、environment_id、sample_id、trait_id、variant_id、observation_time、measurement_*、genotype_call、asset_*、ploidy、等位基因等为 C 但未说明条件。
  resolution_zh: 仅将来源明确陈述的条件编码为 error；依据字段分组推断的条件编码为 warning；其余不强制。
  since: 3.0.0
- id: AMB-009
  status: open
  title_zh: 组装版本冲突
  finding_zh: locus_interval_*_bp：“须结合组装版本使用”；genome_assembly：“未报告时省略”。
  resolution_zh: 规则 R013 为 warning：论文报告 bp 区间但未报告组装时，保留 bp 值并提示复核，不猜测组装。
  since: 3.0.0
- id: AMB-010
  status: provisional
  title_zh: 仅有中文标签的封闭词表
  finding_zh: review_status、extraction_method、finding_kind、hypothesis_origin、relation_polarity、relation_evidence_type、entity_alignment_status、graph_status、qa_review_status、qa_difficulty 仅列中文取值。
  resolution_zh: '由仓库提议英文代码（code_status: proposed），以 warning 级执行；确认后可升级为 error（需主版本号变更）。'
  since: 3.0.0
- id: AMB-011
  status: decided
  title_zh: 稳定ID与定位符语法未定义
  finding_zh: record_id 的数据来源为“来源主键与稳定ID规则”，source_locator/source_span 未给语法。
  resolution_zh: 仓库约定：record_id = rec_ + sha256(source_id|record_kind|locator核心|规范化引文|序号) 前32位；source_locator 采用 `page=5;section=...;table=...;row=...;col=...`；source_span 采用 `page=5;char=120-240`。见 docs/architecture.md。
  since: 3.0.0
- id: AMB-012
  status: decided
  title_zh: 无专门的 relation 记录类型
  finding_zh: v3 record_kind 列表不含 relation；图谱主谓宾位于 transform 组，predicate_label 为 I（人工判断）。
  resolution_zh: 科学关系以 claim 记录承载 transform.subject_*/object_* 等字段表示，不新增记录类型；legacy relations[] 同样迁移为 claim 记录。
  since: 3.0.0
- id: AMB-013
  status: decided
  title_zh: 记录缺少契约名称字段
  finding_zh: v3 记录只携带 schema_version，无法自描述所属契约族；legacy 与 omics 模板的版本号格式也不同（v1.0.0 / 2.0.0）。
  resolution_zh: 3.1.0 新增 common.schema_name（N，系统填写，常量为契约名）；PDF 画像要求必填，目录层面保持可选以免改变 3.0.0 记录形态。
  since: 3.1.0
- id: AMB-014
  status: open
  title_zh: finding_text 为原文还是改述
  finding_zh: agent.finding_text 为 D，定义为“单一结果的独立陈述”。
  resolution_zh: 管线要求逐字 source_quote 作为证据；finding_text 可为自足陈述但必须能由引文支持，并做数值/名称出现性检查。
  since: 3.0.0
- id: AMB-015
  status: decided
  title_zh: 规范化目标单位未定义
  finding_zh: normalized_* 的数据来源为“单位转换规则”，但规则未提供。
  resolution_zh: 仓库维护 vocabularies/units.yaml（每个量纲一个规范单位）；未知单位不换算（填写原则4：无法换算时不强行标准化）。
  since: 3.0.0
- id: AMB-016
  status: open
  title_zh: measurements 标准词表缺失
  finding_zh: measurement_unit 定义：须与measurements的标准词表匹配；该词表未提供。
  resolution_zh: 暂不强制。
  since: 3.0.0
- id: AMB-017
  status: decided
  title_zh: extraction_confidence 为 G 但产生于抽取过程
  finding_zh: 可获得性 G（后续生成），数据来源为“抽取模型结果”。
  resolution_zh: PDF 抽取仅在后端实际报告置信度时写入（角色 generated），绝不补造。
  since: 3.0.0
- id: AMB-018
  status: decided
  title_zh: source_file 与本地路径禁令
  finding_zh: 需求提到 source_file；填写原则3禁止在来源标识中写本地路径。
  resolution_zh: 记录内使用 source_file_sha256 与可选 source_asset_id；本地文件名只写入运行清单（manifest）。
  since: 3.0.0
- id: AMB-019
  status: decided
  title_zh: 表图数值是否需要引文
  finding_zh: 填写原则2：论文记录补充最小 source_quote；表图数值使用页码、表号、行列键定位。
  resolution_zh: 所有论文证据/观测记录均要求 source_quote（表格单元格文本即引文），表号与行列键为推荐（R003 warning）。
  since: 3.0.0
- id: AMB-020
  status: decided
  title_zh: source_title 对高频观测可省略
  finding_zh: source_title定义：高频观测记录可由source_id连接来源元数据。
  resolution_zh: R002 仅对 evidence 类记录要求标题；observation_unit 类记录不要求。
  since: 3.0.0
- id: AMB-021
  status: decided
  title_zh: PDF 的 source_type
  finding_zh: source_type 为 D，示例 paper/experiment_record/tool_description。
  resolution_zh: pdf_extraction 画像默认 paper，可由操作者覆盖并记录在 manifest。
  since: 3.0.0
- id: AMB-022
  status: open
  title_zh: crop_name 单值且必填
  finding_zh: 多作物论文如何填写 crop_name 未说明。
  resolution_zh: 文档级 crop_name 由抽取给出，可在记录级覆盖；无法确定时记录不通过校验，不猜测。
  since: 3.0.0
- id: AMB-023
  status: open
  title_zh: source_file_sha256 的算法
  finding_zh: 定义仅写“原始文件内容校验和”，算法由字段名暗示。
  resolution_zh: 按 SHA-256 十六进制校验（definitional）。
  since: 3.0.0
- id: AMB-024
  status: open
  title_zh: association_vs_causation 取值未定义
  finding_zh: 定义：明确区分统计关联与因果验证。
  resolution_zh: 不设词表；PDF 抽取画像不暴露该 I 字段。
  since: 3.0.0
- id: AMB-025
  status: decided
  title_zh: 精简版字段集
  finding_zh: 精简版为 259 字段中人工挑选的 157 字段。
  resolution_zh: compact 画像逐字保留 157 字段列表；后续版本仅追加治理字段（如 schema_name）并在画像中注明。
  since: 3.0.0
- id: AMB-026
  status: provisional
  title_zh: omics 模板只有字段名
  finding_zh: omics_metadata_template.json 仅列出分组与字段名（值均为 null），无定义、类型、单位、必填性或取值范围；fold change 是否 log2、比例是否 0–1 等均未说明。
  resolution_zh: 来源于 omics_v2 的字段一律 provisional：定义为字段名直译，类型由仓库按字段名指派（数值不明单位时用原文字符串），仅添加由定义本身决定的约束（概率 0–1、计数非负）。待数据负责人确认后再提升为 verified。
  since: 3.1.0
- id: AMB-027
  status: open
  title_zh: omics 与 v3 字段语义部分重叠
  finding_zh: treatment（v3 合并原文）与 treatment_type/dose/duration；data_accessions（论文报告，D）与 sequence_accessions（未来数据库，F）；effect_direction（原文）与 relation_polarity（I，规范码）；replication_status 与 environment_stability 存在重叠。
  resolution_zh: 并存而不合并：原文字段与规范化/判断字段分开保存，不自动换算；重叠关系在映射文件中标注，待确认后决定是否弃用其一。
  since: 3.1.0
- id: AMB-028
  status: decided
  title_zh: legacy doc_type 与 v3 source_type 粒度不同
  finding_zh: v3 source_type 取 paper/experiment_record/tool_description；legacy doc_type 为期刊论文、学位论文、综述等（附录 A-1）。
  resolution_zh: 新增 common.source_document_type（词表 document_type，沿用 A-1 代码）细分 source_type=paper，不修改 source_type。
  since: 3.1.0
- id: AMB-029
  status: decided
  title_zh: legacy 页码为出版物页码
  finding_zh: legacy doc_meta.pages 与 evidence_spans[].page 使用期刊页码；v3 source_page 规定为 PDF 物理页码。
  resolution_zh: 出版物页码迁入 common.source_page_range，绝不写入 source_page；迁移证据位置需提供页码偏移（--page-offset），否则不填 source_page 并记录残留。
  since: 3.1.0
- id: AMB-030
  status: provisional
  title_zh: 作物词表代码
  finding_zh: legacy 附录 A-2 仅有中文作物/畜禽名（含猪、牛等非作物），v3 crop_name 为自由文本“作物名称”。
  resolution_zh: 新增开放词表 crop_name：代码为仓库拟定的英文名，中文名与常用英文名作为别名；开放词表只提示不报错，crop_name 仍可填写原文。
  since: 3.1.0
- id: AMB-031
  status: decided
  title_zh: omics 单值测量字段
  finding_zh: 模板中 expression_value、protein_abundance、metabolite_abundance、peak_signal、methylation_level、feature_value 等均为单一测量值。
  resolution_zh: 按 v3 单值观测设计映射到 common.measurement_value / measurement_unit，并由 measurement_name 说明测量量；不为每种组学重复定义数值字段。
  since: 3.1.0
- id: AMB-032
  status: provisional
  title_zh: 字段的功能归属
  finding_zh: 数据负责人要求每个键说明作用及其服务的四项功能：课题二、课题三、派生（知识图谱/关系库/问答/语料/三元组）与我方自身迭代（sources/project/record_functions.md）。v3 只在分组说明与 downstream_zh 列中给出消费方；3.1.0 起新增的字段没有下游说明。
  resolution_zh: 每个字段标注 key_role（键的作用，含到图谱/关系表/三元组/问答语料的投影）与 serves（服务的功能），课题二/三卡片字段另标 card；各功能的分面取自研究内容（sources/project/research_contents.md），字段分面 = 键角色的分面 ∩ serves。由分组与 downstream_zh 推出的功能和卡片为来源标注，bdc check 保证不被删除或改写；其余由仓库补充，生成文档中单独列出。自身迭代即课题一（数据标准与质量评价、本体构建、知识融合），v3 中的“课题一”与“数据治理”归入此项：数据负责人已确认（2026-09-30，我方即课题一）。各字段由仓库补充的功能与卡片仍待确认。
  since: 3.2.0
- id: AMB-033
  status: provisional
  title_zh: 证据链的论证要素（TRACE）
  finding_zh: 课题二需要证据链，但契约未说明哪些字段构成结论、依据、推理依据、支撑、限定与反驳；论文结论的限定措辞与作者陈述的局限没有逐字字段，结果与产生它的方法之间也没有记录级链接。TRACE（arXiv:2605.29656）以 Toulmin 六要素与 Flavell 两要素分析推理结构。
  resolution_zh: argument_role 按 TRACE 八要素标注字段在证据链中的作用；新增 agent.claim_qualifier_text、agent.stated_limitations（D，逐字）与 skills.method_record_ids（N，管线按候选引用解析）；R031 检查证据链引用能否闭合。论证结构审计只报告要素覆盖与链接闭合，不是质量或真值评分（TRACE 自述局限：结构完整不代表结论正确）。
  since: 3.2.0
- id: AMB-034
  status: open
  title_zh: 实体提及与规范 ID 的逐项对应
  finding_zh: common.gene_names 与 gene_ids、trait_names 与 trait_ids 等数组之间没有逐项对应规则；transform 的 subject/object 一条记录只能表达一对实体，图谱与关系库无法确定每个提及对应哪个节点。
  resolution_zh: 新增 transform.entity_links（array_entity_link）逐项记录提及、来源字段、实体类型、规范 ID 与对齐状态；不对 *_names 与 *_ids 做位置对齐假设。item 结构为仓库拟定，待确认。
  since: 3.2.0
- id: AMB-035
  status: provisional
  title_zh: 结论限定措辞的识别
  finding_zh: 结论中的限定措辞（may、suggesting a possible、可能）若在抽取中丢失，图谱与问答会把假设当作事实；v3 未定义限定措辞字段与词表。
  resolution_zh: agent.claim_qualifier_text 逐字保存限定措辞；R032 用仓库拟定的中英文限定词正则提示缺失（warning，inferred），词表待确认。
  since: 3.2.0
- id: AMB-036
  status: provisional
  title_zh: 知识融合的冲突消解与动态更新
  finding_zh: 课题一的知识融合包括冲突消解与动态更新（research_contents.md），但 v3 只有 conflict_record_ids（哪些记录冲突）与 record_version（修订序号），没有消解结果，也无法在重新抽取使 record_id 变化时追溯新旧记录。
  resolution_zh: 新增 common.conflict_resolution_status（I，词表 conflict_resolution_status，代码为仓库拟定）、common.replaces_record_ids（N，新记录指向被取代的旧记录）与 common.record_updated_at（N，版本时间）。旧记录不删除；取代与消解都保留证据链。
  since: 3.2.0
