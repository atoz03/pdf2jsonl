          minLength: 1
        constraint:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
      required: [name]
  array_entity_link:
    maturity: provisional
    ambiguities: [AMB-034]
    item:
      properties:
        mention:
          type: string
          minLength: 1
        source_field:
          type: string
