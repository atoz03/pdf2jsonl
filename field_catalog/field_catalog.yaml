# =============================================================================
# field_catalog.yaml — the single source of truth for the breeding literature data contract.
#
# Everything else (JSON Schema, profiles, Markdown/CSV dictionaries, Skill briefs, candidate
# schemas, validators) is generated from or resolved against this file.
#
# Editing rules
#   * Never change the meaning of a released field; deprecate it and add a new one instead.
#   * Any edit here requires a VERSION bump + CHANGELOG entry + `bdc release` (CI enforces this).
#   * `maturity: verified` definitions are verbatim from sources/fields_v3 and must not be edited.
#   * Record unresolved questions in `ambiguities` instead of inventing semantics.
# Layout: `path` "group.field" maps to nested JSON {"group": {"field": value}} (AMB-001).
# =============================================================================
catalog_format: 1
contract:
  name: breeding-literature-record
  title_zh: 生物育种文献原子化 JSONL 数据契约
  record_layout: nested_groups
  missing_value_policy: omit
  baseline_zh: v3.0.0 已验证字段基线（259 个逻辑字段）；3.1.0 起合并 legacy v1 与 omics 2.0.0 候选字段（provisional）
  ambiguities: [AMB-001, AMB-003]
codes:
  availability:
    D:
      label_zh: 直接抽取
      label_en: directly extracted
    N:
      label_zh: 标准化
      label_en: normalized / system-assigned
    I:
      label_zh: 人工判断
      label_en: human judgment
    G:
      label_zh: 后续生成
      label_en: generated downstream
    F:
      label_zh: 未来来源
      label_en: future external source
  availability_note_zh: D/N/I/G/F 表示直接抽取、标准化、人工判断、后续生成和未来来源，不是质量分数（v3 填写原则7）。
  requirement:
    Y:
      label_zh: 必填
      label_en: required on every published row
    C:
      label_zh: 条件必填
      label_en: conditionally required
    N:
      label_zh: 可选
      label_en: optional
  status:
    active:
      label_zh: 现行
    deprecated:
      label_zh: 已弃用（保留以兼容历史数据）
  maturity:
    verified:
      label_zh: 来自 v3 已验证基线，定义逐字保留
    provisional:
      label_zh: 仓库合并或补充，定义由仓库撰写，待数据负责人确认
  origin:
    fields_v3:
      label_zh: v3 字段规范（字段.zip）
    legacy_v1:
      label_zh: legacy v1 文档级 JSONL（Jsonl.zip）
    omics_v2:
      label_zh: 多组学候选模板 2.0.0
    repository:
      label_zh: 仓库治理需要新增
  function:
    topic2:
      label_zh: 课题二：科学智能体
      short_zh: 课题二
      label_en: Topic 2 — breeding scientific agent
      description_zh: 推理、规划、记忆与自主执行一体的育种科学智能体；主要读取 common + agent，用于知识状态、假设卡、实验设计卡、结果分析卡和证据约束
      downstream_labels: [全部, 课题二]
      source_ref: sources/project/research_contents.md#L7
      facets:
        reasoning:
          label_zh: 推理层
          description_zh: 把育种知识、群体遗传规律与实验反馈编译为结构化研究状态；知识状态机约束假设生成与因果推断
        planning:
          label_zh: 规划层
          description_zh: 依据研究状态与历史轨迹分解任务、设计实验，生成可执行计划
        memory:
          label_zh: 记忆层
          description_zh: 分层记忆：长程育种知识、中程实验状态、短程操作上下文
        execution:
          label_zh: 执行层
          description_zh: 对接技能 API，完成工具调用、结果校验与策略修正
    topic3:
      label_zh: 课题三：模型与工具技能化
      short_zh: 课题三
      label_en: Topic 3 — skillification of breeding models and tools
      description_zh: 育种组件的标准交互接口、技能封装与注册；主要读取 common + skills，用于基因组预测、GWAS、群体遗传等工具的标准输入输出、参数语义和验证
      downstream_labels: [全部, 课题三]
      source_ref: sources/project/research_contents.md#L11
      facets:
        interface:
          label_zh: 标准接口
          description_zh: 数据输入、参数配置的统一规则；标准输入、输出与参数语义
        orchestration:
          label_zh: 工作流编排
          description_zh: 工作流编排；依据智能体工作计划自动生成自适应接口，贯通规划、操作、计算与结果
        output:
          label_zh: 结果与可视化
          description_zh: 结果产物、指标与可视化的统一接口
        registry:
          label_zh: 技能注册中心
          description_zh: 支持大模型驱动智能编排的技能注册中心
        cards:
          label_zh: 卡片流转
          description_zh: 科学假设卡、实验设计卡与结果分析卡的结构化流转
    derivation:
      label_zh: 派生：知识图谱 / 关系库 / 问答 / 语料 / 三元组
      short_zh: 派生
      label_en: Derivation — knowledge graph, relational tables, QA pairs, corpora, triples
      description_zh: 决定派生产物结构的键（节点、边、限定、证据 ID、来源位置、训练划分和授权）；v3 要求派生保留条件限定、证据 ID、来源位置、训练划分和授权信息
      downstream_labels: [全部, 图谱, GraphRAG, 语料, 问答, 模型训练, 全部转化]
      source_ref: sources/project/record_functions.md#L4
      facets:
        kg:
          label_zh: 知识图谱
          description_zh: 节点、边、边限定与证据来源
        rdb:
          label_zh: 关系数据库
          description_zh: 表、主键、外键与关联表
        triple:
          label_zh: 三元组
          description_zh: 主语-谓词-宾语及其限定
        qa:
          label_zh: 问答对
          description_zh: 问题、答案、支持证据与答案范围
        corpus:
          label_zh: 语料
          description_zh: 语料块、出处、训练划分、去重与许可
    iteration:
      label_zh: 自身迭代（课题一：数据标准、本体与知识融合）
      short_zh: 自身迭代
      label_en: Our own iteration — Topic 1 data standards, ontology and knowledge fusion
      description_zh: 课题一的数据标准与质量评价、本体构建、知识融合（知识抽取、实体对齐、冲突消解、动态更新），形成可追溯、可演化的 AI-Ready 知识库；v3 中标为“课题一”（抽取、质控、复核）与“数据治理”的字段属于此项
      downstream_labels: [全部, 课题一, 数据治理]
      source_ref: sources/project/research_contents.md#L3
      facets:
        standard:
          label_zh: 数据标准与元数据规范
          description_zh: 多源育种数据类型梳理与元数据规范
        quality:
          label_zh: 质量评价
          description_zh: 质量评价体系：质控码、复核状态、缺失审计
        ontology:
          label_zh: 本体构建
          description_zh: 基因-性状-环境-品种等多层概念与关系
        fusion:
          label_zh: 知识融合
          description_zh: 知识抽取、实体对齐、冲突消解与动态更新
        traceability:
          label_zh: 可追溯与可演化
          description_zh: 来源回查、版本、重跑与回填
  function_note_zh: serves 列出字段服务的功能。由分组与 v3 downstream_zh（下游用途）推出的功能为来源功能，bdc check 保证不被删除；其余为仓库按键角色补充（AMB-032）。派生（derivation）只标注决定派生结构的键；任何字段在转为关系表或图谱属性时都会随记录携带。
  card:
    hypothesis:
      label_zh: 科学假设卡
      downstream_labels: [假设卡, 假设生成, 竞争假设]
    experiment_design:
      label_zh: 实验设计卡
      downstream_labels: [实验设计卡]
    result_analysis:
      label_zh: 结果分析卡
      downstream_labels: [结果分析卡, 假设评价]
  card_note_zh: card 标注课题二/三卡片流转（research_contents.md#L11）中字段进入哪张卡；downstream_zh 命中卡片标签的为来源标注，其余为仓库补充（AMB-032）。
  key_role_family:
    identity_provenance:
      label_zh: 身份与溯源
    breeding_fact:
      label_zh: 育种事实
    argument:
      label_zh: 论证与证据链
    method_skill:
      label_zh: 方法与技能
    derivation:
      label_zh: 派生结构
    governance:
      label_zh: 资产、治理与迭代
  key_role:
    record_identity:
      label_zh: 记录身份
      family: identity_provenance
      description_zh: 记录主键、记录类型、粒度与契约版本
      facets:
        topic2: [memory]
        topic3: [interface]
        derivation: [kg, rdb, triple, qa, corpus]
        iteration: [standard, traceability]
      projection:
        kg: 记录/语句节点 IRI 与类型
        rdb: 主键；按 record_kind 分表
        triple: '三元组主语（记录本身）'
        qa_corpus: 支持证据引用的目标 ID
    source_identity:
      label_zh: 来源标识
      family: identity_provenance
      description_zh: 来源的稳定标识与文件指纹
      facets:
        topic2: [memory]
        topic3: [interface]
        derivation: [kg, rdb, corpus]
        iteration: [traceability, fusion]
      projection:
        kg: Document 节点 ID
        rdb: sources 表主键；记录表外键
        triple: '(记录, fromSource, 来源)'
        qa_corpus: 引用来源
    bibliographic:
      label_zh: 书目信息
      family: identity_provenance
      description_zh: 标题、作者、年份、刊物等书目元数据
      facets:
        topic2: [memory]
        topic3: [registry]
        derivation: [kg, rdb, corpus]
        iteration: [traceability]
      projection:
        kg: Document 节点属性；作者、机构节点
        rdb: sources 表列
        triple: '(来源, hasTitle/hasAuthor, 值)'
        qa_corpus: 语料元数据与检索过滤
    evidence_locator:
      label_zh: 证据定位
      family: identity_provenance
      description_zh: 页码、章节、表图、行列键、逐字引文与字符偏移
      facets:
        topic2: [reasoning]
        topic3: [interface]
        derivation: [kg, qa, corpus]
        iteration: [quality, traceability]
      projection:
        kg: 语句的 provenance（页、节、表、引文）
        rdb: 证据列
        triple: '语句限定（reification）'
        qa_corpus: 引文、chunk 锚点与答案出处
    entity_mention:
      label_zh: 实体提及
      family: breeding_fact
      description_zh: 作物、种质、群体、性状、基因、标记、QTL 等实体的原文名称
      facets:
        topic2: [reasoning, memory]
        topic3: [interface]
        derivation: [kg, rdb, triple, qa]
        iteration: [ontology, fusion]
      projection:
        kg: 实体节点标签（类型由字段决定）
        rdb: 实体表 + 记录-实体关联表
        triple: '主语/宾语文字'
        qa_corpus: 检索关键词与答案实体
    entity_id:
      label_zh: 实体标识
      family: breeding_fact
      description_zh: 实体的规范 ID 或原文登记号
      facets:
        topic2: [memory]
        topic3: [interface]
        derivation: [kg, rdb, triple]
        iteration: [ontology, fusion]
      projection:
        kg: 实体节点 IRI 与合并键
        rdb: 实体表主键/外键
        triple: '主语/宾语 ID'
        qa_corpus: 实体归一与去重
    entity_attribute:
      label_zh: 实体属性
      family: breeding_fact
      description_zh: 实体的坐标、类型、等位基因、引物、系谱等属性
      facets:
        topic2: [memory]
        topic3: [interface]
        derivation: [kg, rdb, qa]
        iteration: [ontology]
      projection:
        kg: 实体节点属性
        rdb: 实体表列
        triple: '(实体, hasX, 字面值)'
        qa_corpus: 事实型问答答案
    reference_frame:
      label_zh: 参考体系
      family: breeding_fact
      description_zh: 坐标、基因 ID 与本体术语所依赖的组装、注释、ID 体系或本体版本
      facets:
        topic3: [interface]
        derivation: [kg, rdb]
        iteration: [standard, ontology, fusion]
      projection:
        kg: 坐标与 ID 的解释上下文
        rdb: 与坐标/ID 同行的列或维表
        triple: '语句限定'
        qa_corpus: 答案适用范围；升级组装或本体时重映射的依据
    context_key:
      label_zh: 试验上下文 ID
      family: breeding_fact
      description_zh: 研究、试验、环境、样本、小区、重复等上下文的稳定 ID
      facets:
        topic2: [memory, planning]
        topic3: [interface, orchestration]
        derivation: [kg, rdb]
        iteration: [fusion]
      projection:
        kg: 研究/试验/环境/样本节点 ID
        rdb: 维表外键
        triple: '(记录, inTrial/inEnvironment, ID)'
        qa_corpus: 多跳路径的连接点
    condition:
      label_zh: 条件限定
      family: breeding_fact
      description_zh: 群体、环境、时间、处理、组织等使结论成立的条件
      facets:
        topic2: [reasoning, planning]
        topic3: [interface]
        derivation: [kg, triple, qa]
        iteration: [ontology]
      projection:
        kg: 边限定（relation_qualifiers 的来源）
        rdb: 维表列或事实表列
        triple: '语句限定'
        qa_corpus: qa_answer_scope 与 chunk 条件
    measurement:
      label_zh: 测量值
      family: breeding_fact
      description_zh: 原文值与单位、规范化值与单位、分型调用等单值观测
      facets:
        topic2: [reasoning, execution]
        topic3: [interface, output]
        derivation: [rdb, qa]
        iteration: [quality]
      projection:
        kg: 观测节点的字面值属性
        rdb: 事实表列（原文值与规范值分列）
        triple: '(观测, hasValue, 字面值)'
        qa_corpus: 数值型问答答案
    statistic:
      label_zh: 统计量
      family: breeding_fact
      description_zh: LOD、PVE、效应、P/q 值、指标值等统计结果
      facets:
        topic2: [reasoning, execution]
        topic3: [output]
        derivation: [kg, rdb, qa]
        iteration: [quality]
      projection:
        kg: 语句/边属性
        rdb: 结果表列
        triple: '语句限定'
        qa_corpus: 证据强度说明
    assertion:
      label_zh: 作者陈述
      family: argument
      description_zh: 论文作者的结论、假设、机制、解释、局限等陈述
      facets:
        topic2: [reasoning, memory]
        topic3: [cards]
        derivation: [kg, qa, corpus]
        iteration: [fusion]
      projection:
        kg: Claim 节点文本
        rdb: claims 表文本列
        triple: '主谓宾抽取的原文依据'
        qa_corpus: chunk 与答案原文
    appraisal:
      label_zh: 证据评价
      family: argument
      description_zh: 对结论的人工判读：证据类型与强度、关联或因果、外推边界
      facets:
        topic2: [reasoning]
        topic3: [cards]
        derivation: [kg, qa]
        iteration: [quality, fusion]
      projection:
        kg: Claim 节点评价属性
        rdb: 评价列（人工判断）
        triple: '语句限定（关联/因果、证据层级）'
        qa_corpus: 答案可信度与范围
    record_link:
      label_zh: 记录关联
      family: argument
      description_zh: 指向其他记录或证据的 ID（支撑、矛盾、来源、方法、问答支持）
      facets:
        topic2: [reasoning, memory]
        topic3: [orchestration]
        derivation: [kg, rdb, triple, qa]
        iteration: [fusion, traceability]
      projection:
        kg: 语句之间的边（supports / contradicts / producedBy / derivedFrom）
        rdb: 关联表或外键
        triple: '(记录, supportedBy, 记录)'
        qa_corpus: support_ids 与多跳推理路径
    study_design:
      label_zh: 试验设计
      family: argument
      description_zh: 实验目标、设计、处理组、对照组、重复与观测指标
      facets:
        topic2: [planning]
        topic3: [cards, orchestration]
        derivation: [rdb, qa]
        iteration: [standard]
      projection:
        kg: Experiment 节点属性
        rdb: experiments 表
        triple: '(实验, hasControl/hasTreatment, 值)'
        qa_corpus: 实验设计问答
    method_spec:
      label_zh: 方法与工具
      family: method_skill
      description_zh: 方法、算法、软件、参数、质控与验证方案
      facets:
        topic2: [planning, execution]
        topic3: [interface, registry]
        derivation: [kg, rdb]
        iteration: [standard]
      projection:
        kg: Method/Software 节点与属性
        rdb: methods 表
        triple: '(结果, usesMethod, 方法)'
        qa_corpus: 方法问答
    interface_spec:
      label_zh: 技能接口
      family: method_skill
      description_zh: 工具的输入输出格式、结构定义、注册 ID 与运行环境
      facets:
        topic2: [execution]
        topic3: [interface, orchestration, output, registry]
        derivation: [rdb]
        iteration: [standard]
      projection:
        kg: Skill 节点与输入输出定义
        rdb: 技能注册表
        triple: '(技能, accepts/produces, 格式)'
        qa_corpus: 技能调用说明
    relation:
      label_zh: 关系三元组
      family: derivation
      description_zh: 主语、谓词、宾语、极性、限定与图谱语句 ID
      facets:
        topic2: [reasoning]
        derivation: [kg, triple, qa]
        iteration: [ontology, fusion]
      projection:
        kg: 边本身
        rdb: relations 表
        triple: '直接输出为三元组'
        qa_corpus: 多跳推理路径
    entity_alignment:
      label_zh: 实体对齐
      family: derivation
      description_zh: 实体提及到规范 ID 的对齐状态、来源、类型与同义词
      facets:
        derivation: [kg, rdb]
        iteration: [ontology, fusion]
      projection:
        kg: 节点合并与同义词
        rdb: 实体映射表
        triple: 'sameAs / skos 映射'
        qa_corpus: 检索同义词扩展
    corpus_qa:
      label_zh: 语料与问答
      family: derivation
      description_zh: 语料块与候选问答对的内容、位置与可答性
      facets:
        derivation: [qa, corpus]
        iteration: [traceability]
      projection:
        kg: 不入图（可挂 provenance）
        rdb: chunks / qa 表
        triple: '—'
        qa_corpus: 直接构成语料块与问答对
    derivation_control:
      label_zh: 派生控制
      family: derivation
      description_zh: 训练划分、去重、泄漏组、许可与派生产物审核状态
      facets:
        derivation: [kg, qa, corpus]
        iteration: [quality]
      projection:
        kg: 发布状态过滤
        rdb: 过滤列
        triple: '发布过滤'
        qa_corpus: 训练划分、去重、许可与审核
    asset:
      label_zh: 资产索引
      family: governance
      description_zh: 大文件与数据集的 URI、格式、校验和与模态
      facets:
        topic2: [memory]
        topic3: [interface, orchestration]
        derivation: [rdb]
        iteration: [standard, traceability]
      projection:
        kg: Asset/Dataset 节点
        rdb: assets 表
        triple: '(记录, hasAsset, URI)'
        qa_corpus: 不内嵌，仅引用
    governance:
      label_zh: 授权与访问
      family: governance
      description_zh: 来源许可与访问级别
      facets:
        derivation: [qa, corpus]
        iteration: [standard]
      projection:
        kg: 访问控制属性
        rdb: 行级权限列
        triple: '许可声明'
        qa_corpus: 能否进入语料与训练
    lifecycle:
      label_zh: 生产与迭代
      family: governance
      description_zh: 抽取方式、运行与批次、质控码、缺失审计、复核状态与数据集版本
      facets:
        topic2: [memory]
        topic3: [interface]
        derivation: [kg, rdb, qa, corpus]
        iteration: [standard, quality, fusion, traceability]
      projection:
        kg: 不入图（审计属性）
        rdb: 审计列
        triple: '—'
        qa_corpus: 过滤未审核记录
  argument_role:
    claim:
      label_zh: 结论
      label_en: Claim
      framework: toulmin
      description_zh: 被论证的结论、断言或答案
    data:
      label_zh: 依据
      label_en: Data/Evidence
      framework: toulmin
      description_zh: 具体事实、观测或给定信息（逐字证据、观测值、统计结果、支撑记录）
    warrant:
      label_zh: 推理依据
      label_en: Warrant
      framework: toulmin
      description_zh: 连接依据与结论的推理（统计检验、证据类型、方法、前提假设）
    backing:
      label_zh: 支撑
      label_en: Backing
      framework: toulmin
      description_zh: 对推理依据的支持（独立验证、跨环境重复、阈值标定）
    qualifier:
      label_zh: 限定
      label_en: Qualifier
      framework: toulmin
      description_zh: 确定性或不确定性的表达与适用范围（限定措辞、关联或因果、证据强度）
    rebuttal:
      label_zh: 反驳
      label_en: Rebuttal
      framework: toulmin
      description_zh: 反例、例外、局限或替代解释
    monitoring:
      label_zh: 监控
      label_en: Monitoring
      framework: flavell
      description_zh: 生产过程中的自检（质控码、缺失审计、抽取置信度）
    evaluation:
      label_zh: 评估
      label_en: Evaluation
      framework: flavell
      description_zh: 对结果质量或正确性的判断（复核状态与复核说明）
  argument_role_source: 'TRACE: Toulmin-based Reasoning Assessment through Constructive Elements (Kim & Yang, ICML 2026, arXiv:2605.29656) — Toulmin 六要素 + Flavell 元认知两要素（AMB-033）'
groups:
  common:
    title_zh: 通用
    purpose_zh: 来源、作物、种质、环境、测量、资产、质量和版本治理
