            minLength: 1
        outputs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        tool_name:
          type: string
          minLength: 1
      required: [step_desc]
  array_parameter:
    maturity: provisional
    ambiguities: [AMB-006]
    item:
