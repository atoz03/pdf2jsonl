<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下游派生 · pdf2jsonl</title>
<meta name="description" content="What bdc derive builds from one set of evidence-anchored records: statements, a knowledge graph, a research workflow, an annotated corpus, QA seeds and relational tables.">
<!--__HEAD__-->
<style>
/* ---------------------------------------------------------------- hero: one set of records fans out */
.fan { position: relative; display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 110px; margin-top: 34px; align-items: center; }
.fan-beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fan-beams path { fill: none; stroke-width: 1.8; stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; opacity: .75; }
.fan-beams circle { fill: var(--surface); stroke-width: 2; }
.recs { padding: 16px; position: relative; z-index: 1; box-shadow: var(--shadow-3); }
.recs h3 { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.recs h3 .mono { font-weight: 600; color: var(--ink-3); font-size: 11.5px; margin-left: auto; }
.rr { display: flex; gap: 9px; align-items: center; font-size: 12.5px; padding: 7px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); margin-top: 7px; color: var(--ink-2); }
.rr i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.rr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr.more { justify-content: center; color: var(--ink-3); background: none; border-style: dashed; }
.hooks-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.hooks-row .tag { font-size: 11px; }
.hooks-row small { width: 100%; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.outs { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
a.card.out { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 2px 18px; padding: 10px 16px 10px 12px; align-items: center; color: inherit; }
.out:hover { text-decoration: none; }
.out .mini { grid-row: 1 / span 2; width: 96px; height: 52px; }
.out .t { display: flex; align-items: center; gap: 8px; font-weight: 680; font-size: 15px; }
.out .t svg { color: var(--brand); }
.out .t .f { font: 11px var(--mono); color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.out .s { font-size: 12.5px; color: var(--ink-3); grid-column: 2; }
.out .n { grid-row: 1 / span 2; grid-column: 3; font-size: 28px; font-weight: 760; letter-spacing: -.03em; line-height: 1; text-align: right; }
.out .n small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-top: 3px; }
@media (max-width: 980px) { .fan { grid-template-columns: 1fr; gap: 18px; } .fan-beams { display: none; } }
@media (max-width: 560px) { a.card.out { grid-template-columns: 64px minmax(0, 1fr) auto; } .out .mini { width: 64px; } .out .t .f { display: none; } }

/* ---------------------------------------------------------------- 01 hooks */
.hook-quote { font: 19px/1.9 var(--serif); padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.hook-quote .sp { padding: 1px 2px; }
.hook-legend { margin-top: 10px; }
.hook-legend .sp { font-size: 12.5px; padding: 1px 6px; }
table.hooks td:first-child { white-space: nowrap; font-weight: 650; }
table.hooks td .mono { overflow-wrap: anywhere; }
.val { font: 12.5px var(--mono); color: var(--ink); }
.val.none { color: var(--ink-3); font-family: var(--sans); font-style: italic; }
.reads { display: flex; flex-wrap: wrap; gap: 4px; }
.reads a { font-size: 11.5px; }

/* ---------------------------------------------------------------- 02 statements & the predicate ladder */
.stm { padding: 16px 18px; }
.stm .q { font: 15.5px/1.8 var(--serif); }
.stm .spo { margin-top: 12px; }
.stm .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); }
.hedge { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 9px; background: var(--amber-soft); border: 1px solid var(--amber-line); color: var(--ink); }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ladder li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); position: relative; }
.ladder li .lv { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 12px var(--mono); color: #fff; background: var(--lc); }
.ladder li b { font: 650 13px var(--mono); display: block; }
.ladder li span { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.ladder li .cnt { font: 700 18px var(--sans); color: var(--ink); min-width: 28px; text-align: right; }
.ladder li.zero { opacity: .55; }
.ladder li.zero .cnt { color: var(--ink-3); font-weight: 500; }

/* ---------------------------------------------------------------- 03 graph */
.g-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.g-controls .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-right: 2px; }
.g-legend { margin-top: 12px; }
.g-legend .dotc { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.g-legend .sq { width: 10px; height: 10px; border-radius: 2px; border: 2px solid var(--ink-3); display: inline-block; margin-right: 6px; vertical-align: -1px; }

/* ---------------------------------------------------------------- 04 workflow */
.wf-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.hyp { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
.hyp .card { border-left: 3px solid var(--c5); }
.hyp b { font-size: 14px; display: block; margin: 4px 0 6px; }

/* ---------------------------------------------------------------- 05 corpus */
.chunks { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.chunk { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.chunk .q { font: 14.5px/1.75 var(--serif); }
.chunk .meta { font-size: 11.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; }
.chunk .ents { display: flex; flex-wrap: wrap; gap: 4px; }
.ent { display: inline-block; white-space: nowrap; margin: 1px 0; font: 600 11px var(--mono); padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--c, var(--e)) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c, var(--e)) 45%, transparent); color: var(--ink-2); }
/* entity types share the graph's colours */
.ty0 { --c: var(--c1); } .ty1 { --c: var(--c2); } .ty2 { --c: var(--c3); } .ty3 { --c: var(--c4); } .ty4 { --c: var(--c5); } .ty5 { --c: var(--c6); } .ty6 { --c: var(--c7); } .ty7 { --c: var(--c8); }

/* ---------------------------------------------------------------- 06 QA cards */
.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.qa { perspective: 1200px; border: 0; background: none; padding: 0; text-align: left; min-height: 168px; }
.qa-in { position: relative; width: 100%; height: 100%; min-height: 168px; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.qa.flip .qa-in { transform: rotateY(180deg); }
.qa-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-1); padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; }
.qa-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--brand-soft), var(--surface) 70%); border-color: var(--brand-line); }
.qa:hover .qa-face { box-shadow: var(--shadow-2); }
.qa .q { font: 14.5px/1.7 var(--serif); color: var(--ink); }
.qa .ans { font: 650 15px/1.6 var(--serif); color: var(--brand-ink); background: var(--surface); border: 1.5px solid var(--brand); border-radius: 6px; padding: 0 5px; }
:root[data-theme="dark"] .qa .ans { color: var(--brand-2); }
.qa .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
.qa .hint { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; color: var(--brand); font-weight: 600; }
.qa .hint svg { width: 14px; height: 14px; }

/* ---------------------------------------------------------------- 07 tables */
.tbl-cell { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.tbl-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; font-size: 13px; color: var(--ink-2); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.files a { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: 12.5px var(--mono); color: var(--ink); min-width: 0; }
.files a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files a:hover { border-color: var(--brand-line); text-decoration: none; }
.files a svg { color: var(--brand); }
</style>
</head>
<body data-page="outputs">
<header id="top"></header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
"use strict";
const { T, esc, icon, fmt, DATA, $, $$, json, annotate, kindTag, reviewTag, kindLabel, kindColor, fieldLink, summary, clip, av, count, short } = K;
const X = DATA.derived, C = X.counts, RECS = DATA.records, W = DATA.workflow;
const RID = Object.fromEntries(RECS.map(r => [r.common.record_id, r]));
const VREC = Object.fromEntries((DATA.validation_records || []).map(v => [v.record_id, v]));
const CANDS = DATA.candidates || [];
const STM = Object.fromEntries(X.statements.map(s => [s.record_id, s]));
const CHUNK = {};
for (const c of X.corpus) for (const id of c.chunk_support_ids) CHUNK[id] = CHUNK[id] || c;
const getp = (rec, path) => { const i = path.indexOf("."); return (rec[path.slice(0, i)] || {})[path.slice(i + 1)]; };
// The contract states rule titles in Chinese only; English glosses for the two rules quoted here.
const RULE_EN = { R033: "a relation whose subject and object are both given should name its predicate (verbatim, label or ontology ID)", R034: "entity-marker and predicate offsets must match the text of source_quote" };
const STEM = (X.files[0] || "").replace(/^derived\//, "").split(".")[0];
const ANNOTATED = X.corpus.filter(c => (c.entities || []).length);

const recLink = id => RID[id] ? `<a href="#" data-rec="${esc(id)}" title="${esc(id)}">${esc(kindLabel(RID[id].common.record_kind))}: ${esc(clip(summary(RID[id]), 64))}</a>` : `<span class="mono">${esc(id)}</span>`;
const stmSpans = st => ["subject", "predicate", "object"].filter(k => (st.anchors || {})[k]).map(k => ({ start: st.anchors[k][0], end: st.anchors[k][1], cls: "sp-" + k,
  title: k === "predicate" ? `predicate · ${st.predicate}` : `${k} · ${st[k + "_type"] || T("未定类型", "untyped")} · ${st[k]}` }));
// entity types in the order the graph colours them
const TYPES = [...new Set(X.graph.nodes.filter(n => n.kind === "entity").map(n => n.type || "entity"))];
const tyClass = t => `ty${Math.max(0, TYPES.indexOf(t || "entity")) % 8}`;
const entSpans = c => (c.entities || []).map(e => ({ start: e.start, end: e.end, cls: `sp-entity ${tyClass(e.entity_type)}`, title: `${e.entity_type || "entity"}${e.source_field ? " · " + e.source_field : ""}` }));
// predicate status, from the most to the least settled
const STATUS = [
  ["ontology", "对齐到关系本体", "aligned to a relation ontology", "var(--brand)"],
  ["reviewed", "由复核人选定代码", "code chosen by a reviewer", "var(--ok)"],
  ["lexicon", "提示词与两端实体类型恰好匹配一个代码", "cue words and the entity types of both ends match exactly one code", "var(--c1)"],
  ["verbatim", "只有原文措辞；不经解释就没有合适的代码", "only the words of the paper; no code fits without interpretation", "var(--gold)"],
  ["unlabelled", "有主语和宾语，没有谓词", "subject and object without any predicate", "var(--clay)"],
];
const statusTag = k => { const s = STATUS.find(x => x[0] === k) || [k, k, k, "var(--ink-3)"]; return `<span class="tag" style="color:${s[3]};border-color:color-mix(in srgb, ${s[3]} 40%, transparent)" title="${esc(T(s[1], s[2]))}">${esc(k)}</span>`; };
function openRecord(id) {
  const r = RID[id] || (W && (W.records || []).find(x => x.common.record_id === id));
  if (!r) return;
  const inDemo = !!RID[id];
  K.recordDrawer(r, { links: inDemo ? [[`demo.html#rec=${encodeURIComponent(id)}`, T("在抽取演示中追踪它", "Trace it in the walk-through")]]
    : [[`papers.html#paper=${encodeURIComponent(W.paper_id)}&tab=workflow&rec=${encodeURIComponent(id)}`, T("在论文看板中打开", "Open in the paper dashboard")]] });
}

// ---------------------------------------------------------------- hero: fan-out
const MINI = {
  statements: `<svg class="mini" viewBox="0 0 96 62">${[12, 31, 50].map((y, i) => `<circle cx="14" cy="${y}" r="5" style="fill:var(--s)"/><path d="M20 ${y}H74" style="stroke:var(--p);stroke-width:2;stroke-dasharray:${i === 1 ? "3 3" : "none"}"/><circle cx="82" cy="${y}" r="5" style="fill:var(--o)"/>`).join("")}</svg>`,
  graph: `<svg class="mini" viewBox="0 0 96 62"><g style="stroke:var(--line-2);stroke-width:1.4">${[[20, 18, 50, 30], [50, 30, 80, 14], [50, 30, 76, 48], [20, 18, 22, 48], [22, 48, 50, 30]].map(([a, b, c, d]) => `<path d="M${a} ${b}L${c} ${d}"/>`).join("")}</g>
    <path d="M50 30L80 14" style="stroke:var(--brand);stroke-width:2"/>${[[20, 18, "--c1"], [50, 30, "--c3"], [80, 14, "--c2"], [76, 48, "--c4"], [22, 48, "--c7"]].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="6" style="fill:var(${c});stroke:var(--surface);stroke-width:2"/>`).join("")}</svg>`,
  workflow: `<svg class="mini" viewBox="0 0 96 62">${[[4, 8, "--ink-3"], [28, 8, "--c7"], [28, 34, "--c7"], [52, 20, "--c5"], [76, 8, "--c2"], [76, 34, "--brand"]].map(([x, y, c]) => `<rect x="${x}" y="${y}" width="16" height="18" rx="3" style="fill:var(--surface);stroke:var(${c});stroke-width:2"/>`).join("")}
    <g style="fill:none;stroke:var(--line-2);stroke-width:1.4"><path d="M20 17H28"/><path d="M44 17C48 17 48 29 52 29"/><path d="M44 43C48 43 48 29 52 29"/><path d="M68 29C72 29 72 17 76 17"/><path d="M68 29C72 29 72 43 76 43"/></g></svg>`,
  corpus: `<svg class="mini" viewBox="0 0 96 62">${[8, 22, 36, 50].map((y, i) => `<rect x="4" y="${y}" width="${[86, 78, 88, 52][i]}" height="5" rx="2.5" style="fill:var(--line)"/>`).join("")}
    <rect x="4" y="6" width="22" height="9" rx="3" style="fill:color-mix(in srgb, var(--e) 35%, transparent)"/><rect x="46" y="20" width="28" height="9" rx="3" style="fill:color-mix(in srgb, var(--e) 35%, transparent)"/><rect x="18" y="34" width="24" height="9" rx="3" style="fill:color-mix(in srgb, var(--e) 35%, transparent)"/></svg>`,
  qa: `<svg class="mini" viewBox="0 0 96 62"><rect x="4" y="10" width="88" height="5" rx="2.5" style="fill:var(--line)"/><rect x="4" y="24" width="20" height="5" rx="2.5" style="fill:var(--line)"/>
    <rect x="28" y="20" width="34" height="13" rx="3" style="fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5"/><rect x="66" y="24" width="26" height="5" rx="2.5" style="fill:var(--line)"/>
    <rect x="4" y="38" width="60" height="5" rx="2.5" style="fill:var(--line)"/><text x="45" y="30.5" text-anchor="middle" style="font:700 9px var(--mono);fill:var(--brand)">?</text></svg>`,
  tables: `<svg class="mini" viewBox="0 0 96 62"><rect x="4" y="4" width="88" height="54" rx="5" style="fill:var(--surface);stroke:var(--line-2);stroke-width:1.4"/><rect x="4" y="4" width="88" height="12" rx="5" style="fill:var(--surface-3)"/>
    <g style="stroke:var(--line-2);stroke-width:1">${[16, 30, 44].map(y => `<path d="M4 ${y}H92"/>`).join("")}${[34, 64].map(x => `<path d="M${x} 4V58"/>`).join("")}</g></svg>`,
};
function outputsList() {
  const rows = Object.values(X.tables).reduce((n, t) => n + t.total, 0);
  return [
    { id: "statements", icon: "link", t: T("陈述", "Statements"), n: C.statements, u: T("条", "statements"), s: T("主语 · 谓语 · 宾语，锚定在引文里", "subject · predicate · object, anchored in the quote"), f: "tables/statements.csv" },
    { id: "graph", icon: "graph", t: T("知识图谱", "Knowledge graph"), n: C.graph_nodes, u: T("个节点", "nodes"), s: T(`${C.graph_edges} 条边 · ${fmt(C.triples)} 个三元组`, `${C.graph_edges} edges · ${fmt(C.triples)} triples`), f: "graph.json · triples.jsonl" },
    { id: "workflow", icon: "flow", t: T("研究流程", "Research workflow"), n: C.workflow_nodes, u: T("个节点", "nodes"), s: T("背景 → 问题 → 假设 → 实验 → 结论", "background → question → hypothesis → experiment → conclusion"), f: "workflow.json" },
    { id: "corpus", icon: "quote", t: T("证据语料", "Evidence corpus"), n: C.corpus_chunks, u: T("段", "chunks"), s: T(`其中 ${ANNOTATED.length} 段带实体位置`, `${ANNOTATED.length} with entity offsets`), f: "corpus.jsonl" },
    { id: "qa", icon: "sparkle", t: T("问答种子", "QA seeds"), n: C.qa_seeds, u: T("条", "items"), s: T("完形填空，答案是原文片段", "cloze items; the answer is a span of the quote"), f: "qa.jsonl" },
    { id: "tables", icon: "table", t: T("关系表", "Relational tables"), n: Object.keys(X.tables).length, u: T("张", "tables"), s: T(`共 ${rows} 行，CSV`, `${rows} rows of CSV`), f: "tables/*.csv" },
  ];
}
function fanHTML() {
  const show = RECS.filter(r => r.common.record_kind !== "asset_manifest").slice(0, 6);
  return `<div class="fan reveal" id="fan"><svg class="fan-beams" id="fan-beams" aria-hidden="true"></svg>
    <div class="card recs" id="fan-src"><h3>${icon("layers")} ${T(`${RECS.length} 条记录`, `${RECS.length} records`)}<span class="mono">${esc(STEM)}.jsonl</span></h3>
      ${show.map(r => `<div class="rr"><i style="background:${kindColor(r.common.record_kind)}"></i><span>${esc(summary(r))}</span></div>`).join("")}
      <div class="rr more">+ ${RECS.length - show.length} ${T("条", "more")}</div>
      <div class="hooks-row"><small>${T("记录里的钩子", "Hooks in the records")}</small>
        <span class="tag" style="color:var(--s)">subject</span><span class="tag" style="color:var(--p)">predicate</span><span class="tag" style="color:var(--o)">object</span>
        <span class="tag">entity_links</span><span class="tag">*_record_ids</span><span class="tag">source_span</span></div></div>
    <div class="outs">${outputsList().map(o => `<a class="card lift out" href="#${o.id}" data-out="${o.id}">${MINI[o.id]}<span class="t">${icon(o.icon)}${esc(o.t)}<span class="f">${esc(o.f)}</span></span>
      <span class="s">${esc(o.s)}</span><span class="n">${fmt(o.n)}<small>${esc(o.u)}</small></span></a>`).join("")}</div></div>`;
}
function drawFan() {
  const fan = $("#fan"), svg = $("#fan-beams"), src = $("#fan-src");
  if (!fan || getComputedStyle(svg).display === "none") return;
  const box = fan.getBoundingClientRect(), s = src.getBoundingClientRect(), outs = $$(".out", fan);
  const x0 = s.right - box.left, colors = ["var(--brand)", "var(--c1)", "var(--c7)", "var(--gold)", "var(--c3)", "var(--c2)"];
  svg.innerHTML = outs.map((o, i) => {
    const r = o.getBoundingClientRect(), y0 = s.top - box.top + s.height * (0.22 + 0.56 * i / Math.max(1, outs.length - 1)), x1 = r.left - box.left, y1 = r.top - box.top + r.height / 2, mx = (x0 + x1) / 2;
    return `<path d="M${x0} ${y0}C${mx} ${y0} ${mx} ${y1} ${x1 - 4} ${y1}" style="stroke:${colors[i % colors.length]};animation-delay:${-i * .18}s"/><circle cx="${x0}" cy="${y0}" r="3.5" style="stroke:${colors[i % colors.length]}"/><circle cx="${x1 - 4}" cy="${y1}" r="3.5" style="stroke:${colors[i % colors.length]}"/>`;
  }).join("");
}

// ---------------------------------------------------------------- 01 hooks
const HOOKS = [
  ["主语 · 谓语 · 宾语", "Subject · predicate · object", ["transform.subject_mention", "transform.predicate_mention", "transform.object_mention"], ["agent，照抄引文", "the agent, verbatim from the quote"], [["statements", "陈述", "statements"], ["graph", "图谱的边", "graph edges"], ["qa", "问答", "QA"]]],

let hookRec = null;
function hookValue(r, paths) {

  if (!vals.length) return `<span class="val none">${T("这条记录没有（留空，不猜测）", "not in this record (left empty, never guessed)")}</span>`;
  return vals.map(([p, v]) => {
    if (p === "transform.entity_links") return `<span class="val">${v.length} × </span>${v.map(e => `<span class="ent ${tyClass(e.entity_type)}">${esc(e.mention)} · ${esc(e.entity_type || "entity")}${e.relation_role ? " · " + esc(e.relation_role) : ""}</span>`).join(" ")}`;
    if (p.endsWith("_record_ids")) return `${fieldLink(p, p.split(".")[1])} → ${v.map(recLink).join(" · ")}`;
    if (p === "common.source_quote") return "";

  }).filter(Boolean).join("<br>");
}

    <details class="fold"><summary>${T(`三元组：每种指向实体或记录的谓词各取一例（共 ${fmt(C.triples)} 个）`, `Triples: one per predicate that points at an entity or a record (of ${fmt(C.triples)})`)}</summary><div class="fold-body">
      <div class="table-wrap"><table class="tbl compact"><thead><tr><th>${T("主语", "Subject")}</th><th>${T("谓词", "Predicate")}</th><th>${T("宾语", "Object")}</th></tr></thead><tbody>
        ${X.entity_triples.map(t => `<tr><td class="small">${t.s.startsWith("rec:") ? recLink(t.s.slice(4)) : `<span class="mono">${esc(t.s)}</span>`}</td><td class="mono small">${esc(t.p)}</td>
          <td class="small">${String(t.o).startsWith("rec:") ? recLink(String(t.o).slice(4)) : `<span class="mono">${esc(t.o)}</span>`}</td></tr>`).join("")}</tbody></table></div></div></details>
  </section>

  <section class="section wrap" id="workflow">
    <div class="section-head"><span class="no">04</span><h2>${T("研究流程：从问题到结论的路线", "Research workflow: the route from question to conclusion")}</h2>
      <p>${T(`记录之间“回应、检验、方法、依据、前置”五种关联连起来，就是论文的研究流程。上面那篇示例的流程比较简单（${C.workflow_nodes} 个节点、${C.workflow_edges} 条边），这里展示另一篇完整陈述研究流程的合成论文，用的是语义核验之后的记录。点任意节点查看记录。`,
        `Link records by the five relations — addresses, tests, method, rests on, prerequisite — and the paper's research workflow appears. The walk-through paper has a simple one (${C.workflow_nodes} nodes, ${C.workflow_edges} edges); shown here is another synthetic paper that states its workflow in full, from its records after semantic verification. Click any node to open its record.`)}</p></div>
    ${workflowHTML()}
  </section>

  <section class="section wrap" id="corpus">
    <div class="section-head"><span class="no">05</span><h2>${T("证据语料：已经标注好的引文", "Evidence corpus: quotes that come annotated")}</h2>
      <p>${T("corpus.jsonl：每段不同的引文一条，带它支撑的记录、实体位置、陈述 ID 和泄漏组（一篇论文一组，保证同一篇论文不会同时出现在训练集和测试集）。",
        "corpus.jsonl: one chunk per distinct quote, with the records it supports, entity offsets, statement IDs and a leakage group (one per paper, so a paper never straddles a train/test split).")}</p></div>
    <div id="corpus-box">${corpusHTML()}</div>
  </section>

  <section class="section wrap" id="qa">
    <div class="section-head"><span class="no">06</span><h2>${T("问答种子：自带出处的完形填空", "QA seeds: cloze items that cite their records")}</h2>
      <p>${T("qa.jsonl：遮住引文中一个有锚点的答案。答案总是引文的一个片段，支撑记录总被引用，所以不看论文也能核对每一题。点卡片看答案。自然语言问句、多跳题和无答案题在下游生成。",
        "qa.jsonl: the quote with one anchored answer masked. The answer is always a span of the quote and the supporting records are always cited, so every item can be checked without the paper. Click a card for its answer. Natural-language, multi-hop and unanswerable items are generated downstream.")}</p></div>
    <div class="controls" style="margin-bottom:14px"><button type="button" class="chip" id="qa-all" aria-pressed="false">${icon("eye")} ${T("全部翻开", "Reveal all")}</button></div>
    ${qaHTML()}
  </section>

  <section class="section wrap" id="tables">
    <div class="section-head"><span class="no">07</span><h2>${T("关系表", "Relational tables")}</h2>
      <p>${T("每个字段按它的键角色落到对应的表里。名称数组和 ID 数组从不按位置配对；明确的配对来自实体标记。", "Every field lands in the table its key role names. Name and ID arrays are never paired by position; explicit pairs come from the entity markers.")}
        <a href="contract.html#roles">${T("键角色是什么", "What key roles are")} →</a></p></div>
    <div id="tables-box">${tablesHTML()}</div>
  </section>

  <section class="section wrap" id="files">
    <div class="section-head"><span class="no">08</span><h2>${T("文件，以及留给下游的部分", "The files, and what stays downstream")}</h2>
      <p>${T(`构建本站时运行 <code>bdc derive examples/output/${esc(STEM)}.jsonl --out derived/</code> 写出（derive format ${esc(X.derive_format)}）。`, `Written by <code>bdc derive examples/output/${esc(STEM)}.jsonl --out derived/</code> when this site was built (derive format ${esc(X.derive_format)}).`)}</p></div>
    <div class="files">${X.files.map(f => { const n = f.replace(/^derived\//, ""); return `<a href="${esc(f)}" title="${esc(n)}">${icon("file")}<span>${esc(n.slice(STEM.length + 1))}</span></a>`; }).join("")}</div>
    <h3 class="sub">${icon("clock")} ${T("不在记录里、留给下游的步骤", "Steps that are not in the record and stay downstream")}</h3>
    <div class="table-wrap"><table class="tbl cards"><thead><tr><th>${T("步骤", "Step")}</th><th>${T("为什么不在记录里", "Why it is not in the record")}</th><th>${T("落在哪些字段", "Where it lands")}</th></tr></thead><tbody>
      <tr><td>${T("自然语言、多跳和无答案的问答", "Natural-language, multi-hop and unanswerable QA")}</td><td class="small" data-l="${T("为什么不在记录里", "Why it is not in the record")}">${T("属于生成", "generation")} ${av("G")}</td><td class="small" data-l="${T("落在哪些字段", "Where it lands")}">${["transform.qa_seed_question", "transform.qa_difficulty", "transform.qa_unanswerable_reason"].map(p => fieldLink(p)).join(" ")}</td></tr>
      <tr><td>${T("实体对齐到本体和数据库", "Entity alignment to ontologies and databases")}</td><td class="small" data-l="${T("为什么不在记录里", "Why it is not in the record")}">${T("课题一的融合工作，需要外部来源", "Topic 1 fusion; needs external sources")}</td><td class="small" data-l="${T("落在哪些字段", "Where it lands")}">${["transform.subject_id", "transform.object_id", "transform.entity_alignment_status"].map(p => fieldLink(p)).join(" ")}</td></tr>
      <tr><td>${T("复核过的谓词、实体类型、极性", "Reviewed predicate, entity types, polarity")}</td><td class="small" data-l="${T("为什么不在记录里", "Why it is not in the record")}">${T("需要人工判断", "human judgment")} ${av("I")}</td><td class="small" data-l="${T("落在哪些字段", "Where it lands")}">${["transform.predicate_label", "transform.subject_type", "transform.relation_polarity"].map(p => fieldLink(p)).join(" ")}</td></tr>
      <tr><td>${T("训练 / 验证 / 测试划分", "Train / validation / test split")}</td><td class="small" data-l="${T("为什么不在记录里", "Why it is not in the record")}">${T("属于数据集的决定", "a dataset decision")}</td><td class="small" data-l="${T("落在哪些字段", "Where it lands")}">${["transform.corpus_split", "transform.leakage_group_id"].map(p => fieldLink(p)).join(" ")}</td></tr>
    </tbody></table></div>
  </section>`;

  // wiring (#main outlives a language switch, so its listener is added once)
  if (!render.wired) { render.wired = true; $("#main").addEventListener("click", e => {
    const a = e.target.closest("[data-rec]"); if (a) { e.preventDefault(); openRecord(a.dataset.rec); return; }
    const h = e.target.closest("[data-hook]"); if (h) { hookRec = h.dataset.hook; $("#hooks-box").innerHTML = hooksHTML(); return; }
    const t = e.target.closest("[data-table]"); if (t) { tableTab = t.dataset.table; $("#tables-box").innerHTML = tablesHTML(); return; }
    const q = e.target.closest(".qa"); if (q) { const on = !q.classList.contains("flip"); q.classList.toggle("flip", on); q.setAttribute("aria-pressed", on); return; }
    if (e.target.closest("#plain-btn")) { showPlain = !showPlain; $("#corpus-box").innerHTML = corpusHTML(); return; }
    if (e.target.closest("#qa-all")) { const b = $("#qa-all"), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); $$(".qa").forEach(x => { x.classList.toggle("flip", on); x.setAttribute("aria-pressed", on); }); }
  }); }
  $$(".chip[data-kind]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.kind; GS.kinds.has(k) ? GS.kinds.delete(k) : GS.kinds.add(k);
    if (!GS.kinds.size) GS.kinds.add(k);
    $$(".chip[data-kind]").forEach(x => x.setAttribute("aria-pressed", GS.kinds.has(x.dataset.kind)));
    renderGraph();
  }));
  renderGraph();
  if (W) K.workflow($("#wf-box"), W.workflow, { onNode: workflowNode });
  requestAnimationFrame(drawFan);
  if ("ResizeObserver" in window) new ResizeObserver(() => drawFan()).observe($("#fan"));
  const h = location.hash.slice(1);
  if (h && document.getElementById(h)) requestAnimationFrame(() => document.getElementById(h).scrollIntoView());
}
K.mount({ title: () => T("下游派生 · pdf2jsonl", "Outputs · pdf2jsonl"), render });
</script>
</body>
</html>
