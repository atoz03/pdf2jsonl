<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf2jsonl · 育种论文，长成可追溯的数据</title>
<meta name="description" content="pdf2jsonl turns breeding papers into atomic, evidence-anchored JSONL records under a versioned data contract, and derives a knowledge graph, a research workflow, a corpus, QA seeds and tables from the same records.">
<!--__HEAD__-->
<style>
/* ---------------------------------------------------------------- hero */
.hero { position: relative; overflow: hidden; padding-block: 64px 30px; }
.hero::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(900px 420px at 12% -10%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%),
  radial-gradient(900px 520px at 100% 10%, color-mix(in srgb, var(--brand) 14%, transparent), transparent 70%); pointer-events: none; }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 220px; background: repeating-linear-gradient(100deg, transparent 0 22px, color-mix(in srgb, var(--brand) 5%, transparent) 22px 23px); mask-image: linear-gradient(transparent, #000); -webkit-mask-image: linear-gradient(transparent, #000); pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; }
.hero-copy { max-width: 880px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 62px); font-weight: 790; letter-spacing: -.035em; line-height: 1.08; margin: 16px 0 18px; }
.hero h1 .grad { background: linear-gradient(100deg, var(--brand) 10%, var(--gold) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { font-size: 18px; max-width: 760px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.hero-actions .btn { padding: 12px 20px; font-size: 15px; border-radius: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 26px; color: var(--ink-2); font-size: 14px; }
.facts b { color: var(--ink); font-size: 17px; margin-right: 4px; letter-spacing: -.01em; }

/* ---------------------------------------------------------------- the stage */
.stage { position: relative; margin-top: 46px; display: grid; grid-template-columns: 1fr 1.08fr .98fr; gap: 54px; align-items: start; padding: 28px; border-radius: 28px; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow-3); backdrop-filter: blur(6px); }
.beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.beam { fill: none; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 5 7; opacity: 0; transition: opacity .5s; animation: dash 1s linear infinite; }
.beam.gold { stroke: var(--gold); }
.spark { fill: var(--gold); opacity: 0; transition: opacity .4s; filter: drop-shadow(0 0 4px var(--gold)); }
.stage.s3 .beam.b0, .stage.s3 .spark.b0 { opacity: 1; }
.stage.s5 .beam.bo, .stage.s5 .spark.bo { opacity: 1; }
.pane { position: relative; z-index: 1; min-width: 0; }
.pane-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.pane-label .n { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font: 700 11px var(--mono); background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-line); }

.paper { background: #fffdf8; color: #22231f; border-radius: 6px 18px 6px 6px; padding: 22px 22px 18px; box-shadow: 0 1px 0 #e9e3d1, 0 18px 40px -22px rgba(30, 30, 20, .5); position: relative; font-family: var(--serif); border: 1px solid #ece6d4; }
:root[data-theme="dark"] .paper { background: #f3efe3; }
.paper::after { content: ""; position: absolute; top: 0; right: 0; width: 26px; height: 26px; background: linear-gradient(225deg, var(--bg) 50%, #e8e1cc 50%); border-radius: 0 0 0 6px; }
.paper h4 { font-size: 14.5px; line-height: 1.35; font-weight: 700; margin-bottom: 4px; padding-right: 18px; }
.paper .au { font-size: 11.5px; color: #75705f; }
.paper .note { font: 9.5px var(--mono); color: #a39b83; margin: 6px 0 10px; letter-spacing: .02em; }
.paper h5 { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: #5d6b55; margin: 10px 0 4px; }
.paper p { font-size: 13.2px; line-height: 1.72; color: #3b3c35; }
.paper p.faded { color: #9b968a; -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent); max-height: 64px; overflow: hidden; }
.hl { background: linear-gradient(#fbe39a, #fbe39a) no-repeat 0 0 / 0% 100%; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background-size 1.1s cubic-bezier(.6, .1, .3, 1); border-radius: 3px; padding: 1px 0; }
.stage.s1 .hl { background-size: 100% 100%; }
.hl .u { transition: box-shadow .5s, color .5s; box-shadow: inset 0 0 0 transparent; }
.stage.s2 .hl .u-s { box-shadow: inset 0 -2.5px 0 #2a78d6; color: #1a4f94; }
.stage.s2 .hl .u-p { box-shadow: inset 0 -2.5px 0 #d9692e; color: #8f3d12; transition-delay: .25s; }
.stage.s2 .hl .u-o { box-shadow: inset 0 -2.5px 0 #14936a; color: #0c5f43; transition-delay: .5s; }

.rec { background: #0f1c18; border: 1px solid #22392f; border-radius: 16px; box-shadow: 0 24px 50px -24px rgba(5, 20, 15, .7); overflow: hidden; color: #cfe0d6; }
.rec-top { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #1f342b; font: 600 11.5px var(--mono); color: #7f9d90; }
.rec-top i { width: 9px; height: 9px; border-radius: 50%; background: #2f4a3f; }
.rec-top i:nth-child(1) { background: #e0b154; } .rec-top i:nth-child(2) { background: #5fae86; }
.rec-top span { margin-left: 6px; }
.rec pre { margin: 0; padding: 14px 16px 10px; font: 12px/1.75 var(--mono); white-space: pre; overflow: hidden; }
.rec .ln { display: block; opacity: 0; transform: translateX(-6px); transition: opacity .35s, transform .35s; }
.stage.s3 .rec .ln { opacity: 1; transform: none; }
.rec .k { color: #9fb6ff; } .rec .str { color: #a6e3b8; } .rec .num { color: #f2b27a; } .rec .g { color: #6f8c80; }
.rec .vs { color: #8fc3ff; } .rec .vp { color: #ffb48a; } .rec .vo { color: #7fe0b7; }
.verified { display: flex; align-items: center; gap: 8px; margin: 0 14px 14px; padding: 8px 12px; border-radius: 10px; background: #143326; color: #9be3bd; font: 600 12.5px var(--sans); opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .4s, transform .4s var(--ease); }
.verified svg { width: 16px; height: 16px; }
.stage.s4 .verified { opacity: 1; transform: none; }

.outs { display: grid; grid-template-columns: 1fr; gap: 10px; }
.out { display: block; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 13px 13px; transition: border-color .4s, box-shadow .4s, transform .4s var(--ease), opacity .4s; opacity: .55; }
.out:hover { text-decoration: none; }
.stage.s5 .out { opacity: 1; }
.out.lit { border-color: var(--brand-line); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 12%, transparent), var(--shadow-2); transform: translateY(-2px); }
.out h6 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--ink); }
.out h6 svg { width: 15px; height: 15px; color: var(--brand); }
.out h6 .c { margin-left: auto; font: 600 11px var(--mono); color: var(--ink-3); }
.out .mini { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.out .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mg { width: 100%; height: 50px; display: block; }
.mg .ed { stroke: var(--brand); stroke-width: 1.8; fill: none; stroke-dasharray: 130; stroke-dashoffset: 130; transition: stroke-dashoffset 1s; }
.out.lit .mg .ed, .stage.s6 .mg .ed { stroke-dashoffset: 0; }
.mg text { font: 600 9.5px var(--sans); fill: var(--ink); }
.mg .el { font: 600 8.5px var(--mono); fill: var(--brand-ink); }
:root[data-theme="dark"] .mg .el { fill: var(--brand-2); }
.mini .sp { padding: 0; }
.qa-a { display: inline-flex; margin-left: 4px; vertical-align: 1px; font: 700 11.5px var(--mono); padding: 2px 9px; border-radius: 999px; background: var(--brand); color: #fff; opacity: 0; transform: scale(.6); transition: opacity .3s, transform .4s cubic-bezier(.3, 1.6, .5, 1); }
:root[data-theme="dark"] .qa-a { color: #06140f; }
.stage.s6 .qa-a { opacity: 1; transform: none; }
.mini table { width: 100%; border-collapse: collapse; font: 10.5px var(--mono); }
.mini th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 2px 4px; border-bottom: 1px solid var(--line); }
.mini td { padding: 3px 4px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.stage-cap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 14px; color: var(--ink-3); font-size: 13px; }
.stage-ctl { display: inline-flex; gap: 6px; }
@media (max-width: 1080px) {
  .stage { grid-template-columns: 1fr; gap: 46px; padding: 18px; }
  .rec pre { white-space: pre-wrap; word-break: break-word; }
}

/* ---------------------------------------------------------------- principles */
.prin { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .prin { grid-template-columns: 1fr; } }
.prin .card { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.prin .no { font: 800 40px/1 var(--sans); letter-spacing: -.04em; background: linear-gradient(160deg, var(--brand), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.prin h3 { font-size: 19px; }
.prin p { color: var(--ink-2); font-size: 14.5px; }
.demo-snip { margin-top: auto; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line-2); padding: 12px 14px; font-size: 13px; }
.caught { position: relative; }
.caught q { font-family: var(--serif); display: block; text-decoration: line-through; text-decoration-color: var(--clay); text-decoration-thickness: 2px; color: var(--ink-2); quotes: "“" "”"; }
.stamp { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px; border: 2px solid var(--clay); color: var(--clay); border-radius: 7px; font-weight: 800; font-size: 12px; letter-spacing: .04em; transform: rotate(-3deg); background: var(--clay-soft); }
.stamp svg { width: 14px; height: 14px; }

/* ---------------------------------------------------------------- numbers band */
.band { background: linear-gradient(135deg, var(--deep), var(--deep-2)); color: var(--deep-ink); position: relative; overflow: hidden; }
.band::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 300px at 85% 0%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 70%), repeating-linear-gradient(100deg, transparent 0 26px, rgba(255, 255, 255, .025) 26px 27px); }
.band .wrap { position: relative; padding-block: 54px; }
.band h2 { font-size: 26px; letter-spacing: -.02em; }
.band p.sub { color: var(--deep-ink-2); margin-top: 6px; max-width: 760px; }
.nums { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; margin-top: 30px; background: rgba(255, 255, 255, .08); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .08); }
.nums a { background: color-mix(in srgb, var(--deep) 88%, #000); color: inherit; padding: 22px 20px; display: block; transition: background .2s; }
.nums a:hover { background: color-mix(in srgb, var(--deep-2) 90%, #fff); text-decoration: none; }
.nums b { display: block; font-size: 40px; font-weight: 780; letter-spacing: -.04em; line-height: 1.05; color: #fff; }
.nums span { display: block; font-size: 13.5px; color: var(--deep-ink-2); margin-top: 6px; }
.nums small { display: block; font-size: 12px; color: #e8c574; margin-top: 2px; }
@media (max-width: 980px) { .nums { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .nums { grid-template-columns: repeat(2, 1fr); } .nums b { font-size: 32px; } }

/* ---------------------------------------------------------------- functions */
.fns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 960px) { .fns { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .fns { grid-template-columns: 1fr; } }
.fn { padding: 18px 18px 16px; }
.fn .t { font-weight: 700; font-size: 15px; }
.fn .e { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; min-height: 36px; }
.fn .meter { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin: 14px 0 8px; }
.fn .meter i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 60%, var(--gold))); transition: width 1.2s var(--ease); }
.fn.in .meter i { width: var(--w); }
.fn .v { font-size: 13px; color: var(--ink-2); }
.fn .v b { font-size: 20px; color: var(--ink); margin-right: 4px; }

/* ---------------------------------------------------------------- explore bento */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.bento > a { grid-column: span 2; padding: 22px; display: flex; flex-direction: column; gap: 8px; min-height: 230px; position: relative; overflow: hidden; }
.bento > a.wide { grid-column: span 3; }
.bento .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-line); }
.bento .ic svg { width: 20px; height: 20px; }
.bento h3 { font-size: 18px; margin-top: 4px; }
.bento p { color: var(--ink-2); font-size: 14px; }
.bento .metric { margin-top: auto; padding-top: 12px; font-size: 13px; color: var(--ink-3); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bento .metric b { color: var(--ink); }
.bento .metric svg { color: var(--brand); transition: transform .25s var(--ease); }
.bento > a:hover .metric svg { transform: translateX(4px); }
.viz { margin-top: 6px; }
.stackbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.stackbar i { display: block; height: 100%; }
.viz .legend { margin-top: 8px; font-size: 11.5px; gap: 4px 12px; }
.snake { width: 100%; height: 54px; }
.snake path { fill: none; stroke: var(--line-2); stroke-width: 2; }
.snake circle { fill: var(--surface); stroke: var(--brand); stroke-width: 2; }
.snake circle.g { stroke: var(--gold); }
.mbar { display: grid; grid-template-columns: 60px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.mbar .track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.mbar .track i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }
@media (max-width: 1000px) { .bento > a, .bento > a.wide { grid-column: span 3; } }
@media (max-width: 640px) { .bento { grid-template-columns: 1fr; } .bento > a, .bento > a.wide { grid-column: auto; min-height: 0; } }

.start { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 28px; align-items: center; }
@media (max-width: 900px) { .start { grid-template-columns: 1fr; } }
.start ul { margin: 14px 0 0; padding: 0; list-style: none; }
.start li { display: flex; gap: 10px; margin: 10px 0; color: var(--ink-2); }
.start li svg { color: var(--brand); margin-top: 3px; }
</style>
</head>
<body data-page="index">
<header id="top"></header>
<main id="main"></main>
<footer id="foot"></footer>
<!--__DATA__-->
<!--__KIT__-->
<script>
"use strict";
const { T, esc, icon, fmt, DATA } = K;
const H = DATA.hero, ST = H.statement, R = DATA.run, X = DATA.derived, S = DATA.stats;
let timers = [], playing = true, visible = true, stageSeen = null;

function paperHTML() {
  const q = ST.source_quote, a = ST.anchors || {};
  const piece = (k, cls) => a[k] ? [a[k][0], a[k][1], cls] : null;
  const spans = [piece("subject", "u u-s"), piece("predicate", "u u-p"), piece("object", "u u-o")].filter(Boolean).sort((x, y) => x[0] - y[0]);
  let quote = "", at = 0;
  for (const [s, e, cls] of spans) { quote += esc(q.slice(at, s)) + `<span class="${cls}">${esc(q.slice(s, e))}</span>`; at = e; }
  quote += esc(q.slice(at));
  const blocks = H.blocks.map((b, i) => {
    const k = b.text.indexOf(q);
    const body = k >= 0 ? esc(b.text.slice(0, k)) + `<span class="hl">${quote}</span>` + esc(b.text.slice(k + q.length)) : esc(b.text);
    return `<h5>${esc(b.h)}</h5><p${k < 0 && i > 0 ? ' class="faded"' : ""}>${body}</p>`;
  }).join("");
  return `<article class="paper" aria-label="${T("示例论文第 1 页", "Page 1 of the example paper")}"><h4>${esc(H.head[0] || H.title)}</h4><div class="au">${esc(H.head[1] || "")}</div>
    <div class="note">${esc(H.head[2] || "")}</div>${blocks}</article>`;
}
function recordHTML() {
  const r = H.record, s = v => `<span class="str">${esc(JSON.stringify(v))}</span>`;
  const lines = [
    `<span class="g">{</span><span class="k">"common"</span>: <span class="g">{</span>`,
    `  <span class="k">"record_kind"</span>: ${s(r.common.record_kind)},`,
    `  <span class="k">"source_page"</span>: <span class="num">${r.common.source_page}</span>,`,
    `  <span class="k">"source_quote"</span>: ${s(K.clip(r.common.source_quote, 22))},`,
    `  <span class="k">"review_status"</span>: ${s(r.common.review_status)}<span class="g">},</span>`,
    ...(r.agent.pve_percent != null ? [`<span class="k">"agent"</span>: <span class="g">{</span><span class="k">"pve_percent"</span>: <span class="num">${r.agent.pve_percent}</span><span class="g">},</span>`] : []),
    `<span class="k">"transform"</span>: <span class="g">{</span>`,
    `  <span class="k">"subject_mention"</span>: <span class="vs">${esc(JSON.stringify(r.transform.subject_mention))}</span>,`,
    `  <span class="k">"predicate_code"</span>:`,
    `    <span class="vp">${esc(JSON.stringify(r.transform.predicate_code))}</span>,`,
    `  <span class="k">"object_mention"</span>: <span class="vo">${esc(JSON.stringify(r.transform.object_mention))}</span><span class="g">}}</span>`,
  ];
  return `<div class="rec"><div class="rec-top"><i></i><i></i><i></i><span>${esc(DATA.site.version ? "synthetic_rice_qtl.jsonl" : "")}</span></div>
    <pre>${lines.map((l, i) => `<span class="ln" style="transition-delay:${(i * 0.13).toFixed(2)}s">${l}</span>`).join("")}</pre>
    <div class="verified">${icon("check")}${T(`引文已在第 ${H.page} 页逐字找到 · 结构校验通过`, `Quote found verbatim on page ${H.page} · validated`)}</div></div>`;
}
function outsHTML() {
  const q = H.qa, ch = H.chunk;
  const cloze = esc(K.clip(q.qa_seed_question, 64)).replace("____", '<span class="blank">____</span>');
  const corpus = ch ? K.annotate(K.clip(ch.chunk_text, 999), (ch.entities || []).map(e => ({ start: e.start, end: e.end, cls: "sp-entity" }))) : "";
  return `<div class="outs">
    <a class="out" data-o="0" href="outputs.html#graph"><h6>${icon("graph")}${T("知识图谱", "Knowledge graph")}<span class="c">${fmt(X.graph_nodes)} ${T("节点", "nodes")}</span></h6>
      <svg class="mg" viewBox="0 0 300 50" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path class="ed" d="M44 26 Q150 -2 252 26" marker-end="url(#hm)"/>
        <defs><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--brand)"/></marker></defs>
        <line x1="44" y1="28" x2="150" y2="42" stroke="var(--line-2)"/><line x1="252" y1="28" x2="150" y2="42" stroke="var(--line-2)"/>
        <circle cx="36" cy="26" r="8" fill="var(--s)"/><circle cx="262" cy="26" r="8" fill="var(--o)"/><rect x="144" y="37" width="11" height="11" rx="3" fill="var(--surface)" stroke="var(--c1)" stroke-width="2"/>
        <text x="36" y="47" text-anchor="middle">${esc(ST.subject_mention)}</text><text x="262" y="47" text-anchor="middle">${esc(K.clip(ST.object_mention, 16))}</text><text class="el" x="150" y="9" text-anchor="middle">${esc(ST.predicate.replace(/^bdc:/, ""))}</text></svg></a>
    <a class="out" data-o="1" href="outputs.html#corpus"><h6>${icon("quote")}${T("标注语料", "Corpus")}<span class="c">${fmt(X.corpus_chunks)} ${T("块", "chunks")}</span></h6><div class="mini clamp">${corpus}</div></a>
    <a class="out" data-o="2" href="outputs.html#qa"><h6>${icon("sparkle")}${T("问答种子", "QA seeds")}<span class="c">${fmt(X.qa_seeds)}</span></h6><div class="mini">${cloze}<span class="qa-a">${esc(q.qa_seed_answer)}</span></div></a>
    <a class="out" data-o="3" href="outputs.html#tables"><h6>${icon("table")}${T("关系表", "Tables")}<span class="c">statements.csv</span></h6><div class="mini"><table><thead><tr><th>subject</th><th>predicate</th><th>object</th></tr></thead>
      <tbody><tr><td>${esc(ST.subject_mention)}</td><td>${esc(ST.predicate.replace(/^bdc:/, ""))}</td><td>${esc(ST.object_mention)}</td></tr></tbody></table></div></a>
  </div>`;
}

// ---------------------------------------------------------------- beams between the panes, recomputed on resize
function drawBeams() {
  const st = document.getElementById("stage"); if (!st) return;
  const svg = st.querySelector(".beams"), box = st.getBoundingClientRect();
  const r = el => { const b = el.getBoundingClientRect(); return { l: b.left - box.left, r: b.right - box.left, t: b.top - box.top, b: b.bottom - box.top, cx: b.left - box.left + b.width / 2, cy: b.top - box.top + b.height / 2 }; };
  const paper = r(st.querySelector(".paper")), rec = r(st.querySelector(".rec")), outs = [...st.querySelectorAll(".out")].map(r);
  const stacked = rec.t > paper.b;
  const curve = (a, b) => stacked
    ? `M${a.cx} ${a.b + 4} C${a.cx} ${(a.b + b.t) / 2} ${b.cx} ${(a.b + b.t) / 2} ${b.cx} ${b.t - 4}`
    : `M${a.r + 4} ${a.cy} C${(a.r + b.l) / 2} ${a.cy} ${(a.r + b.l) / 2} ${b.cy} ${b.l - 6} ${b.cy}`;
  const paths = [["b0", curve(paper, rec)]];
  if (stacked) { const all = outs.reduce((m, o) => ({ l: Math.min(m.l, o.l), r: Math.max(m.r, o.r), t: Math.min(m.t, o.t) }), { l: 1e9, r: -1e9, t: 1e9 });
    paths.push(["bo", curve(rec, { cx: (all.l + all.r) / 2, t: all.t })]); }
  else outs.forEach(o => paths.push(["bo", curve(rec, o)]));
  svg.innerHTML = paths.map(([cls, d], i) => `<path id="beam${i}" class="beam ${cls}${i ? " gold" : ""}" d="${d}"/>`).join("") +
    (K.reduced() ? "" : paths.map(([cls], i) => `<circle class="spark ${cls}" r="3.5"><animateMotion dur="${1.4 + i * 0.12}s" repeatCount="indefinite" begin="${i * 0.2}s"><mpath href="#beam${i}"/></animateMotion></circle>`).join(""));
}

// ---------------------------------------------------------------- the loop: highlight → anchor → record → verified → outputs → answer
function play() {
  const st = document.getElementById("stage"); if (!st) return;
  timers.forEach(clearTimeout); timers = [];
  const outs = [...st.querySelectorAll(".out")];
  if (K.reduced()) { st.classList.add("s1", "s2", "s3", "s4", "s5", "s6"); return; }
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  st.classList.remove("s1", "s2", "s3", "s4", "s5", "s6"); outs.forEach(o => o.classList.remove("lit"));
  at(500, () => st.classList.add("s1"));
  at(1700, () => st.classList.add("s2"));
  at(2700, () => st.classList.add("s3"));
  at(4500, () => st.classList.add("s4"));
  at(5300, () => st.classList.add("s5"));
  outs.forEach((o, i) => { at(5600 + i * 420, () => o.classList.add("lit")); at(7600 + i * 160, () => o.classList.remove("lit")); });
  at(6900, () => st.classList.add("s6"));
  at(12500, () => { if (playing && visible) play(); });
}
function setPlaying(on) {
  playing = on;
  const b = document.getElementById("play-btn");
  if (b) b.innerHTML = `${icon(on ? "pause" : "play")}${on ? T("暂停", "Pause") : T("播放", "Play")}`;
  if (on) play(); else timers.forEach(clearTimeout);
}
