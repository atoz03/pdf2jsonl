const runName = x => x.model === "example-agent" ? T("样例候选验证", "Example candidates") : String(x.model || "").startsWith("Codex") ? T("Codex 重新抽取", "Codex re-extraction") : (x.model || x.name || "run");
const date = (v, short = false) => { if (!v) return T("时间未记录", "time not recorded"); const d = new Date(v); return Number.isNaN(+d) ? v

const presenceNote = p => p.selective

// ---------------------------------------------------------------- state
const H0 = K.hash();
const st = { paper: PAPERS.some(p => p.id === H0.paper) ? H0.paper : (PAPERS[0] || {}).id || "", run: H0.run || "", tab: H0.tab || "records",
  kind: "all", review: "all", warn: "all", q: "", pages: {}, lib: { q: "", status: "all" }, src: { part: "", page: 1, quote: "", rec: "", mode: "text" } };
const paper = () => PAPERS.find(p => p.id === st.paper);
const run = () => { const p = paper(); return p && (p.runs.find(r => r.id === st.run) || p.runs[0]); };
const recordFor = id => (run()?.records || []).find(r => r.common?.record_id === id);
const warnIndex = r => r._w || (r._w = (r.warnings || []).reduce((m, w) => { if (w.record_id) (m[w.record_id] ||= []).push(w); return m; }, {}));

const runStatus = r => !r.integrity_ok ? "problem" : r.counts.rejected || r.counts.pending || r.counts.audit_flags ? "review" : "complete";

}
const TABS = ["records", "workflow", "source", "verify", "issues", "history", "exports"];
if (!TABS.includes(st.tab)) st.tab = "records";

// ---------------------------------------------------------------- shared bits
const empty = (title, msg, ic = "file") => `<div class="empty">${icon(ic)}<h3>${esc(title)}</h3><p>${msg}</p></div>`;
const tile = (v, label, tone) => `<div class="tile"${tone ? ` style="--tc:${tone}"` : ""}><b>${esc(fmt(v))}</b><span>${esc(label)}</span></div>`;
function paged(key, items, size) {
  const total = Math.max(1, Math.ceil(items.length / size)), p = Math.min(st.pages[key] || 1, total);
  st.pages[key] = p;
  return { rows: items.slice((p - 1) * size, p * size), foot: total > 1 ? `<div class="pager"><span>${T(`共 ${items.length} 项 · 第 ${p} / ${total} 页`, `${items.length} items · page ${p} of ${total}`)}</span>
    <span class="row"><button type="button" class="btn sm" data-pg="${key}:-1" aria-label="${T("上一页", "Previous page")}" ${p === 1 ? "disabled" : ""}>${icon("back")}</button><button type="button" class="btn sm" data-pg="${key}:1" aria-label="${T("下一页", "Next page")}" ${p === total ? "disabled" : ""}>${icon("arrow")}</button></span></div>` : "" };
}
const pager = (key, items, size, item) => { const { rows, foot } = paged(key, items, size); return rows.map(item).join("") + foot; };
// A record button names its record, so a list of identical messages still says which record each one is about.
const recBtn = (rid, label) => { const x = rid && recordFor(rid); return x ? `<button type="button" class="btn sm recb" data-rec="${esc(rid)}">${icon("eye")}<span>${esc(label || `${kindLabel(x.common.record_kind)} · ${clip(summary(x), 70)}`)}</span></button>` : ""; };
const issue = (code, msg, { rid = null, tone = "", extra = "" } = {}) => `<div class="issue ${tone}"><div class="ic">${esc(code)}</div><p>${esc(msg)}</p>${extra}${rid && recordFor(rid) ? `<div class="act">${recBtn(rid)}</div>` : ""}</div>`;
const sec = (title, n, lede, body) => `<div class="sec"><h3>${title}${n != null ? ` <span class="n">${n}</span>` : ""}</h3>${lede ? `<p class="lede">${lede}</p>` : ""}${body}</div>`;
const sel = (f, label, opts, cur) => `<select class="select" data-f="${f}" aria-label="${esc(label)}">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;

function renderTab() {

// The workflow graph is wider than the paper panel: fade the edge that has more to scroll to.
function scrollHint(el) {
  if (!el) return;
  const upd = () => { el.classList.toggle("more-r", el.scrollLeft + el.clientWidth < el.scrollWidth - 4); el.classList.toggle("more-l", el.scrollLeft > 4); };
  el.addEventListener("scroll", upd, { passive: true }); requestAnimationFrame(upd);
}

function workflowHTML(r) {

  if (!w) return empty(T("当前运行没有研究流程视图", "No research workflow for this run"), T("研究流程需要契约 3.5.0 的 statement_role 与 tests / addresses / prerequisite 链接；较早版本的记录没有这些字段，用 3.5.0 或更新的版本重新抽取后即可查看。", "The workflow needs statement_role and the tests / addresses / prerequisite links of contract 3.5.0; records of earlier versions lack them. Re-extract with 3.5.0 or later to see it."), "flow");
  if (!w.nodes.length) return empty(T("没有可组织的研究流程节点", "No workflow nodes"), T("记录中没有 statement_role 或流程链接，无法组织背景—问题—假设—实验—结果—结论。", "No record has a statement_role or a workflow link, so there is nothing to arrange from background to conclusion."), "flow");
  const label = id => { const n = w.nodes.find(x => x.id === id); return n ? clip(n.label || n.id, 48) : id; };
  const order = w.step_order || [], seq = new Map(order.map((id, i) => [id, i + 1]));
  const nodes = [...order.map(id => w.nodes.find(n => n.id === id)).filter(Boolean), ...w.nodes.filter(n => !order.includes(n.id))];

  return `<div class="tiles">${tile(w.nodes.length, T("节点", "nodes"))}${tile(w.edges.length, T("关系边", "edges"))}${tile((w.hypotheses || []).length, T("假设", "hypotheses"))}${tile((w.branch_points || []).length, T("分支点", "branch points"))}${tile(flags, T("结构提示", "structure flags"), flags ? "var(--amber)" : "")}</div>
    <div class="row" style="margin-bottom:14px">${Object.entries(w.stages || {}).map(([s, n]) => `<span class="tag">${esc(K.stageLabel(s))} · ${n}</span>`).join("")}</div>
    <p class="wf-hint">${icon("arrow")}${T("左右滑动查看全部阶段；悬停节点高亮它的链接，点击查看记录。", "Scroll sideways for every stage; hover a node to light its links, click it for the record.")}</p>
    <div id="wf-graph"></div>
    ${(w.hypotheses || []).length ? sec(`${icon("sparkle")}${T("假设检验链", "Hypotheses and their tests")}`, w.hypotheses.length, "", w.hypotheses.map(h => {
      const bits = [["回应", "Addresses", h.addresses], ["检验", "Tested by", h.tested_by], ["证据", "Evidence", h.evidence]].filter(([, , ids]) => ids?.length);

// verification
function verifyHTML(r) {

    "An independent verifier (not the extraction model) judges whether the quote states the value and whether the paper connects two records that way. Run bdc verify tasks and bdc verify apply, then rebuild the dashboard. Verification does not judge whether a conclusion holds; it can send a record back to review but never replaces an expert's approval."), "eye");
  const c = v.counts || {}, bv = c.by_verdict || {}, tot = c.verdicts || Object.values(bv).reduce((a, b) => a + b, 0) || 1, vf = v.verifier || {};
  const findings = v.findings || [], conflicts = v.conflict_candidates || [], omissions = v.omission_candidates || [];
  return `<div class="tiles">${tile(c.records ?? "—", T("条记录", "records"))}${tile(c.tasks ?? "—", T("项任务", "tasks"))}${tile(bv.supported || 0, T("支持", "supported"), "var(--ok)")}${tile(bv.not_supported || 0, T("不支持", "not supported"), "var(--clay)")}${tile(bv.uncertain || 0, T("无法判断", "uncertain"), "var(--amber)")}${tile(c.promoted || 0, T("提升", "promoted"), "var(--brand)")}${tile(c.demoted || 0, T("退回", "demoted"), "var(--amber)")}</div>
    <div class="vbar" role="img" aria-label="${esc(Object.entries(bv).map(([k, n]) => `${n} ${k}`).join(", "))}">${Object.entries(VERDICT).filter(([k]) => bv[k]).map(([k, [zh, en, col]]) => `<i style="flex:${bv[k] / tot};background:${col}" title="${bv[k]} ${esc(T(zh, en))}"></i>`).join("")}</div>
    <div class="vleg">${Object.entries(VERDICT).filter(([k]) => bv[k]).map(([k, [zh, en, col]]) => `<span><i style="background:${col}"></i>${esc(T(zh, en))} <b>${bv[k]}</b></span>`).join("")}</div>
    <div class="dh-meta" style="margin-top:12px">${vf.model ? `<span>${icon("sparkle")}${T("校验模型", "Verifier")} · ${esc(vf.model)}</span>` : ""}${v.created_at ? `<span>${icon("clock")}${esc(date(v.created_at))}</span>` : ""}${v.independent_of_extractor === false ? `<span class="tag amber">${T("校验模型与抽取模型相同：状态不被提升", "The verifier is the extraction model: nothing is promoted")}</span>` : `<span class="tag ok">${T("独立于抽取模型", "independent of the extractor")}</span>`}</div>
    ${vf.notes ? `<p class="xs muted">${esc(vf.notes)}</p>` : ""}
    ${findings.length ? sec(`${icon("eye")}${T("语义校验发现", "Findings")}`, findings.length, T("独立校验者判定“不支持”或“无法判断”的记录与链接。看板只展示判断，不改写记录；记录由重新抽取或人工复核修正。", "Records and links the verifier judged not supported or uncertain. The dashboard shows the verdicts and rewrites nothing; records are corrected by re-extraction or by review."),
      pager("find", findings, 6, f => { const lbl = f.kind === "link" ? `${T("链接", "link")} · ${f.field || ""} → ${f.target_record_id && recordFor(f.target_record_id) ? clip(summary(recordFor(f.target_record_id)), 36) : (f.target_record_id || T("未解析", "unresolved"))}` : `${T("字段", "fields")} · ${(f.unsupported_fields || []).join(", ") || T("记录取值", "the values")}`;
        return issue(`${T(...(VERDICT[f.verdict] || [f.verdict, f.verdict]).slice(0, 2))} · ${lbl}`, f.reason || "", { rid: f.record_id, tone: f.verdict === "not_supported" ? "error" : "warn" }); })) : ""}
    ${conflicts.length ? sec(`${icon("alert")}${T("发现的记录冲突", "Conflicting records")}`, conflicts.length, T("同一来源中互相矛盾的记录。冲突由专家裁决，看板只列出候选。", "Records of the same source that contradict each other. An expert decides; the dashboard only lists them."),
      conflicts.map(x => issue(T("记录冲突", "CONFLICT"), x.reason || "", { tone: "error", extra: `<div class="act">${(x.record_ids || []).map(id => recBtn(id, recordFor(id) ? clip(summary(recordFor(id)), 44) : id)).join("")}</div>` })).join("")) : ""}
    ${omissions.length ? sec(`${icon("search")}${T("疑似漏抽", "Possible omissions")}`, omissions.length, T("校验者认为原文中有重要陈述未被任何记录捕获。补齐需要重新抽取，看板不改写记录。", "Statements the verifier found in the text that no record captures. Filling them in needs a re-extraction; the dashboard rewrites nothing."),
      omissions.map(o => issue(`p.${o.page ?? "—"}${o.source_part ? " · " + partName(o.source_part) : ""}`, o.note || "", { tone: "info", extra: o.quote ? `<div class="q">${esc(o.quote)}</div>` : "" })).join("")) : ""}
    ${!findings.length && !conflicts.length && !omissions.length ? empty(T("语义校验没有发现问题", "Verification found nothing"), T("每条记录与每个链接都被判定为“支持”。这只说明引文支持记录内容，不代表科学结论已经成立。", "Every record and every link was judged supported. That means the quotes support the records, not that the conclusions hold."), "check") : ""}`;
}

  if (!n) return bar + empty(T("原文文本不可用", "No text available"), esc(main.notes.join(" ")) || T("原 PDF 未收录。记录详情中仍可查看抽取时保留的证据引文。", "The PDF is not included; each record still keeps its quote."), "file");

      ${here.length ? `<p class="xs muted">${T("点一条记录，在左侧高亮它的引文。", "Click a record to highlight its quote on the left.")}</p>` : ""}</aside></div>`;

// issues

  if (incomplete) out.push(sec(`${icon("file")}${T("来源不完整", "Source incomplete")}`, (sp.missing || []).length, T("正文引用了未提供的来源部分。管线不会为缺失部分补造内容；补齐文件后以 --supplement 重新抽取。", "The main text cites parts of the source that were not given. The pipeline invents nothing for them; add the files and re-extract with --supplement."),

      return issue("SOURCE_PART_MISSING", T(`${partName(part)}未提供：正文第 ${(ref.pages || []).join("、")} 页共提及 ${ref.mentions || 0} 次${items.length ? `，涉及 ${items.join("、")}` : ""}`,
        `${partName(part)} not given: the main text mentions it ${ref.mentions || 0} times on page${(ref.pages || []).length > 1 ? "s" : ""} ${(ref.pages || []).join(", ")}${items.length ? `, citing ${items.join(", ")}` : ""}`), { tone: "warn" }); }).join("")));
  if (r.errors.length) out.push(sec(`${icon("x")}${T("被拒绝的候选", "Rejected candidates")}`, r.errors.length, T("候选连同拒绝原因保留在 errors.jsonl；修改候选后重新 finalize。", "Each candidate is kept in errors.jsonl with its reason; fix the candidate and finalize again."),
    pager("err", r.errors, 5, e => issue(e.code, e.message, { rid: e.record?.common?.record_id, tone: "error",
      extra: `${e.candidate?.evidence?.quote ? `<div class="q">${esc(e.candidate.evidence.quote)}</div>` : ""}<details><summary>${T("查看错误详情", "Details")}</summary><div class="code-box"><pre class="json">${K.json(e, { wrap: true, link: false })}</pre></div></details>` }))));

      groups.map(([k, g]) => `<div class="fam"><h4>${esc(T(...(FAM[k] || FAM.other).slice(0, 2)))} <span class="tag amber">${T(`${g.count} 条提示 · ${g.records} 条记录`, `${g.count} warnings · ${g.records} records`)}</span></h4>
        ${(FAM[k] || FAM.other)[2] ? `<p>${esc(T(FAM[k][2], FAM[k][3]))}</p>` : ""}${k === "value" && r.presence_policy ? `<p>${esc(presenceNote(r.presence_policy))}</p>` : ""}
        <div class="codes">${Object.entries(g.by_code || {}).map(([c, n]) => `<span class="tag mono">${esc(c)} × ${n}</span>`).join("")}</div></div>`).join("")
      + pager("warn", r.warnings, 6, w => issue(w.code, w.message, { rid: w.record_id, tone: "warn", extra: w.path ? `<p class="xs">${fieldLink(w.path)}</p>` : "" }))));
  }

}

  return `${d ? `<div class="tiles">${tile(c.tables, T("张关系表", "tables"))}${tile(c.statements ?? 0, T("条关系语句", "statements"))}${tile(c.triples, T("个三元组", "triples"))}${tile(c.corpus, T("段证据语料", "corpus chunks"))}${tile(c.qa ?? 0, T("个问答种子", "QA seeds"))}${tile(c.workflow_nodes ?? 0, T("个流程节点", "workflow nodes"))}</div>` : ""}
    <div class="dls">${downloads(p, r).map(([k, zh, en, f]) => `<button type="button" class="dl" data-dl="${k}" aria-label="${esc(T("下载", "Download") + " " + T(zh, en))}"><span class="ico">${icon("download")}</span><span><b>${esc(T(zh, en))}</b><small>${esc(f)}</small></span></button>`).join("")}</div>
    ${d ? sec(`${icon("table")}${T("关系表", "Tables")}`, Object.keys(d.tables).length, T("按当前运行的记录生成的 CSV。", "CSV files built from the records of this run."), `<div class="csvs">${Object.entries(d.tables).map(([n, rows]) => `<button type="button" class="btn sm" data-csv="${esc(n)}">${icon("download")}${esc(n)}.csv <span class="muted">${rows.length}</span></button>`).join("")}</div>`) : ""}
    <p class="xs muted" style="margin-top:16px">${T("导出内容来自当前选择的运行，均由记录中已有的关系语句、实体标记与证据定位直接派生。问答种子为完形候选，自然语言问答由下游生成。", "Everything here comes from the selected run, derived directly from the statements, entity mentions and evidence locators already in the records. QA seeds are cloze items; natural-language QA is generated downstream.")}
      ${K.local ? "" : ` <a href="outputs.html">${T("这些产物是什么 →", "What these outputs are →")}</a>`}</p>`;
}

// ---------------------------------------------------------------- the record dialog and the guide
function fieldRows(rec, all) {
  return Object.entries(rec).flatMap(([g, vals]) => vals && typeof vals === "object" && !Array.isArray(vals) ? Object.entries(vals).map(([k, v]) => [g, k, v]) : [])
    .filter(([g, k]) => all || !(g === "common" && (k.startsWith("source_") || SYS.has(k))))
    .map(([g, k, v]) => { const path = `${g}.${k}`, f = FIELDS[path] || {};
      return `<tr><td>${fieldLink(path)}</td><td class="def">${esc(f.definition || T("未提供字段说明", "no definition"))}${(f.tags || []).length ? `<div>${f.tags.map(t => `<span class="tag">${esc(T(t, TAG_EN[t] || t))}</span>`).join("")}</div>` : ""}</td>
        <td><pre class="fv">${esc(typeof v === "object" ? JSON.stringify(v, null, 2) : String(v))}</pre></td></tr>`; }).join("");
}
function openRecord(rec) {
  const c = rec.common || {}, r = run(), ws = r ? warnIndex(r)[c.record_id] || [] : [];
  const body = `<div class="row" style="margin-bottom:12px">${kindTag(c.record_kind)}${reviewTag(c.review_status)}${c.source_page != null ? `<span class="tag">p.${esc(c.source_page)}</span>` : ""}${c.source_section ? `<span class="tag">${esc(c.source_section)}</span>` : ""}${c.source_part && c.source_part !== "main_text" ? `<span class="tag gold">${esc(c.source_part)}</span>` : ""}</div>
    ${ws.length ? `<div class="callout warn">${icon("alert")}<div><b>${T(`校验提示 · ${ws.length}`, `Warnings · ${ws.length}`)}</b>${ws.map(w => `<div class="wl"><span class="mono xs">${esc(w.code)}</span> ${esc(w.message)}${w.path ? ` · ${fieldLink(w.path)}` : ""}</div>`).join("")}</div></div>` : ""}
    ${c.source_quote ? `<div class="qcard"><div class="ql">${T(`原文证据 · 第 ${c.source_page ?? "—"} 页`, `Evidence · page ${c.source_page ?? "—"}`)}${c.source_section ? ` · ${esc(c.source_section)}` : ""}</div><blockquote class="quote">${esc(c.source_quote)}</blockquote>
      <button type="button" class="btn sm" data-ev="${esc(c.record_id)}">${icon("eye")}${T("定位到原文", "Show it on the page")}</button></div>` : ""}
    <div class="fctl"><label><input type="checkbox" id="sys-toggle"> ${T("显示系统与来源元数据", "Show system and source metadata")}</label><span class="spacer"></span><button type="button" class="btn sm" id="copy-json">${icon("copy")}${T("复制 JSON", "Copy JSON")}</button></div>
    <div class="table-wrap"><table class="tbl compact ftbl"><thead><tr><th>${T("字段", "Field")}</th><th>${T("含义 / 功能", "Meaning / functions")}</th><th>${T("取值", "Value")}</th></tr></thead><tbody id="ftbody">${fieldRows(rec, false)}</tbody></table></div>
    <details class="raw"><summary>${T("查看完整原始 JSON", "The full raw JSON")}</summary><div class="code-box"><pre class="json">${K.json(rec, { wrap: true })}</pre></div></details>`;
  const d = K.openDialog("record-dlg", { title: `${esc(kindLabel(c.record_kind))} · ${esc(clip(summary(rec), 70))}`, sub: esc(c.record_id || ""), body,
    onClose: () => { if (K.hash().rec) setHash(); } });
  $("#sys-toggle", d).addEventListener("change", e => { $("#ftbody", d).innerHTML = fieldRows(rec, e.target.checked); });
  $("#copy-json", d).addEventListener("click", () => K.copy(JSON.stringify(rec, null, 2)));
  K.setHash({ paper: st.paper, run: run() && run().id !== paper().runs[0]?.id ? run().id : "", tab: st.tab !== "records" ? st.tab : "", rec: c.record_id });
}
function openGuide() {
  K.openDialog("guide-dlg", { cls: "modal", title: T("添加论文与更新看板", "Add a paper and update the dashboard"), sub: T("PDF、运行结果、语义校验与论文历史会在生成看板时自动汇总。", "PDFs, runs, verification and history are gathered when the dashboard is built."),
    body: `<div class="guide">
      <div><div><h3>${T("将 PDF 放入仓库", "Put the PDF into the repository")}</h3><p>${T("建议放在 <code>papers/</code>。尚未抽取的文献也会出现在论文列表中；补充材料随正文一起放入，运行时以 <code>--supplement</code> 声明，看板会把它显示为论文的一部分。", "Preferably under <code>papers/</code>. Papers not yet extracted appear in the list too; put supplements next to the paper and declare them with <code>--supplement</code>, and the dashboard shows them as a part of the paper.")}</p></div></div>
      <div><div><h3>${T("运行抽取", "Run the extraction")}</h3><p>${T("默认的智能体模式：先准备，由模型按简报写出候选，再执行同一条命令收尾。", "In the default agent mode the first call prepares, the model writes the candidates from the brief, and the same command then finalizes.")}</p>
        ${K.term(["skills/pdf2jsonl/scripts/pdf2jsonl papers/paper.pdf \\\n    --out-dir out/paper --bundle"])}</div></div>
      <div><div><h3>${T("（可选）语义校验", "(Optional) semantic verification")}</h3><p>${T("独立校验者判断引文是否陈述了该取值、两条记录是否以该方式相连，并给出记录冲突与疑似漏抽。复核状态以 <code>&lt;stem&gt;.verified.jsonl</code> 为准，看板读取它，不自行改写记录。", "An independent verifier judges whether each quote states its value and whether two records are connected that way, and lists conflicts and possible omissions. The review status comes from <code>&lt;stem&gt;.verified.jsonl</code>; the dashboard reads it and rewrites nothing.")}</p>
        ${K.term(["bdc verify tasks out/paper/paper.jsonl --out out/paper/review", "bdc verify apply out/paper/paper.jsonl \\\n    out/paper/review/paper.verify.verdicts.json \\\n    --out out/paper/review --manifest out/paper/paper.manifest.json"])}</div></div>
      <div><div><h3>${T("重新生成，然后刷新页面", "Rebuild, then reload")}</h3><p>${T("看板展示生成时的数据快照，不会自行启动模型或修改论文数据。", "The dashboard is a snapshot taken when it is built; it never starts a model or changes the data.")}</p>
        ${K.term(["make dashboard"])}
        <p class="xs muted">${T("要让论文出现在发布站点的论文页，把 PDF 和运行结果放在 <code>papers/</code> 或 <code>examples/</code> 下并提交；<code>make site</code> 与 Pages 工作流只收录这两个目录。", "For a paper to appear on the published site, commit the PDF and its runs under <code>papers/</code> or <code>examples/</code>; <code>make site</code> and the Pages workflow cover only those two directories.")}</p></div></div></div>` });
}

// ---------------------------------------------------------------- page
function selectPaper(id) {
  st.paper = id; st.run = ""; st.kind = st.review = st.warn = "all"; st.q = ""; st.pages = {}; st.src = { part: "", page: 1, quote: "", rec: "", mode: "text" };
  if (!["records", "source", "history", "exports", "issues", "verify", "workflow"].includes(st.tab)) st.tab = "records";
  setHash(); $("#lib-list").innerHTML = listHTML(); $("#det").innerHTML = detailHTML(); renderTab();
}
function render() {
  const s = SUM, n = (k, one, many) => `${k} ${k === 1 ? one : many}`;
  const sel = s.selective_presence > 0 ? T(`其中 ${s.selective_presence} 次运行按 3.5.1 只核验事实类字段`, `${n(s.selective_presence, "run checks", "runs check")} fact-bearing fields only (3.5.1)`) : T("取值核验尚未按字段作用域收窄", "the value check is not scoped by field role yet");
  const confirmed = PAPERS.reduce((a, p) => a + (p.runs[0]?.counts.model_verified || 0), 0);
  const kpi = (k, v, sub, ic, tone) => `<div class="kpi reveal"${tone ? ` style="--tone:${tone}"` : ""}><div class="k">${esc(k)}${icon(ic)}</div><div class="v" data-count="${v}">0</div><div class="s">${sub}</div></div>`;
  $("#main").innerHTML = `
  <section class="page-hero wrap">
    <span class="eyebrow">${T("论文看板 · 文献、证据与记录", "Papers · literature, evidence and records")}</span>
    <h1>${T("每篇论文、<em>每次运行</em>，都能回查到原文", "Every paper and <em>every run</em>, traceable to the page")}</h1>
    <p class="lead">${T("按论文查看 PDF、抽取的记录、每条记录在原文中的引文、语义校验结论、校验与审计问题、运行历史和导出文件。统计口径是每篇论文的最新运行。",
      "For each paper: the PDF, its records, where each record's quote sits on the page, the verification findings, validation and audit issues, the run history and the exports. The numbers count each paper's latest run.")}</p>
    <div class="ph-actions"><button type="button" class="btn primary" data-guide>${icon("plus")}${T("添加论文与更新看板", "Add a paper, update the dashboard")}</button>
      ${K.local ? "" : `<a class="btn" href="demo.html">${icon("play")}${T("先看一篇论文怎样变成数据", "First, see a paper become data")}</a>`}
      <span class="snap"><i></i>${K.local ? T("本地数据快照", "Local snapshot") : T("示例数据快照", "Example snapshot")} · ${esc(date(DATA.generated_at))}${DATA.version ? ` · ${T("契约", "contract")} ${esc(DATA.version)}` : ""}</span></div>
    <div class="kpis">
      ${kpi(T("论文", "Papers"), s.papers, T(`${s.runs} 次运行，按 PDF 内容归档`, `${n(s.runs, "run", "runs")}, grouped by PDF content`), "library")}
      ${kpi(T("已处理", "Processed"), s.processed, T("可查看原文、记录和运行报告", "with text, records and run reports"), "check")}
      ${kpi(T("有效记录", "Valid records"), s.records, T("按最新运行汇总，含资产记录", "latest runs, asset records included"), "table")}
      ${kpi(T("待复核", "Pending review"), s.pending, T("结构校验与语义校验退回复核的记录", "sent to review by validation or verification"), "alert", "var(--amber)")}
      ${kpi(T("取值核验提示", "Value-check flags"), s.value_flags || 0, T(`${s.value_records || 0} 条记录；${sel}`, `${n(s.value_records || 0, "record", "records")}; ${sel}`), "search", "var(--gold)")}
      ${kpi(T("语义校验确认", "Verifier-confirmed"), confirmed, s.verified ? T(`条记录由独立校验者确认；${s.verified} 次运行已校验`, `records confirmed by an independent verifier; ${n(s.verified, "run", "runs")} verified`) : T("尚未运行 bdc verify", "bdc verify not run yet"), "eye", "var(--c7)")}
    </div>
    ${(DATA.diagnostics || []).length ? `<details class="scan-notes callout warn"><summary>${T(`${DATA.diagnostics.length} 项数据索引提醒`, `${DATA.diagnostics.length} indexing notes`)}</summary><ul>${DATA.diagnostics.map(d => `<li><span class="mono xs">${esc(d.path)}</span> · ${esc(d.message)}</li>`).join("")}</ul></details>` : ""}
  </section>
  <section class="section wrap" style="padding-top:8px">
    <div class="ws"><aside class="card lib" aria-label="${T("论文列表", "Papers")}">${libHTML()}</aside>
      <article class="card det" id="det" aria-label="${T("论文详情", "The paper")}"></article></div>
  </section>`;
  $("#lib-list").innerHTML = listHTML();
  $("#det").innerHTML = detailHTML();
  renderTab();
  if (!render.wired) {
    render.wired = true;
    const main = $("#main");
    main.addEventListener("click", e => {
      const t = e.target;
      const pp = t.closest("[data-paper]"); if (pp) { selectPaper(pp.dataset.paper); if (matchMedia("(max-width: 1000px)").matches) $("#det").scrollIntoView({ behavior: K.reduced() ? "auto" : "smooth" }); return; }
      const ch = t.closest("[data-status]"); if (ch) { st.lib.status = ch.dataset.status; $$("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(b === ch))); $("#lib-list").innerHTML = listHTML(); return; }
      const tb = t.closest("[data-tab]"); if (tb) { st.tab = tb.dataset.tab; $$("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b === tb))); setHash(); renderTab(); return; }
      const pg = t.closest("[data-pg]"); if (pg) { const [k, d] = pg.dataset.pg.split(":"); st.pages[k] = (st.pages[k] || 1) + +d; if (k === "rec") renderRecordTable(); else renderTab(); return; }
      const md = t.closest("[data-mode]"); if (md) { st.src.mode = md.dataset.mode; renderTab(); return; }
      const rn = t.closest("[data-run]"); if (rn) { chooseRun(rn.dataset.run); return; }
      const dl = t.closest("[data-dl]"); if (dl) { const it = downloads(paper(), run()).find(x => x[0] === dl.dataset.dl); if (it) it[4](); return; }
      const cv = t.closest("[data-csv]"); if (cv) { const rows = run().derived.tables[cv.dataset.csv]; K.download(`${stem(paper())}.${cv.dataset.csv}.csv`, csv(rows), "text/csv"); return; }
      if (t.closest("[data-guide]")) { openGuide(); return; }
    });
    main.addEventListener("change", e => {
      if (e.target.id === "run-sel") { chooseRun(e.target.value); return; }
      const f = e.target.dataset.f; if (!f) return;
      if (f === "kind" || f === "review" || f === "warn") { st[f] = e.target.value; st.pages.rec = 1; renderRecordTable(); }
      else if (f === "part") { st.src = { ...st.src, part: e.target.value, page: 1, quote: "", rec: "" }; renderTab(); }
      else if (f === "spage") { st.src = { ...st.src, page: +e.target.value, quote: "", rec: "" }; renderTab(); }
    });
    main.addEventListener("input", e => {
      const f = e.target.dataset.f;
      if (f === "q") { st.q = e.target.value; st.pages.rec = 1; renderRecordTable(); }
      if (f === "libq") { st.lib.q = e.target.value; $("#lib-list").innerHTML = listHTML(); }
    });
    // record and evidence buttons live in the page and in the record dialog
    document.addEventListener("click", e => {
      const ev = e.target.closest("[data-ev]"); if (ev) { const x = recordFor(ev.dataset.ev); if (x) showEvidence(x); return; }
      const rc = e.target.closest("[data-rec]"); if (rc) { const x = recordFor(rc.dataset.rec); if (x) openRecord(x); }
    });
  }
  const h = K.hash();
  if (h.rec) { const x = recordFor(h.rec); if (x) openRecord(x); }
}
function chooseRun(id) { st.run = id; st.kind = st.review = st.warn = "all"; st.q = ""; st.pages = {}; setHash(); $("#det").innerHTML = detailHTML(); renderTab(); }
K.mount({ title: () => T("论文看板 · pdf2jsonl", "Papers · pdf2jsonl"), render });
</script>
</body>
</html>
