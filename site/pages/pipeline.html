<!--__HEAD__-->
<style>
/* ---------------------------------------------------------------- hero: the example run as a ribbon of numbers */

.rb + .rb { border-left: 1px solid var(--line); }
.rb + .rb::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: var(--surface); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); z-index: 1; transition: background .15s; }
a.rb:hover { background: var(--surface-2); text-decoration: none; }
.rb .who { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--lc); }
.rb .who svg { width: 13px; height: 13px; }
.rb .v { display: block; font-size: 30px; font-weight: 760; letter-spacing: -.03em; line-height: 1.15; margin-top: 4px; color: var(--tone, var(--ink)); font-variant-numeric: tabular-nums; }
.rb .k { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
@media (max-width: 960px) {
  .ribbon { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rb + .rb::before { display: none; }
  .rb { border-top: 1px solid var(--line); } .rb:nth-child(-n+2) { border-top: 0; }
  .rb + .rb { border-left: 0; } .rb:nth-child(even) { border-left: 1px solid var(--line); }
  .rb:last-child:nth-child(odd) { grid-column: 1 / -1; }
}

/* ---------------------------------------------------------------- 01 the stage map: lanes say who does a stage */
.map-card { padding: 16px 20px 20px; }
.map-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 4px; }
.map-head .legend { font-size: 12.5px; }
.ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--brand); vertical-align: 4px; margin-right: 6px; }
.ln.dash { border-top-style: dashed; border-color: var(--clay); }
.map { position: relative; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); column-gap: 20px; row-gap: 8px; padding: 38px 0 4px 44px; }
.lane { grid-column: 1 / -1; position: relative; margin-left: -44px; min-height: 116px; border-radius: 14px; background: color-mix(in srgb, var(--lc) 6%, transparent); border: 1px solid color-mix(in srgb, var(--lc) 16%, transparent); }
.lane .ll { position: absolute; left: 0; top: 0; bottom: 0; width: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--lc); }
.lane .ll span { writing-mode: vertical-rl; font-size: 12px; font-weight: 700; letter-spacing: .12em; white-space: nowrap; }
.lane .ll svg { width: 16px; height: 16px; }
.pn { position: relative; z-index: 2; align-self: center; margin: 14px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; padding: 11px 11px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); color: var(--ink); transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; }
.pn::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--lc); }
.pn:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--lc) 45%, var(--line)); }
.pn[aria-pressed="true"] { border-color: var(--lc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc) 24%, transparent), var(--shadow-2); }
.pn.lit { animation: lit 1.15s var(--ease); }
@keyframes lit { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lc) 60%, transparent), var(--shadow-2); transform: translateY(-2px); } 100% { box-shadow: 0 0 0 14px transparent, var(--shadow-1); transform: none; } }
.pn-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--lc); }
.pn-no { font: 700 11px var(--mono); letter-spacing: .04em; }
.pn-top svg { width: 15px; height: 15px; }
.pn-body { display: flex; flex-direction: column; min-width: 0; }
.pn-t { font-size: 13.5px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
.pn-lane { display: none; font-size: 11.5px; color: var(--lc); font-weight: 600; }
.pn-m { font-size: 11.5px; color: var(--ink-3); line-height: 1.3; margin-top: 3px; }
.pn-m em { font: normal 760 18px var(--sans); color: var(--ink); letter-spacing: -.02em; margin-right: 3px; font-variant-numeric: tabular-nums; }
.pn-m .x { display: inline-block; margin-left: 4px; color: var(--clay); font-weight: 700; }
.pn.in { background: var(--surface-2); border-style: dashed; }
.pn.in .pn-no { color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.pn.bar { flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; }
.pn.bar .pn-top { flex-direction: column; align-items: flex-start; }
.pn.bar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.pn.bar .chips span { font: 600 11.5px var(--mono); padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--lc) 10%, transparent); color: var(--lc); }
.pn.bar .pn-m { margin: 0 0 0 auto; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: color-mix(in srgb, var(--wc) 32%, var(--line-2)); stroke-width: 1.8; }

.wlabel { position: absolute; z-index: 3; transform: translate(-50%, -50%); font-size: 11.5px; font-weight: 650; color: var(--clay); background: var(--surface); border: 1px solid var(--clay-line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; pointer-events: none; }
.loop-note { display: none; }
@media (max-width: 900px) {
  .map { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 0 26px; }
  .map::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 18px; width: 2px; background: repeating-linear-gradient(180deg, var(--brand-line) 0 6px, transparent 6px 11px); }
  .lane, .wires, .wlabel { display: none; }
  .pn, .pn.bar { margin: 0; align-self: stretch; flex-direction: row; align-items: center; gap: 12px; flex-wrap: nowrap; order: var(--o); }
  .pn::after { content: ""; position: absolute; left: -24px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--lc); transform: translateY(-50%); }
  .pn::before { left: -1px; right: auto; top: 12px; bottom: 12px; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
  .pn-top, .pn.bar .pn-top { flex-direction: column; align-items: center; width: 30px; flex: none; gap: 3px; }
  .pn-body { flex: 1; }
  .pn-lane { display: block; }
  .pn-m, .pn.bar .pn-m { margin: 0 0 0 auto; text-align: right; max-width: 42%; }
  .pn.bar .chips { display: none; }
  .loop-note { display: flex; align-items: center; gap: 8px; order: 99; margin: 4px 0 0 -26px; font-size: 13px; color: var(--clay); font-weight: 600; }
}

/* the detail of the selected stage */

.dt-main { padding: 22px 26px 24px; animation: fade-up .35s var(--ease); }
.dt-side { padding: 22px 24px; background: var(--surface-2); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; animation: fade-up .45s var(--ease); min-width: 0; }
.dt-kick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.dt-no { font: 700 12px var(--mono); color: var(--gold); letter-spacing: .06em; }
.lane-tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--lc); background: color-mix(in srgb, var(--lc) 11%, transparent); border: 1px solid color-mix(in srgb, var(--lc) 26%, transparent); }
.lane-tag svg { width: 14px; height: 14px; }
.dt-main h3 { font-size: 25px; font-weight: 740; letter-spacing: -.02em; margin: 10px 0 10px; }
.dt-lead { color: var(--ink-2); line-height: 1.8; margin: 0; }
.dt-lead code, .dt-does code { font: 12.5px var(--mono); background: var(--surface-3); padding: 1px 5px; border-radius: 5px; }
.dt-does { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 9px; }
.dt-does li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.6; }
.dt-does li svg { color: var(--lc); width: 16px; height: 16px; margin-top: 2px; }
.dt-ex { margin-top: 18px; }
.dt-ex h5, .dt-side h5 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.dt-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.dt-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.dt-tile b { display: block; font-size: 23px; font-weight: 760; letter-spacing: -.02em; line-height: 1.15; color: var(--tc, var(--ink)); font-variant-numeric: tabular-nums; }
.dt-tile span { font-size: 12px; color: var(--ink-3); line-height: 1.35; display: block; margin-top: 2px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file { display: inline-flex; align-items: center; gap: 5px; font: 12px var(--mono); padding: 3px 9px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.file.out { border-color: var(--brand-line); color: var(--brand-ink); background: var(--brand-soft); }
:root[data-theme="dark"] .file.out { color: var(--brand-2); }
.file svg { width: 13px; height: 13px; }
.io { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: baseline; }
.io > span { font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.dt-links { display: flex; flex-wrap: wrap; gap: 8px; }

.dt-nav { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); }
.dots { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 99px; border: 0; background: color-mix(in srgb, var(--lc) 35%, var(--line-2)); transition: width .25s var(--ease), background .2s; }
.dots button[aria-current="true"] { background: var(--lc); width: 24px; }
@media (max-width: 900px) { .detail { grid-template-columns: 1fr; } .dt-side { border-left: 0; border-top: 1px solid var(--line); } .dt-main { padding: 18px 18px 20px; } .dt-side { padding: 18px; } }

/* repairs and the rejection, inside the detail */
.fixes { display: grid; gap: 6px; }
.fx { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 7px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
.fx .c { font: 650 11.5px var(--mono); color: var(--gold); }
.fx .a { color: var(--ink-2); }
.fx .a code { font: 12px var(--mono); color: var(--ink); }
.fx .ft { grid-column: 2; font: 12px var(--mono); overflow-wrap: anywhere; }
.fx .from { color: var(--clay); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--clay) 55%, transparent); }
.fx .to { color: var(--ok); font-weight: 650; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.kinds .tag b { font-variant-numeric: tabular-nums; margin-left: 2px; }

/* ---------------------------------------------------------------- 02 gates: one square per candidate */
.gates { padding: 8px 0; }
.gate { display: grid; grid-template-columns: 210px auto minmax(0, 1fr); gap: 6px 22px; align-items: center; padding: 12px 22px; }
.gate + .gate { border-top: 1px dashed var(--line); }
.g-name { display: flex; align-items: center; gap: 10px; }
.g-name .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--lc) 12%, transparent); color: var(--lc); flex: none; }
.g-name b { display: block; font-size: 14px; }
.g-name small { display: block; font-size: 11.5px; color: var(--lc); font-weight: 600; }
.units { display: flex; gap: 5px; flex-wrap: wrap; }
.u { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); color: #fff; cursor: pointer; transition: transform .15s; padding: 0; }
.u:hover { transform: scale(1.18); z-index: 1; }
.u svg { width: 13px; height: 13px; stroke-width: 2.6; }
.u.model { background: color-mix(in srgb, var(--c7) 22%, var(--surface)); border-color: color-mix(in srgb, var(--c7) 38%, transparent); }
.u.fix { background: var(--gold); border-color: var(--gold); }

.u.gone:hover { transform: none; }
.u.none { visibility: hidden; }
:root[data-theme="dark"] .u.fix, :root[data-theme="dark"] .u.bad, :root[data-theme="dark"] .u.ok { color: #0d1412; }
.g-note { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.g-note b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gates-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.gates-foot .legend .u { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 5px; cursor: default; border-radius: 4px; }
.gates-foot .legend .u:hover { transform: none; }

@media (max-width: 520px) { .u { width: 14px; height: 14px; border-radius: 4px; } .u svg { width: 10px; height: 10px; } .u.sys { font-size: 8px; } .units { gap: 3px; } .gate { padding: 12px 14px; } }
.after .card { padding: 18px 20px; }
.after h3 { font-size: 15.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.after h3 svg { color: var(--lc); }

.big2 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big2 b { font-size: 30px; font-weight: 760; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big2 span { color: var(--ink-2); font-size: 13px; }
.flag { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--info-soft); font-size: 12.5px; line-height: 1.55; }
.flag b { font: 700 12px var(--mono); color: var(--info); }

.urow .units { gap: 2px; }
.urow .u { width: 10px; height: 10px; border-radius: 2px; border-width: 1px; cursor: default; }

.vbar { display: flex; gap: 2px; height: 12px; margin: 16px 0 8px; }

.vleg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
.vleg b { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- 03 poster, 04 commands */
.poster { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); overflow: hidden; }

<script>

const SCRIPT = "skills/pdf2jsonl/scripts/pdf2jsonl";

// ---------------------------------------------------------------- who does what: one lane each

  human: { row: 1, c: "var(--gold)", icon: "user", zh: "人", en: "People", dzh: "写规范 · 做复核", den: "writes the contract · reviews" },
  model: { row: 2, c: "var(--c7)", icon: "sparkle", zh: "模型", en: "Model", dzh: "只抄写与核对", den: "copies and cross-checks" },

const laneName = k => T(LANES[k].zh, LANES[k].en);

// ---------------------------------------------------------------- the stages, with what the example run shows of each
const NODES = [
  { id: "contract", lane: "human", col: 1, kind: "in", icon: "book", zh: "数据契约", en: "The contract",

      "Everything starts from a contract that people write: the field catalog, controlled vocabularies, extraction profiles and cross-field rules. <code>bdc release</code> freezes them into a hashed release; every run pins one release, and every record names the release it follows."],

      ["旧版本永久保留：按旧版本写的记录仍按旧版本校验", "Old releases are kept for good: records written under one are still validated against it"]],
    tiles: [[S.fields, "个字段", "fields"], [S.rules, "条跨字段规则", "cross-field rules"], [S.vocabularies, "个受控词表", "vocabularies"], [S.releases, "个冻结版本", "frozen releases", "gold"]],
    reads: ["field_catalog/field_catalog.yaml", "vocabularies/", "profiles/"], writes: [`releases/${VER}/`],
    cmd: ["bdc check", "bdc release"],
    links: [["fields.html", "字段目录", "Field catalog", "table"], ["contract.html", "规范总览", "The contract", "book"], ["contract.html#releases", "版本历史", "Releases", "clock"]] },

// a polyline with rounded corners
function rounded(pts, r = 11) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1);
    if (d1 < .5 || d2 < .5) continue;
    const rr = Math.min(r, d1 / 2, d2 / 2);
    d += ` L${(x1 - (x1 - x0) / d1 * rr).toFixed(1)} ${(y1 - (y1 - y0) / d1 * rr).toFixed(1)} Q${x1.toFixed(1)} ${y1.toFixed(1)} ${(x1 + (x2 - x1) / d2 * rr).toFixed(1)} ${(y1 + (y2 - y1) / d2 * rr).toFixed(1)}`;
  }
  const [xn, yn] = pts[pts.length - 1];
  return d + ` L${xn.toFixed(1)} ${yn.toFixed(1)}`;
}
function drawWires() {
  const map = $("#map"), svg = $("#wires");
  if (!map || !svg) return;
  map.querySelectorAll(".wlabel").forEach(e => e.remove());
  if (getComputedStyle(map).display !== "grid") { svg.innerHTML = ""; return; }
  const box = map.getBoundingClientRect();
  const R = id => { const b = map.querySelector(`[data-node="${id}"]`).getBoundingClientRect();
    return { l: b.left - box.left, r: b.right - box.left, t: b.top - box.top, b: b.bottom - box.top, cx: b.left - box.left + b.width / 2, cy: b.top - box.top + b.height / 2 }; };
  const A = 4, off = 9, colors = {};
  const paths = EDGES.map(([s, o, kind, c = "var(--brand)"]) => {
    const a = R(s), b = R(o);
    let pts;
    if (kind === "h") pts = Math.abs(a.cy - b.cy) < 2 ? [[a.r, a.cy], [b.l - A, a.cy]] : [[a.r, a.cy], [(a.r + b.l) / 2, a.cy], [(a.r + b.l) / 2, b.cy], [b.l - A, b.cy]];
    else if (kind === "up") pts = [[a.r, a.cy], [b.cx - off, a.cy], [b.cx - off, b.b + A]];
    else if (kind === "down") pts = [[a.cx + off, a.b], [a.cx + off, b.cy], [b.l - A, b.cy]];
    else if (kind === "ru") pts = [[a.r, a.cy], [b.cx, a.cy], [b.cx, b.b + A]];
    else if (kind === "rd") pts = [[a.r, a.cy], [b.cx, a.cy], [b.cx, b.t - A]];
    else { const y = 15; pts = [[a.cx, a.t], [a.cx, y], [b.cx, y], [b.cx, b.t - A]];
      const lab = document.createElement("span"); lab.className = "wlabel"; lab.style.left = `${(a.cx + b.cx) / 2}px`; lab.style.top = `${y}px`;
      lab.textContent = T("复核的发现 → 修订规范，或重跑", "What review finds → revise the contract, or rerun"); map.append(lab); }
    const key = c.replace(/\W/g, ""); colors[key] = c;
    return { k: `${s}>${o}`, d: rounded(pts), c, key, loop: kind === "loop" };
  });
  svg.innerHTML = `<defs>${Object.entries(colors).map(([k, c]) => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" style="fill:${c}"/></marker>`).join("")}</defs>`
    + paths.map(p => `<g data-edge="${p.k}" style="--wc:${p.c}"><path class="wire${p.loop ? " loop" : ""}" d="${p.d}" marker-end="url(#ah-${p.key})"/>${p.loop ? "" : `<path class="wire flow" d="${p.d}"/>`}</g>`).join("");
}

function spark(edgeKey) {
  const g = $(`#wires [data-edge="${edgeKey}"]`); if (!g) return;
  const d = g.querySelector("path").getAttribute("d"), ns = "http://www.w3.org/2000/svg";

  const a = document.createElementNS(ns, "animateMotion"); a.setAttribute("dur", "0.85s"); a.setAttribute("fill", "freeze"); a.setAttribute("begin", "indefinite"); a.setAttribute("path", d);
  c.append(a); g.append(c);

      <p class="xs muted" style="margin:10px 0 0">${T("审计只报告结构和连通性，不判断结论对错；标记不会让记录被拒。", "The audit reports structure and connectivity, not whether a conclusion is right; a flag never rejects a record.")}</p>
      <a class="go" href="demo.html#chain">${T("看证据链", "See the evidence chain")} ${icon("arrow")}</a></div>
    <div class="card reveal" style="--lc:var(--c7)"><h3>${icon("eye")}${T("语义校验", "Semantic check")}</h3><div class="sub">${T(`另一个模型 · 示例 ${V.paper}`, `A second model · example ${V.paper}`)}</div>
      <div class="big2"><b>${V.counts.tasks}</b><span>${T(`项核对：${V.counts.by_kind.record || 0} 条记录、${V.counts.by_kind.link || 0} 条关联`, `checks: ${V.counts.by_kind.record || 0} records, ${V.counts.by_kind.link || 0} links`)}</span></div>
      ${verdictHTML()}
      <a class="go" href="papers.html#paper=${encodeURIComponent(V.paper_id)}&tab=verify">${T("在论文看板中看结论", "See the findings in the dashboard")} ${icon("arrow")}</a></div>
    <div class="card reveal" style="--lc:var(--gold)"><h3>${icon("user")}${T("人工复核", "Human review")}</h3><div class="sub">${T("论文看板 · 全部论文", "Paper dashboard · every paper")}</div>
      <div class="big2"><b>${P.pending}</b><span>${T(`条记录等待复核，共 ${P.records} 条、${P.papers} 篇论文`, `records wait for review, of ${P.records} in ${P.papers} papers`)}</span></div>
      <div class="vbar" role="img" aria-label="${P.pending} / ${P.records}"><i style="flex:${P.records - P.pending};background:var(--brand)"></i><i style="flex:${P.pending};background:var(--amber)"></i></div>
      <div class="vleg"><span><i style="background:var(--brand)"></i>${T("已通过或已校验", "passed or verified")} <b>${P.records - P.pending}</b></span><span><i style="background:var(--amber)"></i>${T("待复核", "pending review")} <b>${P.pending}</b></span></div>
      <p class="xs muted" style="margin:12px 0 0">${T("复核状态写在每条记录里；下游可以只取已校验的记录。", "The review status is written into every record, so downstream users can take only verified ones.")}</p>
      <a class="go" href="papers.html">${T("打开论文看板", "Open the paper dashboard")} ${icon("arrow")}</a></div>
  </div>`;
}

// ---------------------------------------------------------------- page
function render() {
  const lane = k => `<span class="who" style="--lc:${LANES[k].c}">${icon(LANES[k].icon)}${esc(laneName(k))}</span>`;
  const rb = (id, k, v, zh, en, tone) => `<a class="rb" href="#stage=${id}" data-sel="${id}"${tone ? ` style="--tone:${tone}"` : ""}>${lane(k)}<span class="v" data-count="${v}">0</span><span class="k">${esc(T(zh, en))}</span></a>`;
  const svgFile = K.lang === "en" ? "assets/pipeline.en.svg" : "assets/pipeline.svg";
  $("#main").innerHTML = `
  <section class="page-hero wrap">
    <span class="eyebrow">${T("管线 · 从 PDF 到可复用的记录", "Pipeline · from a PDF to reusable records")}</span>
    <h1>${T("模型只抄写，<em>其余每一步都可检查</em>", "The model only copies; <em>every other step can be checked</em>")}</h1>
    <p class="lead">${T("一篇论文经过八个阶段，变成经过校验、能回查到原文的记录，再派生出图谱、语料和关系表。只有两个阶段用到模型：抽取候选，以及由另一个模型做的语义校验。其余都是确定性的代码，同样的输入得到逐字节相同的输出。人负责写规范和最后的复核。",
      "A paper passes through eight stages to become validated records that trace back to the text, and from them a graph, a corpus and tables. Only two stages use a model: extracting candidates, and the semantic check by a second model. The rest is deterministic code, so the same input gives byte-identical output. People write the contract and do the final review.")}</p>
    <div class="ribbon reveal" aria-label="${T("示例运行的数字", "The example run in numbers")}">
      ${rb("pdf", "code", R.pages, "页 PDF 进入管线", "PDF pages in")}
      ${rb("extract", "model", R.candidates, "个候选，带逐字引文", "candidates with verbatim quotes")}
      ${rb("check", "code", R.repairs, "处结构修复，逐条记账", "structural repairs, each logged", "var(--gold)")}
      ${rb("check", "code", R.rejected, "个候选被拒，附原因", "candidate rejected, with the reason", "var(--clay)")}
      ${rb("validate", "code", R.records, `条记录，含 ${R.system} 条系统记录`, `records, ${R.system} of them a system record`, "var(--brand)")}
      ${rb("review", "human", R.pending, "条待人工复核", "wait for human review", "var(--amber)")}
      ${rb("derive", "code", X.triples, "个图谱三元组", "knowledge-graph triples")}
    </div>
  </section>

  <section class="section wrap" id="stages">
    <div class="section-head"><span class="no">01</span><h2>${T("八个阶段，三类执行者", "Eight stages, three kinds of actor")}</h2>
      <p>${T("每个方块是一个阶段，它所在的泳道说明由谁来做。点一个阶段，下面会显示它做什么、示例运行里的数字、读写的文件和命令。", "Each box is a stage, and its lane says who does it. Click a stage to see what it does, its numbers in the example run, the files it reads and writes, and the command.")}</p></div>
    <div class="card map-card reveal">
      <div class="map-head"><span class="legend"><span><i class="ln"></i>${T("数据流", "data flow")}</span><span><i class="ln dash"></i>${T("反馈：修订或重跑", "feedback: revise or rerun")}</span><span class="muted">${T("数字来自仓库内的合成示例论文", "Numbers from the synthetic example paper in the repository")}</span></span>
        ${K.reduced() ? "" : `<button type="button" class="btn sm" id="tour-btn"></button>`}</div>
      ${mapHTML()}
    </div>
    <div class="card detail" id="detail" aria-live="polite"></div>
  </section>

  <section class="section wrap" id="gates">
    <div class="section-head"><span class="no">02</span><h2>${T("一条记录要过的关口", "The gates a record passes")}</h2>
      <p>${T(`示例论文的 ${G.candidates.length} 个候选逐个走过每道关口，一个方块就是一个候选：修复过的、被拒的、带警告的都看得见。之后还有证据链审计、另一个模型的语义校验和人工复核。`,
        `The ${G.candidates.length} candidates of the example paper go through every gate, one square per candidate: what was repaired, rejected or warned about is all visible. After them come the evidence-chain audit, the semantic check by a second model, and human review.`)}</p></div>
    ${gatesHTML()}
    <h3 class="sub">${icon("shield")}${T("结构之后：审计、语义校验与人工复核", "After the structure: audit, semantic check and human review")}</h3>
    ${afterHTML()}
  </section>

  <section class="section wrap" id="poster">
    <div class="section-head"><span class="no">03</span><h2>${T("一页总览图", "The one-page diagram")}</h2>
      <p>${T("同一条管线的静态总览，放进幻灯片和文档都合适。", "The same pipeline as a static overview, ready for slides and documents.")}</p></div>
    <div class="card poster reveal">
      <a class="shot" href="${svgFile}" target="_blank" rel="noopener" aria-label="${T("打开总览图", "Open the diagram")}"><img src="${svgFile}" alt="${T("pdf2jsonl 数据管线总览图", "Overview diagram of the pdf2jsonl data pipeline")}"></a>
      <div class="txt"><h3>${T("从论文到可追溯的原子数据", "From papers to traceable atomic data")}</h3>
        <p>${T("共享的规范与版本、PDF 抽取的九个步骤、存量数据导入、拒绝与复核的反馈回路，以及四类下游产物，都在一张 SVG 里。", "The shared contract and its releases, the nine steps of PDF extraction, the importers, the loop of rejections and review, and the four kinds of downstream output, in one SVG.")}</p>
        <p class="xs muted">${T("源文件 docs/diagrams/pipeline.html；改动后用 make diagram 重新导出中英文两版。", "Source: docs/diagrams/pipeline.html; make diagram re-exports both the Chinese and the English version.")}</p>
        <div class="row"><a class="btn primary sm" href="${svgFile}" target="_blank" rel="noopener">${icon("external")}${T("打开大图", "Open full size")}</a>
          <a class="btn sm" href="${svgFile}" download>${icon("download")}${T("下载 SVG", "Download SVG")}</a>
          <a class="btn sm ghost" href="${K.lang === "en" ? "assets/pipeline.svg" : "assets/pipeline.en.svg"}" target="_blank" rel="noopener">${K.lang === "en" ? "中文版" : "English"}</a></div></div>
    </div>
  </section>

  <section class="section wrap" id="run">
    <div class="section-head"><span class="no">04</span><h2>${T("自己跑一遍", "Run it yourself")}</h2>
      <p>${T("在仓库根目录执行。bdc 随 pip install -e . 一起安装；out/ 下的运行目录不入库，make dashboard 把它们放进本地论文看板。", "Run these from the repository root. bdc comes with pip install -e .; run directories under out/ are not committed, and make dashboard puts them into a local paper dashboard.")}</p></div>
    <div class="grid g2">
      <div class="card pad cmd reveal" style="--lc:var(--c7)"><h3>${icon("sparkle")}${T("抽取一篇论文（智能体模式）", "Extract a paper (agent mode)")}</h3>
        <p>${T("准备之后，由你的智能体读简报写候选；再收尾一次，管线完成其余所有步骤。", "After prepare, your agent reads the brief and writes the candidates; finalize then does every other step.")}</p>
        ${term([`${SCRIPT} prepare \\\n    papers/paper.pdf --out-dir out/paper`, T("# 智能体写出 paper.work/candidates.json", "# the agent writes paper.work/candidates.json"), `${SCRIPT} finalize \\\n    out/paper/paper.work --bundle`])}</div>
      <div class="card pad cmd reveal" style="--lc:var(--c7)"><h3>${icon("eye")}${T("语义校验", "Semantic check")}</h3>
        <p>${T("任务交给另一个模型；带上清单，可以确认验证者不是抽取模型本身。", "The tasks go to a second model; with the manifest, apply can tell whether the verifier is the extraction model itself.")}</p>
        ${term(["bdc verify tasks out/paper/paper.jsonl --out out/paper", T("# 另一个模型写出 paper.verify.verdicts.json", "# a second model writes paper.verify.verdicts.json"), "bdc verify apply out/paper/paper.jsonl \\\n    out/paper/paper.verify.verdicts.json --out out/paper \\\n    --manifest out/paper/paper.manifest.json"])}</div>
      <div class="card pad cmd reveal" style="--lc:var(--brand)"><h3>${icon("graph")}${T("派生与查看", "Derive and look")}</h3>
        <p>${T("从记录派生所有下游产物，再把仓库里的论文和运行汇总成本地看板。", "Derive every downstream output from the records, then gather the papers and runs of the repository into a local dashboard.")}</p>
        ${term(["bdc derive out/paper/paper.verified.jsonl \\\n    --out out/paper/derived", "make dashboard"])}</div>
      <div class="card pad cmd reveal" style="--lc:var(--info)"><h3>${icon("import")}${T("导入已有数据", "Import existing data")}</h3>
        <p>${T("三种存档格式各有一个导入器；bdc check 确认每份映射覆盖了全部来源叶子。", "Each of the three archived formats has an importer; bdc check confirms every mapping covers all source leaves.")}</p>
        ${term(["bdc migrate merged \\\n    sources/merged_v2/breeding_jsonl_example_v2.json \\\n    --page-offset 2220 --out out/merged", "bdc check"])}</div>
    </div>
  </section>`;

  select(sel, { hash: false });
  setTour(tour.on);
  requestAnimationFrame(drawWires);
  if (!render.wired) {
    render.wired = true;
    const main = $("#main"), tip = document.createElement("div");
    tip.className = "tip"; tip.setAttribute("role", "tooltip"); document.body.append(tip);
    main.addEventListener("click", e => {
      const n = e.target.closest("[data-node]");
      if (n) { setTour(false); select(n.dataset.node, { scroll: matchMedia("(max-width: 900px)").matches }); return; }
      const s = e.target.closest("[data-sel]");
      if (s) { e.preventDefault(); select(s.dataset.sel, { scroll: !s.closest(".dots") }); if (!s.closest(".dots")) $("#stages").scrollIntoView({ behavior: K.reduced() ? "auto" : "smooth" }); return; }
      const st = e.target.closest("[data-step]");
      if (st) { const i = ORDER.indexOf(sel) + +st.dataset.step; if (ORDER[i]) select(ORDER[i]); return; }
      if (e.target.closest("#tour-btn")) { setTour(!tour.on); return; }
      const u = e.target.closest("button[data-u]");
      if (u) { const info = unitInfo(u.dataset.u, u.dataset.row); if (info.href) location.href = info.href; }
    });
    main.addEventListener("pointerover", e => {
      const u = e.target.closest("button[data-u]"); if (!u) return;
      tip.innerHTML = unitInfo(u.dataset.u, u.dataset.row).html; tip.classList.add("show");
      const b = u.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, b.left + b.width / 2 - w / 2))}px`;
      tip.style.top = `${b.top - h - 10 < 8 ? b.bottom + 10 : b.top - h - 10}px`;
    });
    main.addEventListener("pointerout", e => { if (e.target.closest("button[data-u]")) tip.classList.remove("show"); });
    addEventListener("scroll", () => tip.classList.remove("show"), { passive: true });
    new ResizeObserver(() => drawWires()).observe(main);
    document.fonts?.ready.then(drawWires);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) step(); });
    if ("IntersectionObserver" in window) tour.io = new IntersectionObserver(es => es.forEach(x => { tour.visible = x.isIntersecting; if (tour.visible) step(); else clearTimeout(tour.t); }), { threshold: .25 });
    else tour.visible = true;
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea, select") || !$("#detail")) return;
      const r = $("#stages").getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
      const i = ORDER.indexOf(sel) + (e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0);
      if (i !== ORDER.indexOf(sel) && ORDER[i]) { setTour(false); select(ORDER[i]); }
    });
  }
  if (tour.io) { tour.io.disconnect(); tour.io.observe($(".map-card")); }
  if (K.hash().stage) requestAnimationFrame(() => $("#stages").scrollIntoView());
}
K.mount({ title: () => T("管线 · pdf2jsonl", "Pipeline · pdf2jsonl"), render });
</script>
</body>
