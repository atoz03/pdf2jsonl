<script>
"use strict";
const DATA = JSON.parse(document.getElementById("site-data").textContent);
const C = DATA.contract, D = DATA.demo, X = D.derived;
const F = Object.fromEntries(C.fields.map(f => [f.path, f]));
const GROUPS = Object.keys(C.groups);
const AV = ["D", "N", "I", "G", "F"];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const av = a => `<span class="badge av-${a}" title="${esc(C.codes.availability[a].label_en)} · ${esc(C.codes.availability[a].label_zh)}">${a}</span>`;
const fieldLink = (p, label) => `<a class="mono" href="#fields?q=${encodeURIComponent(p)}" title="${esc(F[p] ? F[p].definition_zh : "")}">${esc(label || p)}</a>`;
const count = (arr, fn) => arr.reduce((n, x) => n + (fn(x) ? 1 : 0), 0);
const FN = C.codes.function || {}, ROLE = C.codes.key_role || {}, FAM = C.codes.key_role_family || {};
const ARG = C.codes.argument_role || {}, CARD = C.codes.card || {};
const FNS = Object.keys(FN);
const isAdded = (f, fn) => !(f.serves_src || []).includes(fn);
const fnTag = (f, fn) => `<span class="tag${isAdded(f, fn) ? "" : " acc"}" title="${esc((FN[fn] || {}).label_zh || fn)} — ${isAdded(f, fn) ? "added by the repository" : "stated by the source"}">${esc((FN[fn] || {}).short_zh || fn)}${isAdded(f, fn) ? "⁺" : ""}</span>`;
const roleTag = r => r ? `<a class="tag" href="#fields?role=${encodeURIComponent(r)}" title="${esc((ROLE[r] || {}).description_zh || "")}">${esc((ROLE[r] || {}).label_zh || r)}</a>` : "";
const facetsOf = (f, fn) => (((ROLE[f.key_role] || {}).facets || {})[fn] || []);
const facetLabel = (fn, k) => (((FN[fn] || {}).facets || {})[k] || {}).label_zh || k;
const TAGS = C.tags || {}, ORIGIN = C.codes.origin || {};
const docTag = t => `<a class="tag" href="#fields?tag=${encodeURIComponent(t)}" title="${esc((TAGS[t] || {}).description_zh || "")}">${esc((TAGS[t] || {}).label_zh || t)}</a>`;
const fl = p => F[p] ? fieldLink(p) : `<span class="mono">${esc(p)}</span>`;
const short = v => typeof v === "string" ? v : JSON.stringify(v);

// ---------------------------------------------------------------- JSON view with field-name links
function jsonHTML(v, ind = "", parentKey = null, depth = 0) {
  const pad = ind + "  ";
  if (v === null) return '<span class="j-lit">null</span>';
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    if (v.every(x => typeof x !== "object" || x === null) && JSON.stringify(v).length < 80)
      return "[" + v.map(x => jsonHTML(x, pad)).join(", ") + "]";
    return "[\n" + v.map(x => pad + jsonHTML(x, pad, null, depth + 1)).join(",\n") + "\n" + ind + "]";
  }
  if (typeof v === "object") {
    const ks = Object.keys(v);
    if (!ks.length) return "{}";
    return "{\n" + ks.map(k => pad + keyHTML(k, parentKey, depth) + ": " + jsonHTML(v[k], pad, k, depth + 1)).join(",\n") + "\n" + ind + "}";
  }
  if (typeof v === "string") return '<span class="j-str">' + esc(JSON.stringify(v)) + "</span>";
  if (typeof v === "number") return '<span class="j-num">' + v + "</span>";
  return '<span class="j-lit">' + v + "</span>";
}
function keyHTML(k, parentKey, depth) {
  const path = F[k] ? k : (depth === 1 && GROUPS.includes(parentKey) && F[parentKey + "." + k]) ? parentKey + "." + k : null;
  const q = esc(JSON.stringify(k));
  return path ? `<a class="j-key" href="#fields?q=${encodeURIComponent(path)}" title="${esc(path + " — " + F[path].definition_zh)}">${q}</a>` : `<span class="j-key">${q}</span>`;
}

function renderFieldRows() {
  const q = FS.q.trim().toLowerCase();

    (!FS.group || f.group === FS.group) && FS.av.has(f.availability) && (!prof || prof.roles[f.path]) &&
    (!FS.maturity || f.maturity === FS.maturity) && (!FS.since || f.since === FS.since) && (!FS.req || f.required === FS.req) &&
    (!FS.fn || (f.serves || []).includes(FS.fn)) && (!FS.role || f.key_role === FS.role) &&
    (!FS.tag || (f.tags || []).includes(FS.tag)) && (!FS.origin || (f.origin || []).includes(FS.origin)) &&
    (!q || (f.path + " " + (f.definition_zh || "") + " " + (f.data_source_zh || "") + " " + (f.vocabulary || "") + " " +
      (f.key_role || "") + " " + ((ROLE[f.key_role] || {}).label_zh || "") + " " + (f.tags || []).map(t => (TAGS[t] || {}).label_zh || t).join(" ") +
      " " + (f.example !== undefined ? short(f.example) : "")).toLowerCase().includes(q)));
  if (rows.length === 1) FS.open = rows[0].path;
  $("#f-count").textContent = `${rows.length} of ${C.fields.length} fields`;
  $("#f-body").innerHTML = rows.map(f => {
    const [g, n] = [f.group, f.path.slice(f.group.length + 1)];

    return row + (FS.open === f.path ? `<tr class="detail"><td colspan="6">${fieldDetail(f)}</td></tr>` : "");

    const k = b.dataset.kind; GS.kinds.has(k) ? GS.kinds.delete(k) : GS.kinds.add(k);
    b.setAttribute("aria-pressed", GS.kinds.has(k)); renderGraph();
  }));
  renderGraph();
}

// ---------------------------------------------------------------- importers
const MAPCOL = { mapped: "var(--av-I)", merged: "var(--av-D)", transformed: "var(--av-G)", partial: "var(--av-N)", control: "var(--text-3)", view_only: "var(--text-3)", unmapped: "var(--border)", forbidden: "var(--err)" };
const MAPHELP = { mapped: "copied to one contract field", merged: "lands in a field shared with other origins", transformed: "converted by a named rule", partial: "kept where the value fits, otherwise residue",
  control: "run or governance state, reported not migrated", view_only: "a derived view, rebuilt on demand", unmapped: "no contract field; kept in the residue file", forbidden: "must not be migrated" };
function renderImporters() {
  const card = m => {
    const order = Object.keys(MAPCOL).filter(k => m.status[k]);
    const cmd = `bdc migrate ${m.command} ${m.input} --out out/${m.command}${m.args ? " " + m.args : ""}`;
    return `<div class="card pad imp">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3 class="mono">bdc migrate ${esc(m.command)}</h3><span class="tag acc">${esc(m.origin)}</span>
        <span class="muted">${esc(m.title_zh)}${m.version && !m.title_zh.includes(String(m.version).replace(/^v/, "")) ? " · " + esc(m.version) : ""}</span></div>
      <div class="small" style="margin-top:4px">Input: ${esc(m.shape)}.</div>
      <div class="cmd">${esc(cmd)}</div>
      <div class="grid2">
        <div><b class="small">Mapping</b> <span class="small muted mono">${esc(m.mapping_file)}</span>
          <div class="bar" role="img" aria-label="Mapping status of ${m.leaves} source leaves">${order.map(k => `<i style="width:${(100 * m.status[k] / m.leaves).toFixed(2)}%;background:${MAPCOL[k]}" title="${esc(k)}: ${m.status[k]}"></i>`).join("")}</div>
          <div class="legend">${order.map(k => `<span title="${esc(MAPHELP[k] || "")}"><i style="background:${MAPCOL[k]}"></i>${esc(k)} ${m.status[k]}</span>`).join("")}</div>
          <div class="small muted">${m.leaves} source leaves accounted for · ${m.targets} contract fields reached ·
            <a href="#fields?origin=${encodeURIComponent(m.origin)}">${m.fields_shared} field${m.fields_shared === 1 ? "" : "s"} list this origin</a>${m.fields_added ? ` (${m.fields_added} added by it)` : ""}</div></div>
        <div><b class="small">Example run</b> <span class="small muted mono">${esc(m.example_dir)}/</span>
          <div class="mini"><div><b>${m.counts.records}</b><span>records</span></div><div><b>${m.counts.rejected}</b><span>rejected</span></div>
            <div><b>${m.counts.residue_leaves}</b><span>residue leaves</span></div>${m.counts.review_candidates != null ? `<div><b>${m.counts.review_candidates}</b><span>flagged for review</span></div>` : ""}</div>
          <div class="small">${Object.entries(m.by_kind).map(([k, n]) => `<span class="tag">${esc(k)} ${n}</span>`).join(" ")}</div>
          ${Object.keys(m.rejected_by_code).length ? `<div class="small muted" style="margin-top:4px">rejected: ${Object.entries(m.rejected_by_code).map(([k, n]) => `${esc(k)} ${n}`).join(" · ")}</div>` : ""}
          <div class="small muted" style="margin-top:4px">validated against contract ${esc(m.contract_version)}</div></div>
      </div>
      <details><summary>Principles and issue register (${m.issues.length})</summary>
        <ul class="issues small">${m.principles_zh.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>ID</th><th>Issue</th><th>Finding</th><th>Resolution</th></tr></thead><tbody>
          ${m.issues.map(x => `<tr><td class="mono">${esc(x.id)}</td><td>${esc(x.title_zh || "")}</td><td class="small">${esc(x.finding_zh || "")}</td><td class="small">${esc(x.resolution_zh || "")}</td></tr>`).join("")}
        </tbody></table></div></details>
      <details><summary>A migrated record</summary><div class="card"><pre class="json">${jsonHTML(m.sample)}</pre></div></details>
    </div>`;
  };
  $("#view-importers").innerHTML = `<h2>Importers: existing data into the same records</h2>
    <p class="lead">Data that already exists in another shape enters through an importer, not through a second schema. Each importer reads one archived source format,
      follows a mapping that accounts for <b>every</b> leaf of that format, splits documents into atomic records and validates them against the same contract as extracted records.
      What cannot be mapped is kept in a residue file and what fails validation in an errors file: nothing is dropped silently, and nothing is invented to fill a required field.</p>
    <ol class="flow">
      <li><b>Check the source</b><div>input validated against the archived source schema and version</div></li>
      <li><b>Map</b><div>every source leaf has a status in <code>mappings/*.yaml</code>; <code>bdc check</code> fails on an uncovered leaf</div></li>
      <li><b>Split &amp; join</b><div>one record per fact; samples, assays and assets joined by explicit IDs only</div></li>
      <li><b>Validate</b><div>same schema, rules and vocabularies as extracted records; all imports start as <code>pending_review</code></div></li>
      <li><b>Account</b><div>records · errors · residue · a migration report with source and mapping hashes</div></li>
    </ol>
    ${DATA.importers.map(card).join("")}
    <p class="small muted">Imported records appear next to extracted ones in <a href="#records">Record examples</a>. The archived source files and their hashes are listed in <code>sources/SOURCES.md</code>;
      the differences between the sources and the merge decisions are in <code>docs/source_analysis.md</code>.</p>`;
}

// ---------------------------------------------------------------- record gallery
function renderRecords() {
  const html = DATA.gallery.map(g => {
    const r = g.record, rows = [];
    for (const grp of Object.keys(r)) for (const [k, v] of Object.entries(r[grp])) rows.push([grp + "." + k, v]);
    return `<div class="card"><div class="pad" style="padding-bottom:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <h4 class="mono">${esc(r.common.record_kind)}</h4><span class="muted">${esc((C.record_kinds[r.common.record_kind] || {}).label_zh || "")}</span>
        <span class="spacer" style="flex:1"></span><span class="tag">${esc(g.source)}</span></div>
        <div class="small" style="margin-top:4px">${esc(summary(r))}</div><div class="small muted mono">${esc(g.file)}</div></div>
      <div style="max-height:360px;overflow:auto;border-top:1px solid var(--border)"><table class="ftable"><tbody>
        ${rows.map(([p, v]) => `<tr><td>${F[p] ? `${av(F[p].availability)} ` + fieldLink(p) : esc(p)}</td><td>${esc(typeof v === "string" ? v : JSON.stringify(v))}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
  $("#view-records").innerHTML = `<h2>Record examples</h2>
    <p class="lead">One valid record per kind and way in: curated examples, pdf2jsonl output and each <a href="#importers">importer</a>. Every record
      carries <code>schema_name</code> + <code>schema_version</code>, a stable <code>record_id</code> and provenance, and omits missing values. Field names link to the catalog.</p>
    <div class="gal">${html}</div>`;
}

// ---------------------------------------------------------------- vocabularies
function renderVocab(q = "") {
  if (!$("#v-q")) {
    $("#view-vocab").innerHTML = `<h2>Controlled vocabularies</h2>
      <p class="lead"><b>error</b> vocabularies are enforced by the schema. <b>warning</b> vocabularies report unknown codes. <b>open</b> vocabularies only suggest codes.
        Codes proposed by the repository for Chinese-only source lists are warning-level until confirmed.</p>
      <div class="controls"><input type="search" id="v-q" placeholder="Search vocabulary, code or label…" aria-label="Search vocabularies"></div><div class="vgrid" id="v-grid"></div>`;
    $("#v-q").addEventListener("input", e => renderVocab(e.target.value));
  }
  $("#v-q").value = q;
  const s = q.trim().toLowerCase();
  const used = v => C.fields.filter(f => f.vocabulary === v.name).map(f => fieldLink(f.path)).join(" ");
  $("#v-grid").innerHTML = C.vocabularies.filter(v => !s || JSON.stringify(v).toLowerCase().includes(s)).map(v => `
    <div class="card pad"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b class="mono">${esc(v.name)}</b><span class="muted">${esc(v.title_zh || "")}</span></div>
      <div style="margin:6px 0;display:flex;gap:6px;flex-wrap:wrap"><span class="tag ${v.enforcement === "error" ? "err" : v.enforcement === "warning" ? "warn" : ""}">${esc(v.enforcement)}</span>
        <span class="tag">${esc(v.closure)}</span><span class="tag">${esc(v.code_status)}</span></div>
      <div class="small" style="margin-bottom:6px">${used(v) || '<span class="muted">not bound to a field</span>'}</div>
      <table class="ftable"><tbody>${v.values.map(x => `<tr><td>${esc(x.code)}</td><td style="font-family:inherit">${esc(x.label_zh || "")}${x.aliases ? ` <span class="muted small">(${esc(x.aliases.join(", "))})</span>` : ""}</td></tr>`).join("")}</tbody></table></div>`).join("")
    || '<p class="muted">No vocabulary matches.</p>';
}

// ---------------------------------------------------------------- rules & ambiguities
function renderRules(amb) {
  $("#view-rules").innerHTML = `<h2>Cross-field rules</h2>
    <p class="lead">Rules taken from explicit source statements are <b>errors</b>. Anything only implied by the sources is a <b>warning</b>: the contract never enforces inferred semantics.</p>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Severity</th><th>Basis</th><th>Kind</th><th>Rule (规则)</th><th>Fields</th></tr></thead><tbody>
      ${C.rules.map(r => `<tr><td class="mono">${esc(r.id)}</td><td><span class="tag ${r.severity === "error" ? "err" : "warn"}">${esc(r.severity)}</span></td><td class="small">${esc(r.basis)}</td>
        <td class="mono small">${esc(r.kind)}</td><td>${esc(r.title_zh)}</td><td class="small">${r.fields.map(p => p === "*" ? "<i>all fields</i>" : fieldLink(p)).join(" ")}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>Ambiguity register</h3>
    <p class="small muted">Where the sources are silent or disagree, the decision is recorded here instead of being made silently. <b>open</b> and <b>provisional</b> items await the data owners.</p>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Status</th><th>Question (问题)</th><th>Finding</th><th>Resolution</th></tr></thead><tbody>
      ${C.ambiguities.map(a => `<tr id="amb-${esc(a.id)}" ${a.id === amb ? 'style="outline:2px solid var(--accent)"' : ""}><td class="mono">${esc(a.id)}</td>
        <td><span class="tag ${a.status === "decided" ? "ok" : a.status === "open" ? "warn" : ""}">${esc(a.status)}</span></td>
        <td>${esc(a.title_zh)}</td><td class="small">${esc(a.finding_zh || "")}</td><td class="small">${esc(a.resolution_zh || "")}</td></tr>`).join("")}
    </tbody></table></div>`;
  if (amb) { const tr = document.getElementById("amb-" + amb); if (tr) tr.scrollIntoView({ block: "center" }); }
}

// ---------------------------------------------------------------- routing
const rendered = new Set();
function route() {
  const [view, qs] = (location.hash.slice(1) || "overview").split("?");
  const name = document.getElementById("view-" + view) ? view : "overview";
  const params = new URLSearchParams(qs || "");
  document.querySelectorAll("section.view").forEach(s => s.hidden = s.id !== "view-" + name);
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("active", a.dataset.view === name));
  if (name === "overview" && !rendered.has(name)) renderOverview();
  if (name === "fields") {
    if (!rendered.has(name)) renderFieldsShell();
    if (qs !== undefined) {
      Object.assign(FS, { q: params.get("q") || "", group: params.get("group") || "", profile: "", maturity: "", since: "", req: "",
        fn: params.get("fn") || "", role: params.get("role") || "", tag: params.get("tag") || "", origin: params.get("origin") || "", open: null });
      FS.av = new Set(params.get("av") ? [params.get("av")] : AV);
    }
    syncFieldControls(); renderFieldRows();
  }
  if (name === "functions" && !rendered.has(name)) renderFunctions();
  if (name === "demo") {
    if (!rendered.has(name)) renderDemo();
    const rec = params.get("rec");
    if (rec && RID[rec]) { selectItem(rec, true); $("#d-detail").scrollIntoView({ block: "start" }); }
  }
  if (name === "downstream") {
    if (!rendered.has(name)) renderDownstream();
    const part = document.getElementById("ds-" + params.get("part"));
    if (part) part.scrollIntoView({ block: "start" });
  }
  if (name === "importers" && !rendered.has(name)) renderImporters();
  if (name === "records" && !rendered.has(name)) renderRecords();
  if (name === "vocab") renderVocab(params.get("q") || ($("#v-q") ? $("#v-q").value : ""));
  if (name === "rules") renderRules(params.get("amb"));
  rendered.add(name);
  if (qs === undefined) window.scrollTo(0, 0);
}
$("#repo-link").href = DATA.repo;
$("#foot").innerHTML = `Generated from release <b>${esc(C.version)}</b> of <span class="mono">${esc(C.name)}</span> and the checked-in examples by
  <span class="mono">scripts/make_site.py</span>. All example papers and data are synthetic.
  <a href="papers.html">Papers</a> · <a href="pipeline.html">Pipeline diagram</a> · <a href="${esc(DATA.repo)}">Source on GitHub</a>.`;
window.addEventListener("hashchange", route);
route();
</script>
</body>
