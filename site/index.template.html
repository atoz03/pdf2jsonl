<style>

<script id="site-data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("site-data").textContent);
const C = DATA.contract, D = DATA.demo;
const F = Object.fromEntries(C.fields.map(f => [f.path, f]));
const GROUPS = Object.keys(C.groups);
const AV = ["D", "N", "I", "G", "F"];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const av = a => `<span class="badge av-${a}" title="${esc(C.codes.availability[a].label_en)} · ${esc(C.codes.availability[a].label_zh)}">${a}</span>`;
const fieldLink = (p, label) => `<a class="mono" href="#fields?q=${encodeURIComponent(p)}" title="${esc(F[p] ? F[p].definition_zh : "")}">${esc(label || p)}</a>`;
const count = (arr, fn) => arr.reduce((n, x) => n + (fn(x) ? 1 : 0), 0);
const FN = C.codes.function || {}, ROLE = C.codes.key_role || {}, FAM = C.codes.key_role_family || {};
const ARG = C.codes.argument_role || {}, CARD = C.codes.card || {};
const FNS = Object.keys(FN);
const isAdded = (f, fn) => !(f.serves_src || []).includes(fn);
const fnTag = (f, fn) => `<span class="tag${isAdded(f, fn) ? "" : " acc"}" title="${esc((FN[fn] || {}).label_zh || fn)} — ${isAdded(f, fn) ? "added by the repository" : "stated by the source"}">${esc((FN[fn] || {}).short_zh || fn)}${isAdded(f, fn) ? "⁺" : ""}</span>`;
const roleTag = r => r ? `<a class="tag" href="#fields?role=${encodeURIComponent(r)}" title="${esc((ROLE[r] || {}).description_zh || "")}">${esc((ROLE[r] || {}).label_zh || r)}</a>` : "";
const facetsOf = (f, fn) => (((ROLE[f.key_role] || {}).facets || {})[fn] || []);
const facetLabel = (fn, k) => (((FN[fn] || {}).facets || {})[k] || {}).label_zh || k;

// ---------------------------------------------------------------- JSON view with field-name links
function jsonHTML(v, ind = "", parentKey = null, depth = 0) {
  const pad = ind + "  ";
  if (v === null) return '<span class="j-lit">null</span>';
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    if (v.every(x => typeof x !== "object" || x === null) && JSON.stringify(v).length < 80)
      return "[" + v.map(x => jsonHTML(x, pad)).join(", ") + "]";
    return "[\n" + v.map(x => pad + jsonHTML(x, pad, null, depth + 1)).join(",\n") + "\n" + ind + "]";
  }
  if (typeof v === "object") {
    const ks = Object.keys(v);
    if (!ks.length) return "{}";
    return "{\n" + ks.map(k => pad + keyHTML(k, parentKey, depth) + ": " + jsonHTML(v[k], pad, k, depth + 1)).join(",\n") + "\n" + ind + "}";
  }
  if (typeof v === "string") return '<span class="j-str">' + esc(JSON.stringify(v)) + "</span>";
  if (typeof v === "number") return '<span class="j-num">' + v + "</span>";
  return '<span class="j-lit">' + v + "</span>";
}
function keyHTML(k, parentKey, depth) {
  const path = F[k] ? k : (depth === 1 && GROUPS.includes(parentKey) && F[parentKey + "." + k]) ? parentKey + "." + k : null;
  const q = esc(JSON.stringify(k));
  return path ? `<a class="j-key" href="#fields?q=${encodeURIComponent(path)}" title="${esc(path + " — " + F[path].definition_zh)}">${q}</a>` : `<span class="j-key">${q}</span>`;
}

// ---------------------------------------------------------------- overview
function renderOverview() {
  const nV = count(C.fields, f => f.maturity === "verified");
  const nErr = count(C.rules, r => r.severity === "error");
  const latest = DATA.versions.find(v => v.latest) || {};
  const byGroup = GROUPS.map(g => {
    const fs = C.fields.filter(f => f.group === g);
    return `<tr><td class="mono"><a href="#fields?group=${g}">${g}</a></td><td>${esc(C.groups[g].title_zh)}</td>
      <td class="small">${esc(C.groups[g].purpose_zh)}</td><td class="num"><b>${fs.length}</b></td>
      ${AV.map(a => `<td class="num">${count(fs, f => f.availability === a) || '<span class="muted">·</span>'}</td>`).join("")}</tr>`;
  }).join("");
  const kinds = Object.entries(C.record_kinds).map(([k, v]) =>
    `<tr><td class="mono">${esc(k)}</td><td>${esc(v.label_zh || "")}</td><td class="mono small">${esc(v.grain || "—")}</td><td class="small">${esc(v.description_zh || "")}</td></tr>`).join("");
  const vers = DATA.versions.map(v => `<tr><td class="mono">${esc(v.version)} ${v.latest ? '<span class="tag acc">latest</span>' : ""}</td>
    <td>${esc(v.released_on)}</td><td class="num">${v.fields}</td><td class="num">${v.rules}</td><td class="num">${v.vocabularies}</td>
    <td class="small mono">${esc(v.profiles.join(", "))}</td></tr>`).join("");
  $("#view-overview").innerHTML = `
    <h2>${esc(C.title_zh)} <span class="muted">· ${esc(C.name)}</span></h2>
    <p class="lead">The repository owns the data contract; the <b>pdf2jsonl</b> Skill is the operational entry point.
      One canonical field catalog generates the JSON Schema, profiles, dictionaries and validation, and the extraction
      pipeline resolves the contract version at run time. ${esc(C.baseline_zh || "")}</p>
    <div class="tiles">
      <div class="tile"><div class="k">Fields</div><div class="v">${C.fields.length}</div><div class="s">${nV} verified · ${C.fields.length - nV} provisional</div></div>
      <div class="tile"><div class="k">Field groups</div><div class="v">${GROUPS.length}</div><div class="s">${GROUPS.join(" · ")}</div></div>
      <div class="tile"><div class="k">Record kinds</div><div class="v">${Object.keys(C.record_kinds).length}</div><div class="s">one fact per JSONL line</div></div>
      <div class="tile"><div class="k">Vocabularies</div><div class="v">${C.vocabularies.length}</div><div class="s">plus a unit-conversion table</div></div>
      <div class="tile"><div class="k">Cross-field rules</div><div class="v">${C.rules.length}</div><div class="s">${nErr} error · ${C.rules.length - nErr} warning</div></div>
      <div class="tile"><div class="k">Releases</div><div class="v">${DATA.versions.length}</div><div class="s">latest ${esc(latest.version || "")}</div></div>
      <div class="tile"><div class="k">Key roles</div><div class="v">${Object.keys(ROLE).length}</div><div class="s"><a href="#functions">every key states its role and function</a></div></div>
    </div>
    <h3>What the records are for</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Function</th><th>What it needs from a record</th><th class="num">Fields</th><th class="num">stated by source</th></tr></thead><tbody>
      ${FNS.map(fn => { const fs = C.fields.filter(f => (f.serves || []).includes(fn));
        return `<tr><td><a href="#fields?fn=${encodeURIComponent(fn)}">${esc(FN[fn].label_zh)}</a></td><td class="small">${esc(FN[fn].description_zh || "")}</td>
          <td class="num">${fs.length}</td><td class="num">${count(fs, f => !isAdded(f, fn))}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="small muted">Details, the role of every key and the evidence-chain elements: <a href="#functions">Functions &amp; roles →</a></p>
    <h3>Availability codes — what each field's value is, not how good it is</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Meaning</th><th>中文</th><th>Who fills it in the PDF pipeline</th><th class="num">Fields</th></tr></thead><tbody>
      ${AV.map(a => `<tr><td>${av(a)}</td><td>${esc(C.codes.availability[a].label_en)}</td><td>${esc(C.codes.availability[a].label_zh)}</td>
        <td class="small">${{D: "the extraction model, with a verbatim quote", N: "the pipeline, by named deterministic rules", I: "a human reviewer — never exposed to the model", G: "later processing (only confidence, if the backend reports it)", F: "future external sources — never fabricated"}[a]}</td>
        <td class="num"><a href="#fields?av=${a}">${count(C.fields, f => f.availability === a)}</a></td></tr>`).join("")}
    </tbody></table></div>
    <p class="small muted">${esc(C.codes.availability_note_zh || "")} Requirement codes: <b>Y</b> required · <b>C</b> conditional · <b>N</b> optional. Missing information is omitted — never <code>null</code> or an empty value.</p>
    <h3>Field groups</h3>

            ${it.v.warnings && it.v.warnings.length ? `<span class="tag warn">${it.v.warnings.length} warning${it.v.warnings.length > 1 ? "s" : ""}</span>` : ""}
            ${linksOf(it.rec).length ? `<span class="tag" title="links to other records">→ ${linksOf(it.rec).reduce((n, l) => n + l.ids.length, 0)}</span>` : ""}
            ${it.rec.common.source_page ? `<span class="muted small">p.${esc(it.rec.common.source_page)}</span>` : ""}</div>
            <div class="sum">${esc(summary(it.rec))}</div><div class="meta">${esc(it.id)}</div></button>` : `
          <button class="item" data-id="${esc(it.id)}"><div class="row1"><span class="tag err">rejected</span><span class="tag">${esc(it.err.stage)}</span><span class="mono small">${esc(it.err.code)}</span></div>
            <div class="sum">${esc((it.err.candidate && it.err.candidate.fields && Object.values(it.err.candidate.fields)[0]) || it.err.message)}</div>
            <div class="meta">candidate #${esc(it.err.candidate_index)} · ${esc(it.err.message)}</div></button>`).join("")}</div>
      </div>
    </div>
    <div id="d-detail" style="margin-top:16px"></div>
    ${chainSection()}
    ${derivedSection()}
    <h3>Repair log</h3>
    <p class="small muted">Structural repairs only: formatting, types, vocabulary labels and pipeline-owned fields. Content is never invented; an unverifiable quote is rejected, not repaired.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Where</th><th>Action</th><th>Field</th><th>From</th><th>To</th></tr></thead><tbody>
      ${V.repairs.map(r => `<tr><td class="mono small">${esc(r.where)}</td><td>${esc(r.action)}${r.reason ? ` <span class="muted small">(${esc(r.reason)})</span>` : ""}</td>
        <td>${r.key ? (F[r.key] ? fieldLink(r.key) : `<span class="mono">${esc(r.key)}</span>`) : ""}</td>
        <td class="mono small">${r.from !== undefined ? esc(JSON.stringify(r.from)) : ""}</td><td class="mono small">${r.to !== undefined ? esc(JSON.stringify(r.to)) : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <details><summary>Extraction brief the agent received (rendered from the resolved profile, not hand-written)</summary>
      <div class="card"><pre class="brief">${esc(D.brief)}</pre></div></details>
    <details><summary>Run manifest (excerpt)</summary><div class="card"><pre class="json">${jsonHTML(D.manifest)}</pre></div></details>`;
  renderPages();
  $("#d-items").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) selectItem(b.dataset.id, false); });
  $("#d-pages").addEventListener("click", e => { const m = e.target.closest("mark"); if (m) selectItem(m.dataset.ids.split(" ")[0], true); });
  $("#view-demo").addEventListener("click", e => {
    const b = e.target.closest(".linkto"); if (b) { selectItem(b.dataset.sel, true); $("#d-detail").scrollIntoView({ block: "start", behavior: "smooth" }); return; }
    const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump).scrollIntoView({ block: "start", behavior: "smooth" }); }
  });
  selectItem(D.records.find(r => r.common.record_kind === "claim").common.record_id, false);
}
function chainSection() {
  if (!AS) return "";
  const cov = Object.keys(ARG).map(e => `<tr><td>${esc((ARG[e] || {}).label_en || e)} <span class="muted small">${esc((ARG[e] || {}).label_zh || "")}</span></td>
    <td class="num">${AS.coverage[e] ? AS.coverage[e].own : 0}</td><td class="num">${AS.coverage[e] ? AS.coverage[e].chain : 0}</td></tr>`).join("");
  const rows = AS.records.map(r => `<tr><td>${recBtn(r.record_id)}</td><td>${elTags(r)}</td>
    <td class="small">${Object.entries(r.links || {}).map(([p, ids]) => `${fieldLink(p, p.split(".")[1])}: ${ids.length}`).join("<br>") || '<span class="muted">—</span>'}</td>
    <td>${flagTags(r) || '<span class="muted small">—</span>'}</td></tr>`).join("");
  return `<h3 id="d-chain">Evidence chain (after TRACE)</h3>
    <p class="small muted">From the validation report's <code>argument_structure</code>. Every record that asserts something is listed with the Toulmin/Flavell
      elements it states <span class="el own">solid</span> and those it reaches through its links <span class="el chain">dashed</span>, e.g. a claim → the LOD result → the
      mapping method. Links were written by the agent as <code>ref</code> / <code>links</code> and resolved to record IDs by the pipeline. A link to the fabricated
      candidate was dropped and flagged. Flags are review hints. ${esc(AS.basis)}.</p>
    <div class="grid21">
      <div class="tbl-wrap"><table><thead><tr><th>Statement</th><th>Elements</th><th>Links</th><th>Flags</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tbl-wrap"><table><thead><tr><th>Element</th><th class="num">stated</th><th class="num">in chain</th></tr></thead><tbody>${cov}</tbody></table></div>
    </div>`;
}
function derivedSection() {
  const X = D.derived;
  if (!X) return "";
  const c = X.counts;
  const node = v => { v = String(v); return v.startsWith("rec:") && RID[v.slice(4)] ? `<span title="${esc(v)}">${recBtn(v.slice(4))}</span>` : `<span class="mono small">${esc(v)}</span>`; };
  const trip = t => `<tr><td>${node(t.s)}</td><td class="mono small">${esc(t.p)}</td><td>${node(t.o)}</td><td class="small">${esc(t.o_kind)}</td></tr>`;
  return `<h3>Derived views (function 3: <code>bdc derive</code>)</h3>
    <p class="small muted">The same records turned into relational tables, knowledge-graph triples and an evidence corpus. Each field lands where its key role says
      (<a href="#functions">roles →</a>). Nothing is added that the records do not contain. A statement without a reviewed predicate stays <code>bdc:unlabelled_relation</code>.</p>
    <div class="tiles">
      ${["records", "sources", "record_entities", "record_links", "record_values"].map(t => `<div class="tile"><div class="k">table ${esc(t)}</div><div class="v">${c["table:" + t] || 0}</div><div class="s">rows (CSV)</div></div>`).join("")}
      <div class="tile"><div class="k">triples</div><div class="v">${c.triples}</div><div class="s">JSONL with record provenance</div></div>
      <div class="tile"><div class="k">corpus chunks</div><div class="v">${c.corpus_chunks}</div><div class="s">one per distinct quote</div></div>
    </div>
    <div>
      <div><h3 style="margin-top:8px">record_links</h3><div class="tbl-wrap"><table><thead><tr><th>From</th><th>Field</th><th>To</th><th>Element</th></tr></thead><tbody>
        ${X.record_links.map(l => `<tr><td>${recBtn(l.record_id)}</td><td>${fieldLink(l.field, l.field.split(".")[1])}</td><td>${recBtn(l.target_record_id)}</td><td class="small">${esc(l.argument_role || "")}</td></tr>`).join("")}
      </tbody></table></div></div>
      <div><h3>Triples: relation statement and one edge per predicate (sample)</h3><div class="tbl-wrap"><table><thead><tr><th>Subject</th><th>Predicate</th><th>Object</th><th>Kind</th></tr></thead><tbody>
        ${X.statements.map(trip).join("")}${X.entity_triples.map(trip).join("")}
      </tbody></table></div></div>
    </div>
    <details><summary>Corpus chunks (sample)</summary><div class="card"><pre class="json">${jsonHTML(X.corpus)}</pre></div></details>`;
}
function renderPages() {
  const spans = D.records.map(r => ({ id: r.common.record_id, s: spanOf(r) })).filter(x => x.s);
  $("#d-pages").innerHTML = D.pages.map((text, i) => {
    const pg = i + 1, mine = spans.filter(x => x.s.page === pg);
    const cuts = [...new Set([0, text.length, ...mine.flatMap(x => [x.s.a, x.s.b])])].filter(n => n >= 0 && n <= text.length).sort((a, b) => a - b);
    let html = "";
    for (let k = 0; k < cuts.length - 1; k++) {
      const [a, b] = [cuts[k], cuts[k + 1]], seg = esc(text.slice(a, b));
      const ids = mine.filter(x => x.s.a <= a && x.s.b >= b).map(x => x.id);
      html += ids.length ? `<mark data-ids="${ids.join(" ")}">${seg}</mark>` : seg;
    }
    return `<div class="page" id="page-${pg}"><div class="ph">Page ${pg}</div><pre>${html}</pre></div>`;
  }).join("");
}
function selectItem(id, fromText) {
  DS.sel = id;
  document.querySelectorAll("#d-items .item").forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  document.querySelectorAll("#d-pages mark").forEach(m => m.classList.toggle("sel", m.dataset.ids.split(" ").includes(id)));
  const it = items().find(x => x.id === id);
  const btn = document.querySelector(`#d-items .item[data-id="${id}"]`);
  if (fromText && btn) btn.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (!fromText) { const m = document.querySelector("#d-pages mark.sel"); if (m) m.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  const box = $("#d-detail");
  if (it.type === "record") {
    const ci = it.v.candidate_index;
    const cand = ci != null ? D.candidates.candidates[ci] : null;
    const warns = (it.v.warnings || []).map(w => `<li><span class="mono small">${esc(w.code)}</span> ${w.path && F[w.path] ? fieldLink(w.path) : ""} — ${esc(w.message)}</li>`).join("");
    const lk = linksOf(it.rec), by = linkedBy(id), ar = AREC[id];
    const chain = lk.length || by.length || ar ? `<div class="small" style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px"><b>Evidence chain</b>
      ${ar ? `<div style="margin-top:4px">${elTags(ar)} ${flagTags(ar)}</div>` : ""}
      ${lk.map(l => `<div>${esc(l.name)} → ${l.ids.map(recBtn).join(" · ")}</div>`).join("")}
      ${by.map(b => `<div>used as ${esc(b.via)} by ← ${recBtn(b.id)}</div>`).join("")}</div>` : "";
    box.innerHTML = `<div class="card pad" style="margin-bottom:12px"><div class="row1" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="tag acc">${esc(it.rec.common.record_kind)}</span>${reviewTag(it.rec.common.review_status)}<span class="mono small">${esc(id)}</span>
        <span class="muted small">locator: <span class="mono">${esc(it.rec.common.source_locator)}</span></span></div>
        ${warns ? `<ul class="issues small">${warns}</ul>` : `<div class="small muted" style="margin-top:6px">No warnings: the quote was found on the stated page and every value appears in it.</div>`}${chain}</div>
      <div class="grid2">
        <div class="card"><div class="panel-h"><span>Candidate — written by the agent</span><span class="muted small">${cand ? "candidates[" + ci + "]" : "system record"}</span></div>
          <pre class="json">${cand ? jsonHTML(cand) : '<span class="muted">No candidate: the pipeline creates this record for the input PDF itself (profile system record).</span>'}</pre></div>
        <div class="card"><div class="panel-h"><span>Record — assembled and validated by the pipeline</span><span class="muted small">line ${esc(it.v.line || "?")} of .jsonl</span></div>
          <pre class="json">${jsonHTML(it.rec)}</pre></div>
      </div>`;
  } else {
    const e = it.err;
    const why = {
      EVIDENCE_QUOTE_NOT_FOUND: "The quote does not occur on the stated page or on the pages next to it, so the statement cannot be grounded in the paper.",
      EVIDENCE_MISSING: "The candidate gives no page or no verbatim quote, so it cannot be grounded in the paper.",
      RECORD_INVALID: "The assembled record does not satisfy the contract; the issues say which field and rule.",
    }[e.code] || `The candidate failed at the ${e.stage} stage.`;
    const lostLinks = D.records.flatMap(r => ((VREC[r.common.record_id] || {}).warnings || []).filter(w => w.code === "CANDIDATE_LINK_UNRESOLVED")
      .filter(w => e.candidate && w.detail && w.detail.ref === e.candidate.ref).map(() => r.common.record_id));
    box.innerHTML = `<div class="card pad" style="margin-bottom:12px"><span class="tag err">rejected</span> <span class="mono">${esc(e.code)}</span> — ${esc(e.message)}
        <div class="small muted" style="margin-top:6px">Written to <code>.errors.jsonl</code>, never to the records file. ${esc(why)}</div>
        ${lostLinks.length ? `<div class="small" style="margin-top:6px">Links to this candidate were dropped, not guessed; the linking record is flagged for review: ${lostLinks.map(recBtn).join(" · ")}</div>` : ""}</div>
      <div class="card"><div class="panel-h"><span>Rejected error record</span><span class="muted small">stage: ${esc(e.stage)}</span></div><pre class="json">${jsonHTML(e)}</pre></div>`;
  }
}

// ---------------------------------------------------------------- record gallery
function renderRecords() {
  const html = DATA.gallery.map(g => {
    const r = g.record, rows = [];
    for (const grp of Object.keys(r)) for (const [k, v] of Object.entries(r[grp])) rows.push([grp + "." + k, v]);
    return `<div class="card"><div class="pad" style="padding-bottom:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <h4 class="mono">${esc(r.common.record_kind)}</h4><span class="muted">${esc((C.record_kinds[r.common.record_kind] || {}).label_zh || "")}</span>
        <span class="spacer" style="flex:1"></span><span class="tag">${esc(g.source)}</span></div>
        <div class="small" style="margin-top:4px">${esc(summary(r))}</div><div class="small muted mono">${esc(g.file)}</div></div>
      <div style="max-height:360px;overflow:auto;border-top:1px solid var(--border)"><table class="ftable"><tbody>
        ${rows.map(([p, v]) => `<tr><td>${F[p] ? `${av(F[p].availability)} ` + fieldLink(p) : esc(p)}</td><td>${esc(typeof v === "string" ? v : JSON.stringify(v))}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("");
  $("#view-records").innerHTML = `<h2>Record examples</h2>
    <p class="lead">One valid record per kind and origin: curated examples, pdf2jsonl output, legacy v1 migration and omics v2 migration. Every record
      carries <code>schema_name</code> + <code>schema_version</code>, a stable <code>record_id</code> and provenance, and omits missing values. Field names link to the catalog.</p>
    <div class="gal">${html}</div>`;
}

// ---------------------------------------------------------------- vocabularies
function renderVocab(q = "") {
  if (!$("#v-q")) {
    $("#view-vocab").innerHTML = `<h2>Controlled vocabularies</h2>
      <p class="lead"><b>error</b> vocabularies are enforced by the schema. <b>warning</b> vocabularies report unknown codes. <b>open</b> vocabularies only suggest codes.
        Codes proposed by the repository for Chinese-only source lists are warning-level until confirmed.</p>
      <div class="controls"><input type="search" id="v-q" placeholder="Search vocabulary, code or label…" aria-label="Search vocabularies"></div><div class="vgrid" id="v-grid"></div>`;
    $("#v-q").addEventListener("input", e => renderVocab(e.target.value));
  }
  $("#v-q").value = q;
  const s = q.trim().toLowerCase();
  const used = v => C.fields.filter(f => f.vocabulary === v.name).map(f => fieldLink(f.path)).join(" ");
  $("#v-grid").innerHTML = C.vocabularies.filter(v => !s || JSON.stringify(v).toLowerCase().includes(s)).map(v => `
    <div class="card pad"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b class="mono">${esc(v.name)}</b><span class="muted">${esc(v.title_zh || "")}</span></div>
      <div style="margin:6px 0;display:flex;gap:6px;flex-wrap:wrap"><span class="tag ${v.enforcement === "error" ? "err" : v.enforcement === "warning" ? "warn" : ""}">${esc(v.enforcement)}</span>
        <span class="tag">${esc(v.closure)}</span><span class="tag">${esc(v.code_status)}</span></div>
      <div class="small" style="margin-bottom:6px">${used(v) || '<span class="muted">not bound to a field</span>'}</div>
      <table class="ftable"><tbody>${v.values.map(x => `<tr><td>${esc(x.code)}</td><td style="font-family:inherit">${esc(x.label_zh || "")}${x.aliases ? ` <span class="muted small">(${esc(x.aliases.join(", "))})</span>` : ""}</td></tr>`).join("")}</tbody></table></div>`).join("")
    || '<p class="muted">No vocabulary matches.</p>';
}

// ---------------------------------------------------------------- rules & ambiguities
function renderRules(amb) {
  $("#view-rules").innerHTML = `<h2>Cross-field rules</h2>
    <p class="lead">Rules taken from explicit source statements are <b>errors</b>. Anything only implied by the sources is a <b>warning</b>: the contract never enforces inferred semantics.</p>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Severity</th><th>Basis</th><th>Kind</th><th>Rule (规则)</th><th>Fields</th></tr></thead><tbody>
      ${C.rules.map(r => `<tr><td class="mono">${esc(r.id)}</td><td><span class="tag ${r.severity === "error" ? "err" : "warn"}">${esc(r.severity)}</span></td><td class="small">${esc(r.basis)}</td>
        <td class="mono small">${esc(r.kind)}</td><td>${esc(r.title_zh)}</td><td class="small">${r.fields.map(p => p === "*" ? "<i>all fields</i>" : fieldLink(p)).join(" ")}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>Ambiguity register</h3>
    <p class="small muted">Where the sources are silent or disagree, the decision is recorded here instead of being made silently. <b>open</b> and <b>provisional</b> items await the data owners.</p>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Status</th><th>Question (问题)</th><th>Finding</th><th>Resolution</th></tr></thead><tbody>
      ${C.ambiguities.map(a => `<tr id="amb-${esc(a.id)}" ${a.id === amb ? 'style="outline:2px solid var(--accent)"' : ""}><td class="mono">${esc(a.id)}</td>
        <td><span class="tag ${a.status === "decided" ? "ok" : a.status === "open" ? "warn" : ""}">${esc(a.status)}</span></td>
        <td>${esc(a.title_zh)}</td><td class="small">${esc(a.finding_zh || "")}</td><td class="small">${esc(a.resolution_zh || "")}</td></tr>`).join("")}
    </tbody></table></div>`;
  if (amb) { const tr = document.getElementById("amb-" + amb); if (tr) tr.scrollIntoView({ block: "center" }); }
}

// ---------------------------------------------------------------- routing
const rendered = new Set();
function route() {
  const [view, qs] = (location.hash.slice(1) || "overview").split("?");
  const name = document.getElementById("view-" + view) ? view : "overview";
  const params = new URLSearchParams(qs || "");
  document.querySelectorAll("section.view").forEach(s => s.hidden = s.id !== "view-" + name);
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("active", a.dataset.view === name));
  if (name === "overview" && !rendered.has(name)) renderOverview();
  if (name === "fields") {
    if (!rendered.has(name)) renderFieldsShell();
    if (qs !== undefined) {
      Object.assign(FS, { q: params.get("q") || "", group: params.get("group") || "", profile: "", maturity: "", since: "", req: "",
        fn: params.get("fn") || "", role: params.get("role") || "", open: null });
      FS.av = new Set(params.get("av") ? [params.get("av")] : AV);
    }
    syncFieldControls(); renderFieldRows();
  }
  if (name === "functions" && !rendered.has(name)) renderFunctions();
  if (name === "demo" && !rendered.has(name)) renderDemo();
  if (name === "records" && !rendered.has(name)) renderRecords();
  if (name === "vocab") renderVocab(params.get("q") || ($("#v-q") ? $("#v-q").value : ""));
  if (name === "rules") renderRules(params.get("amb"));
  rendered.add(name);
  if (qs === undefined) window.scrollTo(0, 0);
}
$("#repo-link").href = DATA.repo;
$("#foot").innerHTML = `Generated from release <b>${esc(C.version)}</b> of <span class="mono">${esc(C.name)}</span> and the checked-in examples by
  <span class="mono">scripts/make_site.py</span>. All example papers and data are synthetic. <a href="${esc(DATA.repo)}">Source on GitHub</a>.`;
window.addEventListener("hashchange", route);
route();
</script>
