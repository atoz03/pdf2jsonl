notes_zh: '代码由仓库拟定（AMB-047）。由 common.source_document_type 派生：review → review_report，其余（期刊论文、学位论文等）→ primary_study。review_report 表示这句话是综述对他人研究的转述，不是该文献自己完成的实验；原始文献线索写在 agent.reported_citation_text（逐字），没有线索时 R040 提示补。本字段只记录文献类型，不判断转述是否忠实。'
ambiguities: [AMB-047]
