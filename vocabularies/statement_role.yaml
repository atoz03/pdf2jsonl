values:
- code: background
  label_zh: 研究背景与已有知识
  description_zh: 论文引述的已有知识或研究现状
- code: research_question
  label_zh: 科学问题
  description_zh: 论文明确提出的待回答问题或尚不清楚之处
- code: objective
  label_zh: 研究目标
  description_zh: 作者陈述的本研究或某项实验的目标
- code: hypothesis
  label_zh: 科学假设
  description_zh: 作者明确提出的假设或推测（如 we hypothesized、might）
- code: design
  label_zh: 实验设计
  description_zh: 为检验假设或达到目标所作的实验安排
- code: result
  label_zh: 结果
  description_zh: 作者报告的实验或分析结果
- code: conclusion
  label_zh: 结论
  description_zh: 作者由结果得出的结论或解释
