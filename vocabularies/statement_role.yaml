since: 3.5.0
origin: [repository]
source:
  ref: docs/workflow.md
  quote_zh: 研究背景与已有知识、科学问题与研究目标、科学假设、实验设计、方法与工具、观测、结论（课题二提出的论文内研究流程）
notes_zh: 代码由仓库拟定（AMB-039）。方法步骤与观测由记录类型（method、observation 等）表示，不在本词表中；角色按原文的表述方式判定，不由抽取者推断。
