# Controlled vocabulary — part of the data contract; edits require a release (see docs/versioning.md).
vocabulary_format: 1
name: predicate_label
title_zh: 关系谓词
enforcement: open
closure: open
code_status: legacy
since: 3.1.0
origin: [legacy_v1]
source:
  ref: sources/legacy_v1/breeding_jsonl_spec.md#L429
  quote_zh: A-5 relation_type（本体关系，可扩展）
notes_zh: 'A-5 仅三项给出英文代码，其余代码由仓库拟定（code_status: proposed）。关联关系不得标为控制关系。cues 为谓词原文中的线索词，subject_types / object_types 为主宾语的实体类型（由实体提及字段名确定，缺省表示不限）；三者仅用于由 predicate_mention 确定性生成 predicate_code，均为仓库拟定（AMB-038）。nature 为关系**本身**的语义性质（causal / associational / structural / descriptive / unknown），与证据强弱无关，由契约编译期映射为 transform.relation_nature 并供 R036/R037 比较，为仓库拟定（AMB-042）。'
ambiguities: [AMB-038, AMB-042]
