  cues: [associated with, association with, associated to, 关联, 相关]
  subject_types: [qtn]
  object_types: [trait]
  nature: associational
  description_zh: GWAS 定位到的 QTN（显著位点/单核苷酸位点）与性状的关联（3.8.0，AMB-045）：QTN 与 QTL（连锁定位区间）、候选基因（gene）是三种实体，代码不互相替代。
