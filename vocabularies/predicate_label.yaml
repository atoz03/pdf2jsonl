  object_types: [trait]
  nature: associational
  description_zh: 统计相关（3.7.0，AMB-043）：只断言共变或显著相关，不含机制；与 trait_correlated_with_trait 的区别只在主语的实体类型，主语未登记为实体时两者打平并记为 ambiguous。
