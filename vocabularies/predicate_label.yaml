- code: gene_suppresses_gene
  label_zh: 基因-抑制-基因
  code_status: proposed
  cues: [suppresses, suppress, suppressed, suppressing, represses, repress, repressed, repressing, 抑制]
  subject_types: [gene, marker_genes]
  object_types: [gene, marker_genes]
  nature: causal
  description_zh: 主动语态的抑制/阻遏（3.8.0，AMB-046）：主语是抑制者。被动形式"was suppressed by"属 gene_suppressed_by_gene，不能套用本代码的方向。
- code: gene_suppressed_by_gene
  label_zh: 基因-受抑制-基因
  code_status: proposed
  cues: [suppressed by, repressed by]
