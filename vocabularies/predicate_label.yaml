# Controlled vocabulary — part of the data contract; edits require a release (see docs/versioning.md).
vocabulary_format: 1
name: predicate_label
title_zh: 关系谓词
enforcement: open
closure: open
code_status: legacy
since: 3.1.0
origin: [legacy_v1]
source:
  ref: sources/legacy_v1/breeding_jsonl_spec.md#L429
  quote_zh: A-5 relation_type（本体关系，可扩展）
notes_zh: 'A-5 仅三项给出英文代码，其余代码由仓库拟定（code_status: proposed）。关联关系不得标为控制关系。cues 为谓词原文中的线索词，subject_types / object_types 为主宾语的实体类型（由实体提及字段名确定，缺省表示不限）；三者仅用于由 predicate_mention 确定性生成 predicate_code，均为仓库拟定（AMB-038）。nature 为关系**本身**的语义性质（causal / associational / structural / descriptive / unknown），与证据强弱无关，由契约编译期映射为 transform.relation_nature 并供 R036/R037 比较，为仓库拟定（AMB-042）。3.7.0 起（AMB-043）：线索词须覆盖第三人称、过去式与被动式（词表不自动变位）；两个代码不得只靠类型区分而共用同一组线索词，否则未登记为实体的提及会让两者打平——打平由 transform.relation_resolution 记为 ambiguous；弃用代码保留 nature 以便旧记录继续派生性质，但不再给出线索词，因此不会被新抽取命中。3.8.0 起（AMB-046）：主动与被动态分属不同代码（gene_suppresses_gene / gene_suppressed_by_gene、genotype_controls_trait / trait_controlled_by_gene），只有明确方向性的措辞才收；nature 只是谓词的断言口气，能否算因果要看 transform.claim_strength 与 R038。'
ambiguities: [AMB-038, AMB-042, AMB-043, AMB-046]
values:
- code: genotype_controls_trait
  label_zh: 基因-控制-性状
  cues: [controls, controlled, 控制]
  subject_types: [gene]
  object_types: [trait]
  nature: causal
- code: gene_associated_with_trait
