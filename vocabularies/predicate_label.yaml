  object_types: [gene, marker_genes]
  nature: causal
  description_zh: 被动语态：主语是被抑制的基因，宾语是抑制者（3.8.0，AMB-046）。
- code: gene_upstream_of_gene
  label_zh: 基因-上游于-基因
