  ref: docs/relation_semantics.md
  quote_zh: 抽取阶段须明确区分知识间的因果关系与相关性；只有因果关系才能直接指导实验
notes_zh: '代码由仓库拟定。性质描述关系**本身**断言了什么，与证据强弱无关：关联谓词可以在功能验证级别上仍然只是相关，因果谓词也可能只有统计证据。判定依据是 predicate_label 词表的值属性 nature，由契约编译期映射得到（contract["relation_natures"]），不由抽取模型判断。'
