# Mapping — omics template leaves to contract fields. Checked by `bdc check` (coverage, targets, origins).
mapping_format: 1
id: omics_to_current
title_zh: 多组学候选模板 2.0.0 → 当前契约
source:
  id: omics_v2
  title_zh: Breeding Multi-omics AI-ready Schema（候选字段模板）
  version: 2.0.0
  leaf_source: template_groups
  file: sources/omics_v2/omics_metadata_template.json
target:
  contract: breeding-literature-record
  min_version: 3.1.0
principles_zh:
- 模板只有字段名，所有由 omics_v2 新增的契约字段均为 provisional（AMB-026）。
- 模板中的 null 一律省略，不写入记录（OMX-008）。
- 单一测量值映射到 v3 单值观测字段 measurement_*（AMB-031）。
- 关系类字段以 claim 记录的 transform 主谓宾表示，不新增关系记录类型（AMB-012）。
- partial 映射仅迁移满足目标字段定义的值，其余进入残留报告。
routing:
- source: statistical_results.**
  record_kind: analysis_result
  note_zh: 单个统计检验结果
- source: cross_omics_relation.**
  record_kind: claim
  note_zh: 关系以主谓宾字段承载
- source: unified_feature.**
  record_kind: observation
  note_zh: 单一特征值；表型值使用 phenotype_observation
- source: data_files.**
  record_kind: asset_manifest
  note_zh: 数据文件本身
