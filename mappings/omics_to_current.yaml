issues:
- id: OMX-001
  title_zh: 模板字段无定义
  finding_zh: 模板仅给出字段名；partial 映射依据字段名推断语义，存在口径风险。
  resolution_zh: partial 映射只在值满足目标字段定义时迁移，其余进入残留报告；见 AMB-026。
- id: OMX-002
  title_zh: record_type 与 record_kind
  finding_zh: 模板 record_type 无取值表，无法与 v3 记录类型一一对应。
  resolution_zh: 只迁移与 record_kind 词表代码完全一致的值；其他值拒绝迁移并报告。
- id: OMX-003
  title_zh: 登录号来源重叠
  finding_zh: basic_identity.data_accession 与 data_files.raw_data_accession 都表示数据登录号；v3 另有 F 类 sequence_accessions。
  resolution_zh: 两者合并到 common.data_accessions（D，论文报告值）；与 sequence_accessions 的关系见 AMB-027。
- id: OMX-004
  title_zh: 原文字段与规范字段并存
  finding_zh: treatment_name、relation_direction 与 v3 合并原文字段或规范码字段口径不同。
  resolution_zh: 原文值写入原文字段，规范码只在完全匹配词表时写入；见 AMB-027。
- id: OMX-005
  title_zh: 环境数值未结构化
  finding_zh: temperature、precipitation 等在 v3 中没有独立数值字段。
  resolution_zh: '以“名称: 原文值”形式写入 environmental_conditions；需要数值时使用 environment_observation 记录的 measurement_*。'
- id: OMX-006
  title_zh: 数据文件属性仅适用于资产记录
  finding_zh: 格式与校验和描述的是数据文件，而不是论文结论。
  resolution_zh: 仅在生成 asset_manifest 记录时迁移。
- id: OMX-007
  title_zh: 关系谓词需按词表映射
  finding_zh: 模板关系名称自由书写，可能把关联写成因果。
  resolution_zh: 按 predicate_label 词表映射；无法确定时保留原文于残留，不升级为控制关系。
- id: OMX-008
  title_zh: null 缺失值约定冲突
  finding_zh: 模板用 null 表示未填与不适用；契约规定缺失字段一律省略。
  resolution_zh: 迁移时删除 null 值；若模板说明了缺失原因则写入 common.missing_fields。
- id: OMX-009
  title_zh: QTL 区间单位未说明
  finding_zh: qtl_start/qtl_end 未说明是 bp 还是 cM。
  resolution_zh: 迁移时必须显式指定单位；未指定则不迁移。
- id: OMX-010
  title_zh: 模板内部重复字段
  finding_zh: cell_type、cell_state 在两个分组中重复出现；batch 与 sample.batch_id 重复。
  resolution_zh: 合并为同一契约字段；两处同时有值且不同时报告冲突。
