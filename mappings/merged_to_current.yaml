# Source mappings; executable transfers and retained source data are distinguished below.
mapping_format: 1
id: merged_to_current
title_zh: merged v2 文档与单位行 → 当前原子契约
source:
  id: merged_v2
  version: v2.0.0
  leaf_source: json_schema
  file: sources/merged_v2/breeding_jsonl_schema_v2.json
target:
  contract: breeding-literature-record
  min_version: 3.3.0
principles_zh:
- 保留当前原子记录格式，merged 作为输入来源，不覆盖已有定义。
- 继承 legacy 事实迁移，新增观测、资产及显式引用的样本/测定上下文。
- 每个非空源叶子均可在已消费路径、拒绝记录或残留中追踪。
entries:
- source: record_id
  status: mapped
  target: common.source_record_id
  scope: document
  note_zh: legacy 文档记录 ID 作为来源对象 ID 保留；新记录 ID 按仓库约定重算
- source: schema_version
  status: control
  note_zh: 必须为 v2.0.0；输出版本由当前契约确定。
- source: record_info.doc_type
  status: mapped
  target: common.source_document_type
  scope: document
- source: record_info.lang
  status: mapped
  target: common.source_language
  scope: document
  note_zh: zh/en/zh_en 原样保留
- source: record_info.created_at
  status: unmapped
  note_zh: 旧管线运行时间，写入迁移报告
- source: record_info.updated_at
  status: unmapped
  note_zh: 旧管线运行时间，写入迁移报告
- source: doc_meta.title
  status: mapped
  target: common.source_title
  scope: document
- source: doc_meta.title_zh
  status: unmapped
  note_zh: 译名不是原文证据
  issues:
  - LEG-010
- source: doc_meta.title_en
  status: unmapped
  note_zh: 译名不是原文证据
  issues:
  - LEG-010
- source: doc_meta.authors[].**
  status: unmapped
  note_zh: ORCID、机构 ID、通信作者标记无对应字段
- source: doc_meta.authors[].name
  status: transformed
  target: common.source_authors
  scope: document
  note_zh: 按 rank 排序后组成作者姓名数组
  transform: compose
- source: doc_meta.authors[].rank
  status: transformed
  target: common.source_authors
  scope: document
  note_zh: 仅用于作者排序
  transform: compose
- source: doc_meta.authors[].affiliation_name
  status: mapped
  target: common.source_affiliations
  scope: document
  note_zh: 去重后并入机构名称数组
- source: doc_meta.affiliations
  status: mapped
  target: common.source_affiliations
  scope: document
  note_zh: 仅保留机构名称；地址、国家、机构 ID 不迁移
- source: doc_meta.journal
  status: mapped
  target: common.source_journal
  scope: document
- source: doc_meta.journal_meta.**
  status: unmapped
  note_zh: 期刊分级（SCI 分区、中科院分区等）属外部评价而非论文内容，不作为可信度先验写入记录
