issues:
- id: LEG-001
  title_zh: agent/skill 同名不同义
  finding_zh: legacy agent/skill 块记录智能体与技能的运行状态；v3 agent/skills 组为论文派生字段。
  resolution_zh: 运行状态不迁移；仅极少数可证实来自论文的内容以 partial 迁移。
- id: LEG-002
  title_zh: 出版物页码与物理页码
  finding_zh: legacy 页码为期刊页码（示例 2221–2235），v3 source_page 为 PDF 物理页码。
  resolution_zh: 迁移证据需 --page-offset（物理页 = 期刊页 − 偏移）；未提供时不填 source_page，该证据记录因 R001 被拒绝并进入错误文件（AMB-029）。
- id: LEG-003
  title_zh: 本机路径
  finding_zh: doc_meta.pdf_path 保存本机相对路径。
  resolution_zh: 禁止迁移（R020）；PDF 身份用 source_file_sha256，文件名只写入迁移清单。
- id: LEG-004
  title_zh: lod 字段混入 -log10(P)
  finding_zh: 示例中 GWAS 表格片段为“-log10(P)=8.7”，却写入 qtls[].lod=8.7。
  resolution_zh: 仅当产出分析为连锁/QTL 定位时迁移为 lod_score；GWAS 结果进入残留，需人工确认统计量。
- id: LEG-005
  title_zh: 推断内容
  finding_zh: relations[].is_inferred=true 的关系、模型生成的假设以及 causal_flag 均可能是推断结果。
  resolution_zh: 推断关系与模型生成假设不迁移；因果标记仅作 I 字段审核候选，关联不升级为因果。
- id: LEG-006
  title_zh: 规范与 schema 不一致
  finding_zh: 规范列出 document_sections.heading 等字段而 schema 缺失；示例又包含 schema 未定义的字段（如 heading、output_name）；disease_pests
    结构未定义。
  resolution_zh: 以 schema 叶子为覆盖基准；schema 外字段由迁移工具写入残留报告，不静默丢弃。
- id: LEG-007
  title_zh: null 与空值
  finding_zh: legacy 以 null、空串、空数组表示缺失。
  resolution_zh: 迁移时一律省略；不产生 null。
- id: LEG-008
  title_zh: 实体清单不是原子记录
  finding_zh: breed_entities 为文档级实体清单，与 v3 原子证据记录粒度不同。
  resolution_zh: 实体名称写入引用它的记录（关系、QTL 观测等）的名称字段；未被引用的实体属性进入残留。
- id: LEG-009
  title_zh: 结论缺少直接证据
  finding_zh: conclusions[] 没有 evidence_spans，只能经 evidence_list/supporting_* 间接引用；text_snippet 含省略号时不是逐字原文。
  resolution_zh: 能解析到逐字片段的结论迁移为 claim；否则拒绝并写入错误文件。
- id: LEG-010
  title_zh: 译文字段
  finding_zh: title_zh/title_en/claim_zh 为译文。
  resolution_zh: 译文不是原文证据，不迁移。
- id: LEG-011
  title_zh: 区间单位超出规范
  finding_zh: 规范规定 interval.unit 为 cM/bp，示例使用 Mb。
  resolution_zh: cM 写入 *_cm；bp/kb/Mb 按 vocabularies/units.yaml 精确换算为整数 bp；其他单位进入残留。
- id: LEG-012
  title_zh: 版本号格式
  finding_zh: legacy 版本写作 v1.0.0，当前契约使用不带前缀的语义化版本。
  resolution_zh: 迁移记录一律写入解析后的当前契约版本；legacy 版本写入迁移报告。
- id: MRG-001
  title_zh: 文档状态与原子事实分离
  finding_zh: merged 含有智能体运行状态、治理评分、技能注册以及派生视图。
  resolution_zh: 保持原子格式；无明确语义或证据绑定的数据进入带原因的残留文件。
- id: MRG-002
  title_zh: Schema 通过不等于证据有效
  finding_zh: 原示例页码为 2221 等出版页，部分引文含省略号；资产 SHA-256 为截断字符串。
  resolution_zh: 显式偏移换算物理页；不完整引文不进入 source_quote；无效资产摘要拒绝而不修补。
- id: MRG-003
  title_zh: 样本和测定引用
  finding_zh: 观测通过 sample_ref/assay_ref 关联上下文，输入没有强制引用完整性。
  resolution_zh: 只按明确 ID 关联；重复 ID、已知测定的样本不匹配和冲突字段拒绝；未在输入定义的外部引用保留 ID 并标记。
- id: MRG-004
  title_zh: 开放组学对象与类型差异
  finding_zh: omics_feature 可放任意字段，示例 go_term 为数组；部分统计字段无概率范围约束。
  resolution_zh: 使用现有同名组学字段，单元素数组可解包，多值不拼接；输出一律经当前契约和数据集规则校验。
