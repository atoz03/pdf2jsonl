name: contract

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Contract consistency (catalog, releases, semver, Skill sync, mappings, docs, examples)
        run: bdc check --strict
      - name: Tests
        run: pytest
      - name: Generated docs are committed
        run: |
          bdc generate
          git diff --exit-code -- docs/generated
