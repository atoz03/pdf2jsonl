# Profile — selects and configures fields of the contract for one use case. Part of the contract; edits require a release.
profile_format: 1
name: pdf_extraction
title_zh: PDF 文献抽取
description_zh: PDF 到原子化 JSONL 的抽取画像。模型只填写可获得性为 D（直接抽取）的字段并附逐字证据；N（标准化）字段由管线按命名规则确定性生成；I/G/F 字段不暴露，绝不补造。
selection:
  base: all_active
  include_availability: [D]
  include_groups: [common, agent, skills, transform]
  exclude_fields: [common.source_abstract]
document_fields:
- common.source_title
- common.source_doi
- common.source_year
- common.source_authors
- common.source_language
- common.source_version
- common.crop_name
- common.species_name
- common.source_type
- common.source_document_type
- common.source_journal
- common.source_volume
- common.source_issue
- common.source_page_range
- common.source_pmid
- common.source_keywords
- common.source_funding
- common.source_affiliations
document_defaults:
  common.source_type: paper
roles:
  provenance:
    document_id: common.source_id
    title: common.source_title
    page: common.source_page
    section: common.source_section
    quote: common.source_quote
    table_figure: common.source_table_figure
    row_key: common.source_table_row_key
    column_key: common.source_table_column_key
    span: common.source_span
    locator: common.source_locator
    part: common.source_part
    file_sha256: common.source_file_sha256
  semantic:
    record_kind: common.record_kind
    source_type: common.source_type
    doi: common.source_doi
    year: common.source_year
    authors: common.source_authors
    language: common.source_language
    crop: common.crop_name
    statement: agent.finding_text
    qtl_mention: common.qtl_names
    gene_mention: common.gene_names
    software_name: skills.software_name
    software_version: skills.software_version
    raw_value: common.original_value
    raw_unit: common.original_unit
    relation_subject: transform.subject_mention
    relation_predicate: transform.predicate_mention
    relation_object: transform.object_mention
    statement_role: agent.statement_role
    step_condition: agent.step_condition
system_fields:
  common.record_id:
    rule: stable_record_id
  common.schema_version:
    rule: resolved_schema_version
  common.schema_name:
    rule: resolved_schema_name
  common.extraction_profile:
    rule: profile_name
  common.record_kind:
    rule: candidate_record_kind
  common.record_grain:
    rule: grain_from_record_kind
  common.source_id:
    rule: document_source_id
  common.source_uri:
    rule: doi_uri
  common.source_locator:
    rule: evidence_locator
  common.source_span:
    rule: evidence_span
  common.source_file_sha256:
    rule: input_file_sha256
  common.source_part:
    rule: evidence_source_part
    params:
      main: main_text
      supplement: supplement
      appendix: appendix
  common.extraction_method:
    rule: backend_extraction_method
  common.extraction_run_id:
    rule: run_id
  common.review_status:
    rule: validation_outcome
    params:
      clean: auto_validated
      needs_review: pending_review
  common.record_version:
    rule: constant
    params:
      value: 1
  common.qc_rule_set_version:
    rule: qc_rule_set_version
  common.qc_failure_codes:
    rule: warning_codes
  common.missing_fields:
    rule: missing_audit
  common.dataset_id:
    rule: cli_option
    params:
      option: dataset_id
  common.dataset_version:
    rule: cli_option
    params:
      option: dataset_version
  common.source_asset_id:
    rule: cli_option
    params:
      option: source_asset_id
normalizers:
- rule: unit_normalization
  inputs:
    raw_value: common.original_value
    raw_unit: common.original_unit
  outputs:
    value: common.normalized_value
    min: common.normalized_min_value
    max: common.normalized_max_value
    unit: common.normalized_unit
- rule: relation_anchors
  inputs:
    quote: common.source_quote
    subject: transform.subject_mention
    predicate: transform.predicate_mention
    object: transform.object_mention
  outputs:
    markers: transform.entity_links
    predicate_start: transform.predicate_start_offset
    predicate_end: transform.predicate_end_offset
    predicate_code: transform.predicate_code
    resolution: transform.relation_resolution
- rule: relation_nature_from_predicate
  # The predicate label is curated (availability I) and deliberately not offered to the model. A fresh extraction
  # has none, so the pass reads the code the pipeline matched instead (same contract data, deterministic); a
  # reviewed record keeps its label, which wins over the code (AMB-042, AMB-043).
  inputs:
    predicate: transform.predicate_label
    code: transform.predicate_code
  outputs:
    nature: transform.relation_nature
- rule: claim_strength_from_evidence
  # What the predicate asserts (nature) × how strong the relation evidence is (relation_evidence_type, human
  # judgement): a causal wording is never silently settled by the verb alone (AMB-046).
  inputs:
    nature: transform.relation_nature
    evidence_type: transform.relation_evidence_type
  outputs:
    strength: transform.claim_strength
- rule: validation_status_from_links
  # "Candidate" or "the paper reports an experiment validating it": read from the validated_by link only, never
  # from the wording of the finding (AMB-045).
  inputs:
    links: agent.validated_by_record_ids
    predicate: transform.predicate_mention
  outputs:
    status: transform.validation_status
- rule: evidence_origin_from_document_type
  # A review reports someone else's experiment; the record says so instead of looking like a primary study
  # (AMB-047).
  inputs:
    document_type: common.source_document_type
  outputs:
    origin: transform.evidence_origin
- rule: cited_items_from_quote
  # Which supplementary figure/table a record's own quote cites, so a record is tied to the part of the paper
  # outside the main text (AMB-044).
  inputs:
    quote: common.source_quote
  outputs:
    items: transform.cited_source_items
generated_fields:
  common.extraction_confidence:
    rule: backend_confidence
system_records:
- record_kind: asset_manifest
  rule: input_asset_manifest
  fields:
    common.asset_kind:
      rule: constant
      params:
        value: raw_pdf
    common.asset_format:
      rule: constant
      params:
        value: PDF
    common.asset_sha256:
      rule: input_file_sha256
    common.asset_size_bytes:
      rule: input_file_size
    common.asset_uri:
      rule: cli_option
      params:
        option: asset_uri
model_record_kinds: [claim, observation, method, analysis_result, phenotype_observation, environment_observation, genotype_observation]
record_links:
  evidence:
    field: agent.evidence_record_ids
    target_kinds: [claim, observation, analysis_result, phenotype_observation, environment_observation, genotype_observation]
    description_zh: 本候选所依据的其他候选（观测、分析结果或更具体的结论）的 ref；只引用同一文献中确实支撑它的候选
  method:
    field: skills.method_record_ids
    target_kinds: [method]
    description_zh: 产生本结果或观测所用方法候选（record_kind 为 method）的 ref
  tests:
    field: agent.tests_record_ids
    target_kinds: [claim]
    description_zh: 本实验步骤、观测或结果所检验的假设、科学问题或研究目标候选的 ref；只在原文表明该实验为检验它而做时引用（如 to test whether）
  addresses:
    field: agent.addresses_record_ids
    target_kinds: [claim]
    description_zh: 本假设、研究目标或结论所回应的研究背景、科学问题、研究目标或假设候选的 ref
  prerequisite:
    field: agent.prerequisite_record_ids
    target_kinds: [method, observation, analysis_result, phenotype_observation, environment_observation, genotype_observation]
    description_zh: 本步骤以其产出（材料、数据或结果）为输入的前置候选的 ref；原文表明前一步的产出用于本步骤时引用
  validated_by:
    field: agent.validated_by_record_ids
    target_kinds: [method, observation, analysis_result, phenotype_observation, environment_observation, genotype_observation]
    description_zh: 论文自己报告的、用于验证本结论的实验候选（互补/转基因/基因编辑、表达分析、酶活、互作等）的 ref；只在其确实是验证该结论的实验时引用，关联证据与验证证据各自保留
evidence_policy:
  required_for_model_records: true
  verify_quote: true
  page_search_radius: 1
  max_quote_chars: 1200
  value_presence_check: warning
  # Only fields whose value is a fact of the paper (a name, id, coordinate, measurement, statistic) are checked
  # for verbatim presence. Fields the paper states in its own words (assertion, method_spec, condition,
  # interface_spec, study_design) are paraphrases by definition, so the check would flag the writing, not an
  # error — see docs/review.md and AMB-014.
  value_presence_roles: [entity_mention, entity_id, entity_attribute, reference_frame, context_key, measurement, statistic]
  value_presence_exempt: [common.source_language]
required_fields:
  always: [common.schema_name]
ambiguities: [AMB-013, AMB-038, AMB-039, AMB-041]
notes_zh: common.source_abstract 不进入逐行记录（高频行避免重复长文本，见 v3 source_title 定义），由 document_bundle 视图或迁移数据承载；omics 组字段见 pdf_extraction_omics 画像。
